# ArgoCD Application — ingress-nginx on the workload1 (spoke) cluster.
#
# Phase 6 (REQ-WL-02). Mirrors argocd/apps/spoke/ingress-nginx.yaml EXACTLY,
# repointed to the workload1 spoke: this is the second concrete spoke, the one
# that makes the auto-008 §6 / phase-6 "fan-out is real" claim true. The
# ApplicationSet refactor (one generator over all *-spoke clusters) lands as its
# own change now that there is more than one spoke; until then each spoke gets a
# plain per-service Application — the before/after of that refactor is the phase-6
# blog post.
#
# Multi-source: the upstream chart + this repo's static values
# (platform-services/ingress/values.yaml — REUSED verbatim from the platform
# spoke; the only per-cluster differences are the ephemeral cert ARN and the
# wildcard domain, both overlaid at registration, never committed). The
# account-ephemeral cert ARN (aws-load-balancer-ssl-cert) is NOT committed — it
# is overlaid into `helm.valuesObject` at registration time from the workload1
# spoke cluster-Secret annotation `k8-platform.io/certificate-arn` (auto-008 §5).
# Until the workload1 spoke is registered this Application has no destination and
# is inert.
#
# INERT UNTIL the live workload1-spoke registration step replaces the
# OVERLAID-AT-REGISTRATION placeholder below — see decisions/auto-008 "Build
# split: live-coupled".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload1-ingress-nginx
  namespace: argocd
  annotations:
    # After the cluster + spoke registration (wave 10) but before hello (wave 30).
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform-spoke
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.10.0
      helm:
        valueFiles:
          - $values/platform-services/ingress/values.yaml
        # OVERLAID-AT-REGISTRATION: the live registration step patches
        # valuesObject with the real cert ARN. Kept absent in git (ephemeral).
    - repoURL: https://github.com/lago-morph/k8-platform.git
      targetRevision: main
      ref: values
  destination:
    name: workload1-spoke
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
