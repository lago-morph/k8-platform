# ArgoCD ApplicationSet — ingress-nginx on every spoke cluster (ADR-0010).
#
# Replaces the per-spoke plain Applications (spoke-ingress-nginx +
# workload1-ingress-nginx) that carried registration-time overlay placeholders:
# the cluster generator selects every registered spoke's ArgoCD cluster Secret
# (label k8-platform.io/cluster-role: spoke) and templates the account-ephemeral
# cert ARN from that Secret's k8-platform.io/* annotations (the cluster-facts
# contract, docs/decisions/0010). Nothing account-specific is committed and
# nothing is hand-overlaid — bootstrap selfHeal has nothing to fight.
#
# INERT until a labeled cluster Secret exists (empty generator → zero apps),
# exactly as the per-app files were inert before registration. The producer of
# the labeled Secret is OI-2026-06-07-1 (SUBSTRATE row 5, PR-2 of ADR-0010).
#
# goTemplate + missingkey=error: a registration Secret missing a contract
# annotation fails generation loudly instead of rendering an empty value.
# preserveResourcesOnDeletion: a deleted/relabeled Secret must not cascade-
# delete live spoke workloads.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            k8-platform.io/cluster-role: spoke
  template:
    metadata:
      name: '{{index .metadata.labels "k8-platform.io/short-name"}}-ingress-nginx'
      annotations:
        # After the cluster + spoke registration (wave 10) but before hello
        # (wave 30). Waves ride the GENERATED Application so bootstrap-relative
        # ordering is preserved (ADR-0010).
        argocd.argoproj.io/sync-wave: "20"
    spec:
      project: platform-spoke
      sources:
        - repoURL: https://kubernetes.github.io/ingress-nginx
          chart: ingress-nginx
          targetRevision: 4.10.0
          helm:
            valueFiles:
              - $values/platform-services/ingress/values.yaml
            # Cluster-facts contract (ADR-0010): the NLB cert ARN comes from
            # this spoke's own wildcard ACM cert via the cluster Secret.
            valuesObject:
              controller:
                service:
                  annotations:
                    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: '{{index .metadata.annotations "k8-platform.io/certificate-arn"}}'
        - repoURL: https://github.com/lago-morph/k8-platform.git
          targetRevision: main
          ref: values
      destination:
        # The matched cluster Secret's NAME (e.g. platform-spoke) — distinct
        # from the short-name label used for the Application name above.
        name: '{{.name}}'
        namespace: ingress-nginx
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
