# ArgoCD Application — ingress-nginx on the platform (spoke) cluster.
#
# auto-008 decision: PLAIN per-service Application (not an ApplicationSet — only
# one spoke exists in phase 3; the ApplicationSet refactor lands in phase 6 when
# the workload cluster makes fan-out real). Targets the spoke by NAME
# (destination.name: platform-spoke — the ArgoCD cluster Secret created at
# registration), under the platform-spoke AppProject.
#
# Multi-source: the upstream chart + this repo's static values
# (platform-services/ingress/values.yaml). The account-ephemeral cert ARN
# (aws-load-balancer-ssl-cert) is NOT committed — it is overlaid into
# `helm.valuesObject` at registration time from the spoke cluster-Secret
# annotation `k8-platform.io/certificate-arn` (auto-008 §5). Until the spoke is
# registered this Application has no destination and is inert.
#
# INERT UNTIL the live spoke registration step replaces the
# OVERLAID-AT-REGISTRATION placeholder below — see decisions/auto-008 "Build
# split: live-coupled".
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-ingress-nginx
  namespace: argocd
  annotations:
    # After the cluster + spoke registration (wave 10) but before hello (wave 30).
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: platform-spoke
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.10.0
      helm:
        valueFiles:
          - $values/platform-services/ingress/values.yaml
        # OVERLAID-AT-REGISTRATION: the live registration step patches
        # valuesObject with the real cert ARN. Kept absent in git (ephemeral).
    - repoURL: https://github.com/lago-morph/k8-platform.git
      targetRevision: main
      ref: values
  destination:
    name: platform-spoke
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
