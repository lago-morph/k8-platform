# ArgoCD Application — the "hello" demo app on the workload1 (spoke) cluster
# (REQ-WL-05). Phase 6. Mirrors argocd/apps/spoke/hello.yaml, repointed to the
# workload1 spoke and re-scoped to the workload1 subdomain. Single in-repo Helm
# chart (platform-services/hello — REUSED; the subdomain is overlaid per-cluster
# via valuesObject so the one chart serves every spoke). Reachable at
# hello.workload1.<domain> over TLS once ingress-nginx + ExternalDNS converge.
# Plain per-service Application; INERT until the workload1 spoke is registered.
#
# OVERLAID-AT-REGISTRATION (ephemeral, AGENTS §8.1): helm.valuesObject.domain :=
# the live root domain. subdomain (workload1) is stable and committed here —
# distinct from the platform spoke's `platform`, so the two hello apps publish to
# disjoint hostnames.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload1-hello
  namespace: argocd
  annotations:
    # After ingress-nginx + external-dns (wave 20) are Healthy.
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: platform-spoke
  source:
    repoURL: https://github.com/lago-morph/k8-platform.git
    targetRevision: main
    path: platform-services/hello
    helm:
      # domain overlaid at registration; subdomain is stable (workload1 — disjoint
      # from the platform spoke's `platform`).
      valuesObject:
        subdomain: workload1
  destination:
    name: workload1-spoke
    namespace: hello
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
