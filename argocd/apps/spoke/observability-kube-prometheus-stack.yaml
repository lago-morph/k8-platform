# ArgoCD ApplicationSet — kube-prometheus-stack on the platform spoke
# (REQ-OBS-01/03/05, ADR-0010). The CENTRAL observability stack (Prometheus +
# Grafana + Alertmanager). Replaces the plain
# spoke-observability-kube-prometheus-stack Application. PLATFORM-ONLY
# (selector pins short-name=spoke): the central stack lives on the platform
# services cluster.
#
# Multi-source: the upstream chart + this repo's static values. The
# cluster-facts contract (docs/decisions/0010) templates the Grafana ingress
# host := grafana.<subdomain>.<domain> from the spoke's cluster Secret,
# overriding the committed render placeholder.
#
# INERT until a labeled cluster Secret exists; producer = OI-2026-06-07-1.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-kube-prometheus-stack
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            k8-platform.io/cluster-role: spoke
            k8-platform.io/short-name: spoke
  template:
    metadata:
      name: '{{index .metadata.labels "k8-platform.io/short-name"}}-observability-kube-prometheus-stack'
      annotations:
        # After ingress-nginx + ExternalDNS (wave 20) so the Grafana Ingress
        # resolves immediately. Wave 40 (phase-4 observability band).
        argocd.argoproj.io/sync-wave: "40"
    spec:
      project: platform-spoke
      sources:
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 65.8.1
          helm:
            valueFiles:
              - $values/platform-services/observability/kube-prometheus-stack/values.yaml
            # Cluster-facts contract (ADR-0010): hosts list replaced wholesale.
            valuesObject:
              grafana:
                ingress:
                  hosts:
                    - 'grafana.{{index .metadata.annotations "k8-platform.io/subdomain"}}.{{index .metadata.annotations "k8-platform.io/domain"}}'
        - repoURL: https://github.com/lago-morph/k8-platform.git
          targetRevision: main
          ref: values
      destination:
        name: '{{.name}}'
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
