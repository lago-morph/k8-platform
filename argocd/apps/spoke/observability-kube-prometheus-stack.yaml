# ArgoCD Application — kube-prometheus-stack on the platform (spoke) cluster.
# The CENTRAL observability stack (Prometheus + Grafana + Alertmanager,
# REQ-OBS-01/03/05). Plain per-service Application (not an ApplicationSet — the
# phase-6 refactor; see ingress-nginx.yaml header for the auto-008 rationale),
# targeting the spoke by NAME under the platform-spoke AppProject.
#
# Multi-source: the upstream chart + this repo's static values
# (platform-services/observability/kube-prometheus-stack/values.yaml). The
# account-ephemeral <domain> in the Grafana Ingress host is NOT committed — it is
# overlaid into helm.valuesObject at registration (grafana.ingress.hosts[0] :=
# grafana.platform.${domain}) from the spoke cluster-Secret annotation, exactly
# like ingress-nginx's cert ARN (auto-008 §5). INERT until the spoke is
# registered.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-observability-kube-prometheus-stack
  namespace: argocd
  annotations:
    # After ingress-nginx + ExternalDNS (wave 20) so the Grafana Ingress
    # resolves immediately. Wave 40 (phase-4 observability band).
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: platform-spoke
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.8.1
      helm:
        valueFiles:
          - $values/platform-services/observability/kube-prometheus-stack/values.yaml
        # OVERLAID-AT-REGISTRATION: the live registration step patches
        # valuesObject with grafana.ingress.hosts[0]=grafana.platform.<domain>.
        # Kept absent in git (ephemeral).
    - repoURL: https://github.com/lago-morph/k8-platform.git
      targetRevision: main
      ref: values
  destination:
    name: platform-spoke
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
