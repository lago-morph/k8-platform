# ArgoCD Application — Loki on the platform (spoke) cluster. The CENTRAL log
# store (REQ-OBS-01/05), queried by Grafana (kube-prometheus-stack, same
# cluster) and written to by the hub Alloy agent. Plain per-service Application
# targeting the spoke by NAME under the platform-spoke AppProject (see
# ingress-nginx.yaml header for the auto-008 rationale). INERT until the spoke is
# registered.
#
# Multi-source: the upstream chart + this repo's static values
# (platform-services/observability/loki/values.yaml). Single-binary, filesystem
# storage — no account-ephemeral values to overlay (no S3 bucket / domain), so
# unlike kube-prometheus-stack there is no valuesObject patch at registration.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-observability-loki
  namespace: argocd
  annotations:
    # Wave 40 (phase-4 observability band), same as kube-prometheus-stack.
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: platform-spoke
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.55.0
      helm:
        valueFiles:
          - $values/platform-services/observability/loki/values.yaml
    - repoURL: https://github.com/lago-morph/k8-platform.git
      targetRevision: main
      ref: values
  destination:
    name: platform-spoke
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
