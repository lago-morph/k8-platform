# ArgoCD ApplicationSet — Keycloak on the platform spoke (REQ-AUTH-01,
# ADR-0010). Replaces the plain spoke-keycloak Application. PLATFORM-ONLY:
# the generator selector additionally pins short-name=spoke — the auth layer
# runs on the platform services cluster, not on workload spokes.
#
# Multi-source: the upstream Bitnami chart (PINNED 21.4.4 → Keycloak 24.0.x;
# repo allowlisted EXACT in argocd/projects/platform-spoke.yaml) + this repo's
# static values (platform-services/keycloak/values.yaml). The cluster-facts
# contract (docs/decisions/0010) templates ingress.hostname :=
# auth.<subdomain>.<domain> from the spoke's cluster Secret.
#
# The DB endpoint (externalDatabase.host/port) is deliberately NOT a cluster
# fact — it is database connection data from the XDatabase XR and travels the
# keycloak-db connection-Secret path (ADR-0010 "out of contract"): hub
# PushSecret → ASM k8-platform/keycloak-db → the spoke ExternalSecret in the
# third (directory) source below, with HOST/PORT overriding the chart's
# ConfigMap placeholders via extraEnvVarsSecret (envFrom last-source-wins —
# premise pinned by tests/unit/test_keycloak_db_env_precedence.sh).
#
# The third source (platform-services/keycloak/spoke/) also delivers the
# realm-import ConfigMap and the generated keycloak-admin Secret (ESO
# Password generator — see that file for why NOT XPlatformSecret). All its
# manifests ride wave -1 (before the chart's wave-0 resources; ArgoCD waits
# for wave health before advancing, so secrets/CM the pods mount must never
# land in a LATER wave than the StatefulSet).
#
# INERT until a labeled cluster Secret exists; producer = OI-2026-06-07-1.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: keycloak
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            k8-platform.io/cluster-role: spoke
            k8-platform.io/short-name: spoke
  template:
    metadata:
      name: '{{index .metadata.labels "k8-platform.io/short-name"}}-keycloak'
      annotations:
        # After ingress-nginx + external-dns (wave 20); the auth layer sits
        # above the base add-ons (REQ-AUTH-06 reaches Keycloak through the
        # spoke's nginx/NLB).
        argocd.argoproj.io/sync-wave: "40"
    spec:
      project: platform-spoke
      sources:
        - repoURL: https://charts.bitnami.com/bitnami
          chart: keycloak
          targetRevision: 21.4.4
          helm:
            valueFiles:
              - $values/platform-services/keycloak/values.yaml
            # Cluster-facts contract (ADR-0010).
            valuesObject:
              ingress:
                hostname: 'auth.{{index .metadata.annotations "k8-platform.io/subdomain"}}.{{index .metadata.annotations "k8-platform.io/domain"}}'
              # KC_HOSTNAME pins the OIDC issuer to the public hostname and
              # strict-https forces the https scheme. Without these the
              # issuer derives from request headers, and the NLB terminates
              # TLS at L4 so nginx honestly forwards X-Forwarded-Proto=http
              # → an http:// issuer that poisons every OIDC consumer
              # (clean build #3, 2026-06-12). Templated from the SAME
              # cluster facts as ingress.hostname; the committed values.yaml
              # sets no extraEnvVars, so this list replaces nothing.
              extraEnvVars:
                - name: KC_HOSTNAME
                  value: 'auth.{{index .metadata.annotations "k8-platform.io/subdomain"}}.{{index .metadata.annotations "k8-platform.io/domain"}}'
                - name: KC_HOSTNAME_STRICT_HTTPS
                  value: "true"
        - repoURL: https://github.com/lago-morph/k8-platform.git
          targetRevision: main
          ref: values
        # Spoke-side keycloak manifests: keycloak-db ExternalSecret (the
        # OI-2026-06-07-5 consumer half), the generated keycloak-admin
        # Secret, and the realm-import ConfigMap.
        - repoURL: https://github.com/lago-morph/k8-platform.git
          targetRevision: main
          path: platform-services/keycloak/spoke
      destination:
        name: '{{.name}}'
        namespace: keycloak
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
