# ArgoCD ApplicationSet — Grafana Alloy telemetry agent on the HUB
# (management) cluster (phase 4, REQ-OBS-02, ADR-0010).
#
# THE deliberate exception in this directory: the agent RUNS on the hub but
# its remote-write/Loki-push endpoints live on the PLATFORM SPOKE and derive
# from the spoke's <domain>/<subdomain> facts. So the cluster generator
# selects the SPOKE's cluster Secret (for the facts) while the template
# HARD-CODES the hub in-cluster destination and the hub-addons project — it
# does NOT use the generated {{.name}} destination like its siblings. This is
# the auto-008 reviewer-F1 "accidentally target the hub" hazard made explicit
# and deliberate; ADR-0010 records the reversal rationale (pinned project +
# AppProject destination whitelists + missingkey=error keep it contained).
# hub-addons permits ONLY the hub server + monitoring-agent namespace, so a
# drift toward a spoke destination is rejected by the AppProject.
#
# The endpoints reach the agent as ENV VARS (alloy.extraEnv), consumed by
# sys.env() lookups in the committed river config
# (platform-services/observability/alloy/values.yaml) — helm values cannot
# patch inside the config string, env indirection keeps the config static.
#
# Filename note: lives under argocd/apps/spoke/ alongside the other obs apps
# for locality, but it is a HUB app — tests/unit/test_observability_apps.sh §3
# gates its special shape and tests/unit/test_spoke_apps.sh branches on it.
#
# INERT until the platform spoke's labeled cluster Secret exists; producer =
# OI-2026-06-07-1 (ADR-0010 PR-2).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-alloy-mgmt
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            k8-platform.io/cluster-role: spoke
            k8-platform.io/short-name: spoke
  template:
    metadata:
      name: hub-observability-alloy
      annotations:
        # Wave 40 (phase-4 observability band) — after the spoke central stack
        # so the remote_write / Loki-push endpoints exist before the agent
        # starts.
        argocd.argoproj.io/sync-wave: "40"
    spec:
      project: hub-addons
      sources:
        - repoURL: https://grafana.github.io/helm-charts
          chart: alloy
          targetRevision: 0.12.6
          helm:
            valueFiles:
              - $values/platform-services/observability/alloy/values.yaml
            # Cluster-facts contract (ADR-0010): spoke-derived endpoints as env
            # vars; the river config reads them via sys.env().
            valuesObject:
              alloy:
                extraEnv:
                  - name: SPOKE_PROMETHEUS_REMOTE_WRITE_URL
                    value: 'https://prometheus.{{index .metadata.annotations "k8-platform.io/subdomain"}}.{{index .metadata.annotations "k8-platform.io/domain"}}/api/v1/write'
                  - name: SPOKE_LOKI_PUSH_URL
                    value: 'https://loki.{{index .metadata.annotations "k8-platform.io/subdomain"}}.{{index .metadata.annotations "k8-platform.io/domain"}}/loki/api/v1/push'
        - repoURL: https://github.com/lago-morph/k8-platform.git
          targetRevision: main
          ref: values
      destination:
        # The HUB, in-cluster — hard-coded on purpose (see header). This is why
        # platform-spoke cannot host it and why the hub-addons project exists.
        server: https://kubernetes.default.svc
        namespace: monitoring-agent
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
