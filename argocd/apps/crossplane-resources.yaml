# ArgoCD Application — syncs crossplane/ (XRDs, Compositions, and
# CRD-dependent Kyverno ClusterPolicies) from this Git repo to the
# management cluster.
#
# Sync ordering note: this Application lands XRDs, Compositions, AND
# the policies under crossplane/policies/ (Kyverno ClusterPolicies that
# reference platform.k8-platform.io kinds and so must wait for the
# XRDs to install before they admit). Per-resource sync-wave
# annotations enforce: XRDs+Compositions at wave 0 (default), policies
# at wave 1. The ClusterSecretStore (in management-cluster-config) MUST
# be Ready BEFORE any PlatformSecret claim renders an ExternalSecret
# that references it; the parent app sync-wave on management-cluster-
# config (-10) vs this app (0) enforces that.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: k8-platform
  source:
    repoURL: https://github.com/lago-morph/k8-platform.git
    targetRevision: main
    path: crossplane
    directory:
      recurse: true
      include: '{xrds/*.yaml,compositions/*.yaml,policies/*.yaml,rbac/*.yaml}'
      # claims/ deliberately excluded — those are example manifests,
      # not platform resources. Users apply them by hand.
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
