# ArgoCD Application — syncs crossplane/ (XRDs, Compositions, and
# CRD-dependent Kyverno ClusterPolicies) from this Git repo to the
# management cluster.
#
# Sync ordering note: this Application lands XRDs, Compositions, AND
# the policies under crossplane/policies/ (Kyverno ClusterPolicies that
# reference platform.k8-platform.io kinds and so must wait for the
# XRDs to install before they admit). Per-resource sync-wave
# annotations enforce: XRDs+Compositions at wave 0 (default), policies
# at wave 1. The ClusterSecretStore (in management-cluster-config) MUST
# be Ready BEFORE any PlatformSecret claim renders an ExternalSecret
# that references it; the parent app sync-wave on management-cluster-
# config (-10) vs this app (0) enforces that.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-resources
  namespace: argocd
  annotations:
    # Wave -2 — must apply BEFORE the XRDs themselves (wave -1) so this
    # Application's tightened include glob takes effect before the first
    # XRD sync. Without the glob tighten, ArgoCD would slurp
    # `xrds/*/render-fixtures/input.yaml` as live cluster objects (those
    # files declare XRs with v1 `claimRef` fields, which v2 admission
    # rejects). v2 migration: SEG-1 step 1a.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: k8-platform
  source:
    repoURL: https://github.com/lago-morph/k8-platform.git
    targetRevision: main
    path: crossplane
    directory:
      recurse: true
      # v2 migration (SEG-1 step 1a) — narrowed include glob:
      #   - `xrds/platform-*.yaml` matches direct children of xrds/ only,
      #     NOT files under xrds/*/render-fixtures/.
      #   - `policies/` dropped entirely; the only file there
      #     (09-platform-secret-namespace-allowed.yaml) was deleted as
      #     part of SEG-1 because v2 namespaced XRs use standard
      #     Kubernetes RBAC, not Kyverno ClusterPolicy, for namespace-
      #     scope enforcement.
      # auto-008: widened `xrds/platform-*.yaml` → `xrds/*.yaml` so the
      # XSpokeAccess XRD (xrds/xspokeaccess.yaml) — and any other non-
      # `platform-`-prefixed XRD (e.g. xrds/xdatabase.yaml) — is synced
      # alongside its Composition (compositions/*.yaml). Without this the
      # Composition would sync but its XRD would not, leaving the
      # compositeTypeRef unbound. The glob still matches only DIRECT
      # children of xrds/ (not the xrds/*/render-fixtures/ subdirs); those
      # are additionally kept out by the explicit `exclude` below.
      # auto-011: added `providerconfig/*.yaml` so the shared AWS
      # ClusterProviderConfig `default` (crossplane/providerconfig/) syncs —
      # without it every composed MR fails with "cannot get referenced
      # ProviderConfig: ClusterProviderConfig ... default not found".
      include: '{xrds/*.yaml,compositions/*.yaml,rbac/*.yaml,providerconfig/*.yaml}'
      # Explicit exclude — the include glob above did NOT actually keep the
      # fixtures out. ArgoCD swept xrds/platform-*/render-fixtures/{input,
      # expected}.yaml into the sync, so each render-probe XR appeared TWICE →
      # "one or more synchronization tasks are not valid" → the WHOLE app failed
      # to sync, so the XRDs/Compositions never installed and the
      # platform-cluster XR could not be created ("CRD not installed"). Worse:
      # had it ever synced it would have applied render-probe-cluster as a REAL
      # XPlatformCluster and provisioned a throwaway EKS cluster. Observed live
      # 2026-06-06. NEXT SESSION: verify crossplane-resources reaches Synced with
      # this exclude; if ArgoCD's glob still leaks the fixtures, move them out of
      # crossplane/ entirely (e.g. tests/render-fixtures/) and repoint SPEC-S9.
      exclude: '**/render-fixtures/**'
      # claims/ deliberately excluded — those are example manifests,
      # not platform resources. Users apply them by hand.
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
