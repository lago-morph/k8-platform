# ArgoCD Application — syncs clusters/management/ to the management
# cluster. Lands ClusterSecretStores, namespace overlays, and any other
# management-cluster-specific resources.
#
# sync-wave: -10 — must apply BEFORE crossplane-resources (wave 0)
# because PlatformSecret Compositions render ExternalSecrets that
# reference the ClusterSecretStore by name. ESO requires the
# ClusterSecretStore to be Ready before it'll reconcile.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-cluster-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: k8-platform
  source:
    repoURL: https://github.com/lago-morph/k8-platform.git
    targetRevision: main
    path: clusters/management
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
