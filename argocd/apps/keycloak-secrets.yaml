# ArgoCD Application — the phase-5 keycloak XPlatformSecret XRs (REQ-AUTH-01
# "PlatformSecret claims back every Keycloak secret").
#
# Applied to the HUB (Crossplane runs there): each XR provisions an ASM
# container named k8-platform/keycloak/<name> with IN-PLATFORM generated
# material (the platform-secret Composition's material chain, 2026-06-11 —
# zero out-of-band writes) plus a hub-side ExternalSecret mirror. The SPOKE
# consumes the same deterministic ASM keys via committed ExternalSecrets
# (platform-services/keycloak/spoke/keycloak-admin-externalsecret.yaml).
#
# These XRs were committed (2026-06-07) but never synced by any Application
# — found during the OI-2026-06-07-5 build. This Application closes that
# gap and is what makes the secretsmanager-Secret live-check kind REAL
# (AWSCURRENT + PlatformSecret tags — the Task-3 live-verify producer).
#
# Wave 33: with keycloak-db, before the XRs' own wave-35 annotations matter
# and well before the spoke keycloak workload (40).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "33"
spec:
  project: k8-platform
  source:
    repoURL: https://github.com/lago-morph/k8-platform.git
    targetRevision: main
    path: platform-services/keycloak/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
