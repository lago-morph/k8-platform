# ArgoCD AppProject scoping all platform-managed Applications.
#
# Tight scope by design:
#   - sourceRepos: this repo only (no third-party charts via Argo —
#     those go through Crossplane/Helm in terraform).
#   - destinations: management cluster's namespaces only (workload
#     clusters get their own Project later).
#   - clusterResourceWhitelist / namespaceResourceWhitelist scoped to
#     the kinds this project actually deploys (XRDs, ClusterSecretStores,
#     etc.); broaden deliberately, not silently.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: k8-platform
  namespace: argocd
spec:
  description: "Platform-managed resources (XRDs, Compositions, ClusterSecretStores)"
  sourceRepos:
    - "https://github.com/lago-morph/k8-platform.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "apiextensions.crossplane.io"
      kind: "*"
    - group: "external-secrets.io"
      kind: "ClusterSecretStore"
    - group: "kyverno.io"
      kind: "ClusterPolicy"
    - group: ""
      kind: "Namespace"
    # crossplane/rbac/01-crossplane-externalsecrets.yaml grants the Crossplane
    # composite reconciler RBAC for the ExternalSecret kind (ESO is not a
    # Crossplane provider, so there is no auto-RBAC). Those are cluster-scoped
    # ClusterRole + ClusterRoleBinding — without whitelisting them the whole
    # crossplane-resources app fails to sync ("resource ... is not permitted in
    # project k8-platform"), blocking the XRDs + Compositions. Scoped to exactly
    # these two kinds, not the whole rbac group, per the broaden-deliberately rule.
    - group: "rbac.authorization.k8s.io"
      kind: "ClusterRole"
    - group: "rbac.authorization.k8s.io"
      kind: "ClusterRoleBinding"
    # The single shared AWS ClusterProviderConfig (crossplane/providerconfig/)
    # is a cluster-scoped Upbound provider config; crossplane-resources syncs it
    # so every composed MR can resolve its providerConfigRef.
    - group: "aws.m.upbound.io"
      kind: "ClusterProviderConfig"
  namespaceResourceWhitelist:
    - group: "external-secrets.io"
      kind: "*"
    - group: "platform.k8-platform.io"
      kind: "*"
    # crossplane/rbac/02-provider-kubernetes-spoke-cluster-secret.yaml grants
    # the provider-kubernetes SA namespace-scoped writes (argocd Secrets) +
    # reads (platform XPlatformClusters) for the ADR-0010 PR-2 registration
    # Secret producer. Namespaced Role/RoleBinding only — deliberately NOT
    # the cluster-scoped pair, per the broaden-deliberately rule.
    - group: "rbac.authorization.k8s.io"
      kind: "Role"
    - group: "rbac.authorization.k8s.io"
      kind: "RoleBinding"
