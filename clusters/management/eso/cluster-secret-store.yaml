# ClusterSecretStore — the bridge between ESO and AWS Secrets Manager
# for the management cluster.
#
# Authenticates via IRSA — the ESO controller pod runs as the
# `external-secrets` ServiceAccount in the `external-secrets` namespace,
# annotated with the IRSA role ARN by helm.tf. ESO then assumes that
# role when calling secretsmanager.
#
# The name `aws-secrets-manager` is load-bearing: every Composition that
# renders an ExternalSecret refers to this name. Renaming requires
# updating each Composition's secretStoreRef.name AND the unit test
# `test_platform_secret_composition.sh`.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            # MUST match the ESO Helm release's
            # serviceAccount.name / .namespace in
            # terraform/management/helm.tf
            name: external-secrets
            namespace: external-secrets
