# XPlatformCluster — provisions the platform-services EKS cluster.
#
# v2 migration (SEG-1 step 1f): a v2 namespaced XR (XPlatformCluster,
# apiextensions.crossplane.io/v2 + scope: Namespaced). The XR lives in the
# `platform` namespace (Namespace object is in clusters/platform/
# 00-namespace.yaml).
#
# Phase 3 / Iteration 3 (REQ-PLAT-01..06). Provisioning this XR creates,
# as one unit:
#   - EKS cluster + managed node group + IAM roles, in the shared private
#     subnets from the base module
#   - a DNS-validated wildcard ACM certificate `*.platform.<domain>`
#     (REQ-PLAT-05 — ACM via Crossplane, no cert-manager/ACME; see
#     docs/decisions/0003)
# The issued cert ARN is published on status.certificateArn and consumed
# by the platform cluster's ingress-nginx NLB.
#
# Account-ephemeral inputs (private subnet IDs, Route53 zone id, root
# domain) are NOT in this file (AGENTS §8.1). They are injected from the
# base Terraform output via the `cluster-network` EnvironmentConfig that
# terraform/management materializes (ADR-e557a40123 / docs/decisions/0003),
# so this manifest carries no placeholders and needs no per-account edits.
#
# WARNING: when this XR is synced by ArgoCD, Crossplane provisions REAL
# AWS resources. The corresponding ArgoCD Application
# (argocd/apps/platform-cluster-claim.yaml) is configured WITHOUT
# automated sync — sync is a deliberate operator action.
apiVersion: platform.k8-platform.io/v1alpha1
kind: XPlatformCluster
metadata:
  name: platform
  namespace: platform
  annotations:
    # Wave 10 — apply after the namespace (wave -1 inside this synced
    # directory) and well after the parent app's sync wave (`-2` for
    # crossplane-resources XRDs/Compositions). The XRD must be
    # Established before this XR can render.
    argocd.argoproj.io/sync-wave: "10"
spec:
  name: k8-platform-services
  region: us-east-1
  version: "1.32"
  dns:
    # Platform services are published at <service>.platform.<domain>; the
    # wildcard ACM cert covers *.platform.<domain>. ExternalDNS on the
    # cluster is scoped to this subdomain.
    subdomain: platform
  nodeGroup:
    # t3.medium x 2 sized for the 9-instance EC2 quota in this account
    # (management cluster uses 2 already; this leaves 5 headroom for
    # workload clusters). Bump after the quota is raised.
    instanceTypes: ["t3.medium"]
    desiredSize: 2
    minSize: 1
    maxSize: 3
