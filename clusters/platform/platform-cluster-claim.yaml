# kubeconform-skip — spec.vpc.subnetIds carries `subnet-REPLACE-ME-AZ*`
# placeholders that intentionally fail the XRD's `^subnet-[a-z0-9]+$`
# pattern so admission rejects this manifest until the operator
# substitutes real subnet IDs (see the TODO comment further down).
# The XRD's regex is the load-bearing admission gate; static lint would
# only flag the same fact. SPEC-S6 §5.4 allowlist.
#
# XPlatformCluster — provisions the platform-services EKS cluster.
#
# v2 migration (SEG-1 step 1f): rewritten from a v1 `PlatformCluster`
# claim into a v2 namespaced XR (XPlatformCluster, apiextensions.
# crossplane.io/v2 + scope: Namespaced). The XR lives in the `platform`
# namespace (Namespace object is in clusters/platform/00-namespace.yaml).
#
# Connection-secret routing (v2): the eks-cluster MR publishes
# `kubeconfig` to its provider connection-secret; the Composition
# re-exports that key to the XR's connection-details; the XR (this
# object) writes the merged secret to ref `platform-cluster-kubeconfig`
# in its OWN namespace (`platform`) — NOT `crossplane-system` as in v1.
# Phase 3 consumers must read `platform/platform-cluster-kubeconfig`.
#
# Phase 3 / Iteration 3 (REQ-PLAT-01..06).
#
# WARNING: when this XR is synced by ArgoCD, Crossplane provisions a
# REAL EKS cluster + managed node group + IAM roles. The corresponding
# ArgoCD Application (argocd/apps/platform-cluster-claim.yaml) is
# configured WITHOUT automated sync — sync is a deliberate operator
# action.
#
# Substitute spec.vpc.subnetIds with the actual private subnet IDs
# from the base module BEFORE syncing. The placeholders below cause
# admission to fail closed at sync time.
apiVersion: platform.k8-platform.io/v1alpha1
kind: XPlatformCluster
metadata:
  name: platform
  namespace: platform
  annotations:
    # Wave 10 — apply after the namespace (wave -1 inside this synced
    # directory) and well after the parent app's sync wave (`-2` for
    # crossplane-resources XRDs/Compositions). The XRD must be
    # Established before this XR can render.
    argocd.argoproj.io/sync-wave: "10"
spec:
  name: k8-platform-services
  region: us-east-1
  version: "1.32"
  vpc:
    subnetIds:
      # TODO(phase-3): replace with `terraform output -raw private_subnet_ids`
      # from the base module. Two subnets in two different AZs are
      # required by EKS HA.
      - subnet-REPLACE-ME-AZ1
      - subnet-REPLACE-ME-AZ2
  nodeGroup:
    # t3.medium x 2 sized for the 9-instance EC2 quota in this account
    # (management cluster uses 2 already; this leaves 5 headroom for
    # workload clusters). Bump after the quota is raised.
    instanceTypes: ["t3.medium"]
    desiredSize: 2
    minSize: 1
    maxSize: 3
  # v2 migration (SEG-1 step 1f): connection-secret target. The XR
  # writes its merged connection-details (kubeconfig/endpoint/cluster-
  # ca, declared on the XRD's spec.connectionDetails) to this Secret
  # name in the XR's namespace (`platform`). Phase 3 ApplicationSet
  # reads `platform/platform-cluster-kubeconfig`.
  writeConnectionSecretToRef:
    name: platform-cluster-kubeconfig
