# RBAC for the ADR-0010 PR-2 producer (OI-2026-06-07-1).
#
# LOCATION IS LOAD-BEARING (moved from crossplane/rbac/ 2026-07-05, clean
# build #4): the `platform`-namespace grants below can only apply after
# the `platform` namespace exists, and that namespace is created by THIS
# Application (platform-cluster-claim, include-listed with
# 00-namespace.yaml — ArgoCD applies Namespaces before namespaced kinds
# within one sync). When this file lived in crossplane/rbac/, the
# auto-synced crossplane-resources app raced the manual claim gate at
# bootstrap, failed "namespaces \"platform\" not found", exhausted its
# retries, and the ADR-0010 producer had no RBAC until an unrelated
# commit retriggered the sync (masked on builds #1-#3 by mid-build
# merges). Enforced by
# tests/unit/test_crossplane_resources_namespace_bootstrap_safe.sh.
#
# The xspokeaccess-aws Composition renders two provider-kubernetes Objects
# (kubernetes.m.crossplane.io/v1alpha1):
#
#   1. cluster-facts (Observe) — reads the paired XPlatformCluster XR in
#      the `platform` namespace.
#   2. spoke-cluster-secret — writes the ArgoCD spoke registration Secret
#      in the `argocd` namespace (the cluster-facts contract carrier).
#
# provider-kubernetes authenticates with its OWN pod ServiceAccount
# (ClusterProviderConfig `hub`, credentials.source: InjectedIdentity). The
# SA name is pinned to `provider-kubernetes` by the DeploymentRuntimeConfig
# in terraform/management/crossplane-phase3.tf (same pinning idiom as
# upbound-provider-family-aws in helm.tf — an unpinned SA gets a
# revision-hash-suffixed name and these bindings would never match).
#
# Crossplane's package manager auto-grants the CORE crossplane SA RBAC for
# the Object kind itself (provider-installed CRD — same mechanism noted in
# 01-crossplane-externalsecrets.yaml); what it does NOT grant is what the
# provider may do to the objects INSIDE the manifests. That is this file,
# deliberately namespace-scoped (no ClusterRole): secrets only in `argocd`,
# cluster-XR reads only in `platform`.
#
# Single-writer note (ADR-0010 PR-2 Decision 4): this grant makes the
# provider-kubernetes SA the only platform-authored writer of registration
# Secrets. It is a convergence/process control, not a security boundary —
# ArgoCD's own controllers inherently write argocd-namespace Secrets and
# Kyverno runs Audit-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-kubernetes-spoke-cluster-secret
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-kubernetes-spoke-cluster-secret
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
roleRef:
  kind: Role
  name: provider-kubernetes-spoke-cluster-secret
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-kubernetes-cluster-facts-read
  namespace: platform
rules:
  - apiGroups: ["platform.k8-platform.io"]
    resources: ["xplatformclusters", "xplatformclusters/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-kubernetes-cluster-facts-read
  namespace: platform
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
roleRef:
  kind: Role
  name: provider-kubernetes-cluster-facts-read
  apiGroup: rbac.authorization.k8s.io
