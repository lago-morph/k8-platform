# Happy-path: applying a PlatformSecret claim provisions an ASM secret
# AND an ExternalSecret in the claim's namespace.
#
# Per adversarial-reviewer B.B.3: claim name carries CHAINSAW_RUN_ID
# suffix so parallel CI runs against the same AWS account don't
# collide on the ASM secret name (which is derived from XR UID, but
# the K8s claim name still collides at the kubectl-apply layer).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: claim-creates-secret
spec:
  timeouts:
    apply: 30s
    # wait-for-Ready bound: the upbound AWS provider occasionally takes
    # several minutes to converge a single ASM Secret MR even when sibling
    # scenarios in the same run create theirs in <60s (intermittent slow
    # reconcile, not a stuck MR — a genuinely stuck MR still fails at this
    # bound, so it is not masked). 240s flaked claim-deletion-cleanup's
    # readiness gate on run 27109966256. OI-2026-05-28-1 Issue A.
    assert: 600s
    # The ASM-existence check below polls (create read-after-write lag);
    # give the script step headroom above the poll window. OI-2026-05-28-1.
    exec: 180s
  steps:
    - name: apply a PlatformSecret claim
      try:
        - apply:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario00
                namespace: default
              spec:
                refreshInterval: 30s
                region: us-east-1
                description: "chainsaw scenario 00 - happy path"

    - name: assert claim becomes Ready
      try:
        - assert:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario00
                namespace: default
              status:
                # v2 XRs have 3 conditions: Synced, Ready, Responsive
                # (chainsaw matches arrays element-wise at same index, so
                # listing all 3 in the order Crossplane outputs them).
                conditions:
                  - type: Synced
                    status: "True"
                  - type: Ready
                    status: "True"
                  - type: Responsive
                    status: "True"

    - name: assert ExternalSecret materialized in claim namespace
      try:
        - assert:
            resource:
              apiVersion: external-secrets.io/v1beta1
              kind: ExternalSecret
              metadata:
                name: scenario00
                namespace: default
              spec:
                secretStoreRef:
                  kind: ClusterSecretStore
                  name: aws-secrets-manager

    - name: assert rendered ASM Secret MR matches golden (SPEC-C4)
      # Partial match — only fields in expected/asm-secret.yaml are
      # checked. `($expected_region)` is resolved from the binding.
      bindings:
        - name: expected_region
          value: us-east-1
      try:
        - assert:
            file: expected/asm-secret.yaml

    - name: assert rendered ExternalSecret matches golden (SPEC-C4)
      try:
        - assert:
            file: expected/external-secret.yaml

    - name: assert ASM secret exists (out-of-band aws CLI check, bounded poll)
      try:
        - script:
            content: |
              # chainsaw runs scripts under /bin/sh; pipefail is bash-only.
              set -u
              # The Composition derives the ASM name from XR UID.
              # In Crossplane v2 the XR is namespaced and its name
              # equals the user-created resource name (no separate
              # claim → XR promotion), so we look it up directly.
              xr="${CLAIM_NAME}"
              uid=$(kubectl get xplatformsecret -n default "$xr" -o jsonpath='{.metadata.uid}')
              key="k8-platform/${uid}"
              echo "Looking up ASM secret (bounded poll): $key"
              # ASM create is eventually consistent (read-after-write lag), so a
              # one-shot describe right after the XR goes Ready can transiently
              # 404. Poll until the secret is observable; only FAIL after the
              # window. Same antipattern as the deletion check (OI-2026-05-28-1).
              i=1
              while [ "$i" -le 30 ]; do
                if aws secretsmanager describe-secret \
                      --secret-id "$key" \
                      --region "${AWS_REGION:-us-east-1}" \
                      --output text 2>/dev/null | grep -q "$key"; then
                  echo "OK: ASM secret $key exists"
                  exit 0
                fi
                echo "  not observable yet (attempt $i/30); waiting 5s..."
                i=$((i + 1))
                sleep 5
              done
              echo "FAIL: ASM secret $key not observable after claim Ready"
              exit 1
            env:
              - name: CLAIM_NAME
                value: scenario00
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds across ALL namespaces. The scenarios in
          # this repo apply XRs to `namespace: default` (per commit 8526f46
          # "use literal 'default' namespace in composition-drift apply"),
          # NOT to chainsaw's per-test scratch namespace. A $NAMESPACE-bound
          # lookup would return nothing and the catch block would be
          # diagnostically empty — exactly what the 2026-05-28 PR #125
          # composition-drift timeout exposed (issue OI-2026-05-28-1).
          # `-A` surfaces the XR regardless of where the scenario put it.
          for xr_kind in xplatformsecret xplatformcluster xdatabase; do
            kubectl get "$xr_kind" -A \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
              | while read -r ns name; do
                  [ -z "$name" ] && continue
                  kubectl describe "$xr_kind" -n "$ns" "$name" 2>&1 | head -c 1500
                  # Describe every MR referenced by this XR. MRs are
                  # cluster-scoped on the upbound providers, so no -n flag.
                  kubectl get "$xr_kind" -n "$ns" "$name" \
                    -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                    | while read -r api kind mrname; do
                        [ -z "$kind" ] && continue
                        kubectl describe "$kind.$api" "$mrname" 2>&1 | head -c 1000
                      done
                done
          done
    - events:
        namespace: ($namespace)
