# Happy-path: applying a PlatformSecret claim provisions an ASM secret
# AND an ExternalSecret in the claim's namespace.
#
# Per adversarial-reviewer B.B.3: claim name carries CHAINSAW_RUN_ID
# suffix so parallel CI runs against the same AWS account don't
# collide on the ASM secret name (which is derived from XR UID, but
# the K8s claim name still collides at the kubectl-apply layer).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: claim-creates-secret
spec:
  timeouts:
    apply: 30s
    assert: 240s
  steps:
    - name: apply a PlatformSecret claim
      try:
        - apply:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario00
                namespace: default
              spec:
                refreshInterval: 30s
                region: us-east-1
                description: "chainsaw scenario 00 — happy path"

    - name: assert claim becomes Ready
      try:
        - assert:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario00
                namespace: default
              status:
                conditions:
                  - type: Synced
                    status: "True"
                  - type: Ready
                    status: "True"

    - name: assert ExternalSecret materialized in claim namespace
      try:
        - assert:
            resource:
              apiVersion: external-secrets.io/v1beta1
              kind: ExternalSecret
              metadata:
                name: scenario00
                namespace: default
              spec:
                secretStoreRef:
                  kind: ClusterSecretStore
                  name: aws-secrets-manager

    - name: assert ASM secret exists (out-of-band aws CLI check)
      try:
        - script:
            content: |
              set -euo pipefail
              # The Composition derives the ASM name from XR UID.
              # In Crossplane v2 the XR is namespaced and its name
              # equals the user-created resource name (no separate
              # claim → XR promotion), so we look it up directly.
              xr="${CLAIM_NAME}"
              uid=$(kubectl get xplatformsecret -n default "$xr" -o jsonpath='{.metadata.uid}')
              key="k8-platform/${uid}"
              echo "Looking up ASM secret: $key"
              aws secretsmanager describe-secret \
                --secret-id "$key" \
                --region "${AWS_REGION:-us-east-1}" \
                --output text > /tmp/asm-describe.txt
              grep -q "$key" /tmp/asm-describe.txt
            env:
              - name: CLAIM_NAME
                value: scenario00
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds explicitly. When a new XRD is added,
          # append its XR kind here (e.g. xplatformbucket). v2 namespaced
          # XRs do NOT reliably register under `kubectl get composite`.
          for xr_kind in xplatformsecret xplatformcluster; do
            for xr in $(kubectl get "$xr_kind" -n "$NAMESPACE" -o name 2>/dev/null); do
              kubectl describe "$xr" -n "$NAMESPACE" 2>&1 | head -c 1500
              # Describe every MR referenced by this XR.
              kubectl get "$xr" -n "$NAMESPACE" -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                | while read -r api kind name; do
                    [ -z "$kind" ] && continue
                    kubectl describe "$kind.$api" "$name" 2>&1 | head -c 1000
                  done
            done
          done
        env:
          - name: NAMESPACE
            value: ($namespace)
    - events:
        namespace: ($namespace)
