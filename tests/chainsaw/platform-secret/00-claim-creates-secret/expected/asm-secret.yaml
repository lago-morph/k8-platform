# SPEC-C4 golden — rendered Upbound ASM Secret MR for scenario 00.
#
# v2 form (SEG-4 PR-T3):
#   - apiVersion: secretsmanager.aws.upbound.io → .aws.m.upbound.io
#     (v2 "modern" Upbound provider group)
#   - deletionPolicy: Delete REPLACED by
#     managementPolicies: [Observe, Create, Update, Delete]
#     (v2 lifecycle-policy model, full-actions list preserves prior
#     behavior).
#   - providerConfigRef gains kind: ClusterProviderConfig
#     (cluster-scoped variant; matches the repo's one shared IRSA
#     config).
#
# Chainsaw matches PARTIAL: only fields present here are asserted; the
# live MR may carry more. Volatile fields (uid, resourceVersion,
# creationTimestamp, managedFields, ownerReferences, status) are
# deliberately omitted per spec §5.
#
# metadata.name is omitted because the Composition derives it from the
# XR UID via Format transform — unstable per run. Region is bound from
# the claim via chainsaw bindings (see chainsaw-test.yaml step).
apiVersion: secretsmanager.aws.m.upbound.io/v1beta1
kind: Secret
metadata:
  namespace: default
spec:
  managementPolicies: [Observe, Create, Update, Delete]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    recoveryWindowInDays: 0
    region: ($expected_region)
    tags:
      ManagedBy: crossplane
      PlatformAbstraction: PlatformSecret
      Description: "chainsaw scenario 00 — happy path"
