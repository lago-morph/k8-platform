# SPEC-C4 golden — rendered ExternalSecret for scenario 00 (happy path).
#
# Composition sets metadata.name explicitly from the XR's metadata.name
# (in v2 the XR replaces the claim and lives in the consumer namespace),
# so we CAN match it exactly here. refreshInterval is from the XR spec.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scenario00
  namespace: default
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: scenario00
    creationPolicy: Owner
    deletionPolicy: Delete
