# SPEC-C4 golden — rendered ExternalSecret for scenario 00.
#
# Composition sets metadata.name explicitly from the claim name, so we
# CAN match it exactly here. refreshInterval is from the claim spec.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scenario00
  namespace: default
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: scenario00
    creationPolicy: Owner
    deletionPolicy: Delete
