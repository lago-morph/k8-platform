# Deletion cleanup: deleting a PlatformSecret claim removes both the
# ExternalSecret AND the underlying ASM secret.
#
# Per adversarial-reviewer A.13: assert deletionPolicy=Delete (not
# Orphan) is the actual default behaviour. Per B.E.8: rely on the
# Composition's recoveryWindowInDays=0 so the ASM secret is gone
# immediately, not "scheduled for deletion".
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: claim-deletion-cleanup
spec:
  timeouts:
    apply: 30s
    # wait-for-Ready bound: the upbound AWS provider occasionally takes
    # several minutes to converge a single ASM Secret MR even when sibling
    # scenarios in the same run create theirs in <60s (intermittent slow
    # reconcile, not a stuck MR — a genuinely stuck MR still fails at this
    # bound, so it is not masked). 240s flaked this scenario's readiness
    # gate on run 27109966256. OI-2026-05-28-1 Issue A.
    assert: 600s
    delete: 60s
    # The ASM-deletion check below polls (eventual consistency); give the
    # script step headroom above the poll window (30 x 5s = 150s). OI-2026-05-28-1.
    exec: 180s
  steps:
    - name: apply a claim
      try:
        - apply:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario01
                namespace: default
              spec:
                refreshInterval: 30s
                region: us-east-1
                description: "chainsaw scenario 01 - deletion cleanup"

    - name: wait for claim Ready (otherwise deletion races provisioning)
      try:
        - assert:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario01
                namespace: default
              status:
                # v2 XRs have 3 conditions: Synced, Ready, Responsive
                # (chainsaw matches arrays element-wise at same index).
                conditions:
                  - type: Synced
                    status: "True"
                  - type: Ready
                    status: "True"
                  - type: Responsive
                    status: "True"

    - name: assert rendered ASM Secret MR matches golden (SPEC-C4)
      bindings:
        - name: expected_region
          value: us-east-1
      try:
        - assert:
            file: expected/asm-secret.yaml

    - name: assert rendered ExternalSecret matches golden (SPEC-C4)
      try:
        - assert:
            file: expected/external-secret.yaml

    - name: capture the deterministic ASM key so we can verify teardown out-of-band
      try:
        - script:
            content: |
              # v2: XR is namespaced and shares the user's resource
              # name; the ASM key is the deterministic
              # k8-platform/<namespace>/<name> (2026-06-11).
              xr="${CLAIM_NAME}"
              echo "k8-platform/default/${xr}" > /tmp/scenario01-asm-key.txt
              echo "captured: $(cat /tmp/scenario01-asm-key.txt)"
            env:
              - name: CLAIM_NAME
                value: scenario01

    - name: delete the claim
      try:
        - delete:
            ref:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              name: scenario01
              namespace: default

    - name: assert ExternalSecret is gone
      try:
        - error:
            resource:
              apiVersion: external-secrets.io/v1beta1
              kind: ExternalSecret
              metadata:
                name: scenario01
                namespace: default

    - name: assert ASM secret is gone (out-of-band aws CLI check, bounded poll)
      try:
        - script:
            content: |
              # chainsaw runs scripts under /bin/sh; pipefail is bash-only.
              # NOTE: do NOT use `set -e` here: the grep-for-DeletedDate test
              # legitimately returns non-zero when the field is absent, which
              # under -e would abort the script mid-poll. OI-2026-05-28-1.
              set -u
              key=$(cat /tmp/scenario01-asm-key.txt)
              echo "Checking ASM key is gone (bounded poll): $key"
              # ASM deletion is eventually consistent, and a *scheduled* delete
              # leaves the secret present with a DeletedDate until the recovery
              # window elapses. Accept EITHER describe-secret returning NotFound
              # OR the returned JSON carrying a DeletedDate as success; only FAIL
              # if the secret is still FULLY present (no DeletedDate) after the
              # poll window. A one-shot describe here raced ASM consistency and
              # flaked 3/3 on PR #184 (OI-2026-05-28-1 Issue A).
              i=1
              while [ "$i" -le 30 ]; do
                if out=$(aws secretsmanager describe-secret \
                      --secret-id "$key" \
                      --region "${AWS_REGION:-us-east-1}" 2>/dev/null); then
                  if printf '%s' "$out" | grep -q '"DeletedDate"'; then
                    echo "OK: ASM secret $key scheduled for deletion (DeletedDate present)"
                    exit 0
                  fi
                  echo "  still fully present (attempt $i/30); waiting 5s..."
                else
                  echo "OK: ASM secret $key is gone (describe-secret NotFound)"
                  exit 0
                fi
                i=$((i + 1))
                sleep 5
              done
              echo "FAIL: ASM secret $key still fully present after claim delete"
              exit 1
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds across ALL namespaces. The scenarios in
          # this repo apply XRs to `namespace: default` (per commit 8526f46
          # "use literal 'default' namespace in composition-drift apply"),
          # NOT to chainsaw's per-test scratch namespace. A $NAMESPACE-bound
          # lookup would return nothing and the catch block would be
          # diagnostically empty — exactly what the 2026-05-28 PR #125
          # composition-drift timeout exposed (issue OI-2026-05-28-1).
          # `-A` surfaces the XR regardless of where the scenario put it.
          for xr_kind in xplatformsecret xplatformcluster xdatabase; do
            kubectl get "$xr_kind" -A \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
              | while read -r ns name; do
                  [ -z "$name" ] && continue
                  kubectl describe "$xr_kind" -n "$ns" "$name" 2>&1 | head -c 1500
                  # Describe every MR referenced by this XR. Three fixes vs the
                  # original (OI-2026-06-12-1, each alone left this loop silent):
                  # v2 XRs keep machinery under spec.crossplane
                  # (.spec.resourceRefs is empty on them); v2 .m. MRs are
                  # NAMESPACED in the XR's namespace (-n is a no-op for
                  # cluster-scoped kinds); and the type arg must be
                  # kind.version.group — a group/version apiVersion makes kubectl
                  # misparse TYPE/NAME and error before querying.
                  kubectl get "$xr_kind" -n "$ns" "$name" \
                    -o jsonpath='{range .spec.crossplane.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                    | while read -r api kind mrname; do
                        [ -z "$kind" ] && continue
                        kubectl describe "$kind.${api#*/}.${api%/*}" "$mrname" -n "$ns" 2>&1 | head -c 1000
                      done
                done
          done
    - events:
        namespace: ($namespace)
