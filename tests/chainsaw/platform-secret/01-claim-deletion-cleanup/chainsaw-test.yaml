# Deletion cleanup: deleting a PlatformSecret claim removes both the
# ExternalSecret AND the underlying ASM secret.
#
# Per adversarial-reviewer A.13: assert deletionPolicy=Delete (not
# Orphan) is the actual default behaviour. Per B.E.8: rely on the
# Composition's recoveryWindowInDays=0 so the ASM secret is gone
# immediately, not "scheduled for deletion".
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: claim-deletion-cleanup
spec:
  timeouts:
    apply: 30s
    assert: 240s
    delete: 60s
  steps:
    - name: apply a claim
      try:
        - apply:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: PlatformSecret
              metadata:
                name: scenario01
                namespace: default
              spec:
                refreshInterval: 30s
                region: us-east-1
                description: "chainsaw scenario 01 — deletion cleanup"

    - name: wait for claim Ready (otherwise deletion races provisioning)
      try:
        - assert:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: PlatformSecret
              metadata:
                name: scenario01
                namespace: default
              status:
                conditions:
                  - type: Ready
                    status: "True"

    - name: assert rendered ASM Secret MR matches golden (SPEC-C4)
      bindings:
        - name: expected_region
          value: us-east-1
      try:
        - assert:
            file: expected/asm-secret.yaml

    - name: assert rendered ExternalSecret matches golden (SPEC-C4)
      try:
        - assert:
            file: expected/external-secret.yaml

    - name: capture XR UID so we can verify ASM teardown out-of-band
      try:
        - script:
            content: |
              xr=$(kubectl get platformsecret ${CLAIM_NAME} -n default -o jsonpath='{.spec.resourceRef.name}')
              uid=$(kubectl get xplatformsecret "$xr" -o jsonpath='{.metadata.uid}')
              echo "k8-platform/${uid}" > /tmp/scenario01-asm-key.txt
              echo "captured: $(cat /tmp/scenario01-asm-key.txt)"
            env:
              - name: CLAIM_NAME
                value: scenario01

    - name: delete the claim
      try:
        - delete:
            ref:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: PlatformSecret
              name: scenario01
              namespace: default

    - name: assert ExternalSecret is gone
      try:
        - error:
            resource:
              apiVersion: external-secrets.io/v1beta1
              kind: ExternalSecret
              metadata:
                name: scenario01
                namespace: default

    - name: assert ASM secret is gone (out-of-band aws CLI check)
      try:
        - script:
            content: |
              set -euo pipefail
              key=$(cat /tmp/scenario01-asm-key.txt)
              echo "Checking ASM key is gone: $key"
              # describe-secret returns 254 (no such secret) — that's success.
              if aws secretsmanager describe-secret \
                  --secret-id "$key" \
                  --region "${AWS_REGION:-us-east-1}" \
                  >/dev/null 2>&1; then
                echo "FAIL: ASM secret $key still exists after claim delete"
                exit 1
              fi
              echo "OK: ASM secret $key is gone"
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: PlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Describe the XR (composite) the claim points at, if any.
          for claim_kind in platformsecret platformcluster; do
            for c in $(kubectl get "$claim_kind" -n "$NAMESPACE" -o name 2>/dev/null); do
              xr=$(kubectl get "$c" -n "$NAMESPACE" -o jsonpath='{.spec.resourceRef.name}' 2>/dev/null)
              [ -n "$xr" ] && kubectl describe "x${claim_kind}" "$xr" 2>&1 | head -c 1500
            done
          done
          # Describe every MR referenced by every XR in the namespace.
          for xr in $(kubectl get composite -o name 2>/dev/null); do
            kubectl get "$xr" -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
              | while read -r api kind name; do
                  [ -z "$kind" ] && continue
                  kubectl describe "$kind.$api" "$name" 2>&1 | head -c 1000
                done
          done
        env:
          - name: NAMESPACE
            value: ($namespace)
    - events:
        namespace: ($namespace)
