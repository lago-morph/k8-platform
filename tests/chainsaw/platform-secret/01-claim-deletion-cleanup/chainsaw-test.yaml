# Deletion cleanup: deleting a PlatformSecret claim removes both the
# ExternalSecret AND the underlying ASM secret.
#
# Per adversarial-reviewer A.13: assert deletionPolicy=Delete (not
# Orphan) is the actual default behaviour. Per B.E.8: rely on the
# Composition's recoveryWindowInDays=0 so the ASM secret is gone
# immediately, not "scheduled for deletion".
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: claim-deletion-cleanup
spec:
  timeouts:
    apply: 30s
    assert: 240s
    delete: 60s
  steps:
    - name: apply a claim
      try:
        - apply:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario01
                namespace: default
              spec:
                refreshInterval: 30s
                region: us-east-1
                description: "chainsaw scenario 01 - deletion cleanup"

    - name: wait for claim Ready (otherwise deletion races provisioning)
      try:
        - assert:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario01
                namespace: default
              status:
                # v2 XRs have 3 conditions: Synced, Ready, Responsive
                # (chainsaw matches arrays element-wise at same index).
                conditions:
                  - type: Synced
                    status: "True"
                  - type: Ready
                    status: "True"
                  - type: Responsive
                    status: "True"

    - name: assert rendered ASM Secret MR matches golden (SPEC-C4)
      bindings:
        - name: expected_region
          value: us-east-1
      try:
        - assert:
            file: expected/asm-secret.yaml

    - name: assert rendered ExternalSecret matches golden (SPEC-C4)
      try:
        - assert:
            file: expected/external-secret.yaml

    - name: capture XR UID so we can verify ASM teardown out-of-band
      try:
        - script:
            content: |
              # v2: XR is namespaced and shares the user's resource
              # name (no v1 claim → XR promotion pointer).
              xr="${CLAIM_NAME}"
              uid=$(kubectl get xplatformsecret -n default "$xr" -o jsonpath='{.metadata.uid}')
              echo "k8-platform/${uid}" > /tmp/scenario01-asm-key.txt
              echo "captured: $(cat /tmp/scenario01-asm-key.txt)"
            env:
              - name: CLAIM_NAME
                value: scenario01

    - name: delete the claim
      try:
        - delete:
            ref:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              name: scenario01
              namespace: default

    - name: assert ExternalSecret is gone
      try:
        - error:
            resource:
              apiVersion: external-secrets.io/v1beta1
              kind: ExternalSecret
              metadata:
                name: scenario01
                namespace: default

    - name: assert ASM secret is gone (out-of-band aws CLI check)
      try:
        - script:
            content: |
              set -eu
              # chainsaw runs scripts under /bin/sh; pipefail is bash-only.
              key=$(cat /tmp/scenario01-asm-key.txt)
              echo "Checking ASM key is gone: $key"
              # describe-secret returns 254 (no such secret) — that's success.
              if aws secretsmanager describe-secret \
                  --secret-id "$key" \
                  --region "${AWS_REGION:-us-east-1}" \
                  >/dev/null 2>&1; then
                echo "FAIL: ASM secret $key still exists after claim delete"
                exit 1
              fi
              echo "OK: ASM secret $key is gone"
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds across ALL namespaces. The scenarios in
          # this repo apply XRs to `namespace: default` (per commit 8526f46
          # "use literal 'default' namespace in composition-drift apply"),
          # NOT to chainsaw's per-test scratch namespace. A $NAMESPACE-bound
          # lookup would return nothing and the catch block would be
          # diagnostically empty — exactly what the 2026-05-28 PR #125
          # composition-drift timeout exposed (issue OI-2026-05-28-1).
          # `-A` surfaces the XR regardless of where the scenario put it.
          for xr_kind in xplatformsecret xplatformcluster; do
            kubectl get "$xr_kind" -A \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
              | while read -r ns name; do
                  [ -z "$name" ] && continue
                  kubectl describe "$xr_kind" -n "$ns" "$name" 2>&1 | head -c 1500
                  # Describe every MR referenced by this XR. MRs are
                  # cluster-scoped on the upbound providers, so no -n flag.
                  kubectl get "$xr_kind" -n "$ns" "$name" \
                    -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                    | while read -r api kind mrname; do
                        [ -z "$kind" ] && continue
                        kubectl describe "$kind.$api" "$mrname" 2>&1 | head -c 1000
                      done
                done
          done
    - events:
        namespace: ($namespace)
