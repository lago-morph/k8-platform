# SPEC-C4 golden — rendered Upbound ASM Secret MR for scenario 01
# (pre-deletion shape). Identical shape to scenario 00 except for the
# description tag.
apiVersion: secretsmanager.aws.upbound.io/v1beta1
kind: Secret
spec:
  deletionPolicy: Delete
  providerConfigRef:
    name: default
  forProvider:
    recoveryWindowInDays: 0
    region: ($expected_region)
    tags:
      ManagedBy: crossplane
      PlatformAbstraction: PlatformSecret
      Description: "chainsaw scenario 01 — deletion cleanup"
