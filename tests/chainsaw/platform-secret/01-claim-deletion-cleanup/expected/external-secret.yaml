# SPEC-C4 golden — rendered ExternalSecret for scenario 01 (pre-deletion).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scenario01
  namespace: ($namespace)
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: scenario01
    creationPolicy: Owner
    deletionPolicy: Delete
