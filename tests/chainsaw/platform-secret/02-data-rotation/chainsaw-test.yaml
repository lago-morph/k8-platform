# Rotation: a value change in ASM (out of band) propagates into the
# K8s Secret within refreshInterval.
#
# Per adversarial-reviewer B.C.5: short refreshInterval (10s) plus an
# upper-bound poll window catches ESO refresh bugs (stale cache, sync
# error swallowed, etc.). The scenario writes via aws CLI so the
# Composition itself doesn't need a `forProvider.secretString` path
# (deliberately kept out of the claim shape — that data lives in ASM).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: claim-rotation
spec:
  timeouts:
    apply: 30s
    assert: 240s
    delete: 60s
  steps:
    - name: apply a claim with short refreshInterval
      try:
        - apply:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario02
                namespace: default
              spec:
                refreshInterval: 10s
                region: us-east-1
                description: "chainsaw scenario 02 - rotation"

    - name: wait for claim Ready
      try:
        - assert:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario02
                namespace: default
              status:
                # v2 XRs have 3 conditions: Synced, Ready, Responsive
                # (chainsaw matches arrays element-wise at same index).
                conditions:
                  - type: Synced
                    status: "True"
                  - type: Ready
                    status: "True"
                  - type: Responsive
                    status: "True"

    - name: write initial value into ASM out-of-band
      try:
        - script:
            content: |
              set -eu
              # chainsaw runs scripts under /bin/sh; pipefail is bash-only.
              # v2: XR is namespaced and shares the user's resource
              # name (no v1 claim → XR promotion pointer).
              xr="${CLAIM_NAME}"
              uid=$(kubectl get xplatformsecret -n default "$xr" -o jsonpath='{.metadata.uid}')
              key="k8-platform/${uid}"
              echo "$key" > /tmp/scenario02-asm-key.txt
              aws secretsmanager put-secret-value \
                --secret-id "$key" \
                --secret-string '{"phase":"initial"}' \
                --region "${AWS_REGION:-us-east-1}" >/dev/null
              echo "wrote initial value to $key"
            env:
              - name: CLAIM_NAME
                value: scenario02

    - name: wait for ESO to materialize the K8s Secret with the initial value
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: scenario02
                namespace: default
              data:
                # base64 of "initial"
                phase: aW5pdGlhbA==

    - name: rotate value in ASM
      try:
        - script:
            content: |
              set -eu
              # chainsaw runs scripts under /bin/sh; pipefail is bash-only.
              key=$(cat /tmp/scenario02-asm-key.txt)
              aws secretsmanager put-secret-value \
                --secret-id "$key" \
                --secret-string '{"phase":"rotated"}' \
                --region "${AWS_REGION:-us-east-1}" >/dev/null
              echo "rotated $key"

    - name: assert K8s Secret picks up rotated value within refreshInterval
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: scenario02
                namespace: default
              data:
                # base64 of "rotated"
                phase: cm90YXRlZA==
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds explicitly. When a new XRD is added,
          # append its XR kind here (e.g. xplatformbucket). v2 namespaced
          # XRs do NOT reliably register under `kubectl get composite`.
          for xr_kind in xplatformsecret xplatformcluster; do
            for xr in $(kubectl get "$xr_kind" -n "$NAMESPACE" -o name 2>/dev/null); do
              kubectl describe "$xr" -n "$NAMESPACE" 2>&1 | head -c 1500
              # Describe every MR referenced by this XR.
              kubectl get "$xr" -n "$NAMESPACE" -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                | while read -r api kind name; do
                    [ -z "$kind" ] && continue
                    kubectl describe "$kind.$api" "$name" 2>&1 | head -c 1000
                  done
            done
          done
        env:
          - name: NAMESPACE
            value: ($namespace)
    - events:
        namespace: ($namespace)
