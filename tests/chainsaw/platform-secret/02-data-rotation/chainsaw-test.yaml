# Rotation: a value change in ASM (out of band) propagates into the
# K8s Secret within refreshInterval.
#
# Per adversarial-reviewer B.C.5: short refreshInterval (10s) plus an
# upper-bound poll window catches ESO refresh bugs (stale cache, sync
# error swallowed, etc.). The scenario writes via aws CLI so the
# Composition itself doesn't need a `forProvider.secretString` path
# (deliberately kept out of the claim shape — that data lives in ASM).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: claim-rotation
spec:
  timeouts:
    apply: 30s
    # wait-for-Ready bound: the upbound AWS provider occasionally takes
    # several minutes to converge a single ASM Secret MR even when sibling
    # scenarios in the same run create theirs in <60s (intermittent slow
    # reconcile, not a stuck MR — a genuinely stuck MR still fails at this
    # bound, so it is not masked). OI-2026-05-28-1 Issue A.
    assert: 600s
    delete: 60s
    # The initial out-of-band put-secret-value below retries (ASM create
    # read-after-write lag); give the script step headroom. OI-2026-05-28-1.
    exec: 180s
  steps:
    - name: apply a claim with short refreshInterval
      try:
        - apply:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario02
                namespace: default
              spec:
                refreshInterval: 10s
                region: us-east-1
                description: "chainsaw scenario 02 - rotation"

    - name: wait for claim Ready
      try:
        - assert:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: scenario02
                namespace: default
              status:
                # v2 XRs have 3 conditions: Synced, Ready, Responsive
                # (chainsaw matches arrays element-wise at same index).
                conditions:
                  - type: Synced
                    status: "True"
                  - type: Ready
                    status: "True"
                  - type: Responsive
                    status: "True"

    - name: assert rendered ASM Secret MR matches golden (SPEC-C4)
      bindings:
        - name: expected_region
          value: us-east-1
      try:
        - assert:
            file: expected/asm-secret.yaml

    - name: assert rendered ExternalSecret matches golden (SPEC-C4)
      # Critical for this scenario: refreshInterval: 10s is the contract
      # that makes the rotation propagate within the test's wait window.
      try:
        - assert:
            file: expected/external-secret.yaml

    - name: write initial value into ASM out-of-band
      try:
        - script:
            content: |
              set -eu
              # chainsaw runs scripts under /bin/sh; pipefail is bash-only.
              # v2: XR is namespaced and shares the user's resource
              # name (no v1 claim → XR promotion pointer).
              xr="${CLAIM_NAME}"
              uid=$(kubectl get xplatformsecret -n default "$xr" -o jsonpath='{.metadata.uid}')
              key="k8-platform/${uid}"
              echo "$key" > /tmp/scenario02-asm-key.txt
              # The XR is Ready, but ASM create is eventually consistent, so the
              # first put can race the secret becoming observable. Retry on a
              # bounded loop instead of one-shot. OI-2026-05-28-1.
              i=1
              while [ "$i" -le 30 ]; do
                if aws secretsmanager put-secret-value \
                    --secret-id "$key" \
                    --secret-string '{"phase":"initial"}' \
                    --region "${AWS_REGION:-us-east-1}" >/dev/null 2>&1; then
                  echo "wrote initial value to $key"
                  exit 0
                fi
                echo "  secret not writable yet (attempt $i/30); waiting 5s..."
                i=$((i + 1))
                sleep 5
              done
              echo "FAIL: could not write initial value to $key"
              exit 1
            env:
              - name: CLAIM_NAME
                value: scenario02

    - name: wait for ESO to materialize the K8s Secret with the initial value
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: scenario02
                namespace: default
              data:
                # base64 of "initial"
                phase: aW5pdGlhbA==

    - name: rotate value in ASM
      try:
        - script:
            content: |
              set -eu
              # chainsaw runs scripts under /bin/sh; pipefail is bash-only.
              key=$(cat /tmp/scenario02-asm-key.txt)
              aws secretsmanager put-secret-value \
                --secret-id "$key" \
                --secret-string '{"phase":"rotated"}' \
                --region "${AWS_REGION:-us-east-1}" >/dev/null
              echo "rotated $key"

    - name: assert K8s Secret picks up rotated value within refreshInterval
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: scenario02
                namespace: default
              data:
                # base64 of "rotated"
                phase: cm90YXRlZA==
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds across ALL namespaces. The scenarios in
          # this repo apply XRs to `namespace: default` (per commit 8526f46
          # "use literal 'default' namespace in composition-drift apply"),
          # NOT to chainsaw's per-test scratch namespace. A $NAMESPACE-bound
          # lookup would return nothing and the catch block would be
          # diagnostically empty — exactly what the 2026-05-28 PR #125
          # composition-drift timeout exposed (issue OI-2026-05-28-1).
          # `-A` surfaces the XR regardless of where the scenario put it.
          for xr_kind in xplatformsecret xplatformcluster xdatabase; do
            kubectl get "$xr_kind" -A \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
              | while read -r ns name; do
                  [ -z "$name" ] && continue
                  kubectl describe "$xr_kind" -n "$ns" "$name" 2>&1 | head -c 1500
                  # Describe every MR referenced by this XR. Three fixes vs the
                  # original (OI-2026-06-12-1, each alone left this loop silent):
                  # v2 XRs keep machinery under spec.crossplane
                  # (.spec.resourceRefs is empty on them); v2 .m. MRs are
                  # NAMESPACED in the XR's namespace (-n is a no-op for
                  # cluster-scoped kinds); and the type arg must be
                  # kind.version.group — a group/version apiVersion makes kubectl
                  # misparse TYPE/NAME and error before querying.
                  kubectl get "$xr_kind" -n "$ns" "$name" \
                    -o jsonpath='{range .spec.crossplane.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                    | while read -r api kind mrname; do
                        [ -z "$kind" ] && continue
                        kubectl describe "$kind.${api#*/}.${api%/*}" "$mrname" -n "$ns" 2>&1 | head -c 1000
                      done
                done
          done
    - events:
        namespace: ($namespace)
