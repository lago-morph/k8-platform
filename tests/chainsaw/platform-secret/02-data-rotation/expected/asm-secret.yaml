# SPEC-C4 golden — rendered Upbound ASM Secret MR for scenario 02
# (rotation). Same shape as 00/01; description differs.
apiVersion: secretsmanager.aws.m.upbound.io/v1beta1
kind: Secret
spec:
  managementPolicies: [Observe, Create, Update, Delete]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    recoveryWindowInDays: 0
    region: ($expected_region)
    tags:
      ManagedBy: crossplane
      PlatformAbstraction: PlatformSecret
      Description: "chainsaw scenario 02 — rotation"
