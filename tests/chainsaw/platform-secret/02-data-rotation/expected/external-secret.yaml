# SPEC-C4 golden — rendered ExternalSecret for scenario 02 (rotation).
#
# Per spec §4 table: `refreshInterval: 10s` is THE asserted contract for
# this scenario — the short refresh window is what makes ESO pick up the
# rotated value within the scenario's wait window.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: scenario02
  namespace: default
spec:
  refreshInterval: 10s
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: scenario02
    creationPolicy: Owner
    deletionPolicy: Delete
