# SPEC-A4 meta-test — exercises the shared `catch:` block.
#
# This scenario's single step DELIBERATELY FAILS (asserts on a
# ConfigMap that is never created). Chainsaw therefore runs the
# `spec.catch:` block, emitting the three operations (describe, script,
# events) into stdout.
#
# `tests/chainsaw/run.sh` inverts the exit-code expectation for any
# scenario whose name begins with `meta-`: a non-zero chainsaw exit
# combined with the catch markers in stdout is treated as PASS; a zero
# exit (the deliberate-fail step somehow succeeded) is treated as FAIL.
#
# The catch block below is the canonical block from
# `tests/chainsaw/_lib/catch-block.yaml`, pasted verbatim. The unit
# test `tests/unit/test_chainsaw_catch_block.sh` enforces that.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: meta-catch-fires
  labels:
    meta: "true"
spec:
  # Short timeout — the assert below is expected to fail; no need to
  # spend the default 60s waiting.
  timeouts:
    assert: 5s
  steps:
    - name: assert a ConfigMap that does not exist (DELIBERATE FAIL)
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: spec-a4-meta-never-created
                namespace: default
              data:
                marker: "this-cm-is-never-applied"
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: PlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Describe the XR (composite) the claim points at, if any.
          for claim_kind in platformsecret platformcluster; do
            for c in $(kubectl get "$claim_kind" -n "$NAMESPACE" -o name 2>/dev/null); do
              xr=$(kubectl get "$c" -n "$NAMESPACE" -o jsonpath='{.spec.resourceRef.name}' 2>/dev/null)
              [ -n "$xr" ] && kubectl describe "x${claim_kind}" "$xr" 2>&1 | head -c 1500
            done
          done
          # Describe every MR referenced by every XR in the namespace.
          for xr in $(kubectl get composite -o name 2>/dev/null); do
            kubectl get "$xr" -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
              | while read -r api kind name; do
                  [ -z "$kind" ] && continue
                  kubectl describe "$kind.$api" "$name" 2>&1 | head -c 1000
                done
          done
        env:
          - name: NAMESPACE
            value: ($namespace)
    - events:
        namespace: ($namespace)
