# SPEC-A4 meta-test — exercises the shared `catch:` block.
#
# This scenario's single step DELIBERATELY FAILS (asserts on a
# ConfigMap that is never created). Chainsaw therefore runs the
# `spec.catch:` block, emitting the three operations (describe, script,
# events) into stdout.
#
# `tests/chainsaw/run.sh` inverts the exit-code expectation for any
# scenario whose name begins with `meta-`: a non-zero chainsaw exit
# combined with the catch markers in stdout is treated as PASS; a zero
# exit (the deliberate-fail step somehow succeeded) is treated as FAIL.
#
# The catch block below is the canonical block from
# `tests/chainsaw/_lib/catch-block.yaml`, pasted verbatim. The unit
# test `tests/unit/test_chainsaw_catch_block.sh` enforces that.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: meta-catch-fires
  labels:
    meta: "true"
spec:
  # Short timeout — the assert below is expected to fail; no need to
  # spend the default 60s waiting.
  timeouts:
    assert: 5s
  steps:
    - name: assert a ConfigMap that does not exist (DELIBERATE FAIL)
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: spec-a4-meta-never-created
                namespace: default
              data:
                marker: "this-cm-is-never-applied"
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds across ALL namespaces. The scenarios in
          # this repo apply XRs to `namespace: default` (per commit 8526f46
          # "use literal 'default' namespace in composition-drift apply"),
          # NOT to chainsaw's per-test scratch namespace. A $NAMESPACE-bound
          # lookup would return nothing and the catch block would be
          # diagnostically empty — exactly what the 2026-05-28 PR #125
          # composition-drift timeout exposed (issue OI-2026-05-28-1).
          # `-A` surfaces the XR regardless of where the scenario put it.
          for xr_kind in xplatformsecret xplatformcluster xdatabase; do
            kubectl get "$xr_kind" -A \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
              | while read -r ns name; do
                  [ -z "$name" ] && continue
                  kubectl describe "$xr_kind" -n "$ns" "$name" 2>&1 | head -c 1500
                  # Describe every MR referenced by this XR. MRs are
                  # cluster-scoped on the upbound providers, so no -n flag.
                  kubectl get "$xr_kind" -n "$ns" "$name" \
                    -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                    | while read -r api kind mrname; do
                        [ -z "$kind" ] && continue
                        kubectl describe "$kind.$api" "$mrname" 2>&1 | head -c 1000
                      done
                done
          done
    - events:
        namespace: ($namespace)
