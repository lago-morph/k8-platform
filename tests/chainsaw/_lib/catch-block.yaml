# Canonical chainsaw `catch:` block — pasted verbatim into every
# `Test.spec.catch` under `tests/chainsaw/`.
#
# SPEC-A4 defines this fragment. Drift between this file and any
# scenario's `.spec.catch` is enforced by
# `tests/unit/test_chainsaw_catch_block.sh`.
#
# The single field a scenario is allowed to override is `describe.kind`
# (per spec §5 "Per-scenario XR kind override"). The unit test treats
# that field as a free variable and structurally compares everything
# else.
#
# v2 contract:
#   - Claim CRDs (platformsecret/platformcluster) disappear in v2;
#     the user-facing kinds are the namespaced XR kinds
#     (xplatformsecret/xplatformcluster). Iterate them explicitly —
#     `kubectl get composite -o name` is NOT reliable on v2 because
#     namespaced XRs may not register under the `composite` category.
#   - To add a new XRD: append its XR kind to the XR_KINDS list below
#     AND keep the explicit iteration shape (do not fall back to the
#     `composite` category query).
#
# Output budget (per spec §5 "Output budget — ≤5 KB per failure"):
#   - XR `describe` truncated with `head -c 1500`
#   - Each MR `describe` truncated with `head -c 1000`
#   - `events` uses chainsaw's default ~10m window
catch:
  - describe:
      apiVersion: platform.k8-platform.io/v1alpha1
      kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
      namespace: ($namespace)
  - script:
      content: |
        set +e
        # Enumerate v2 XR kinds across ALL namespaces. The scenarios in
        # this repo apply XRs to `namespace: default` (per commit 8526f46
        # "use literal 'default' namespace in composition-drift apply"),
        # NOT to chainsaw's per-test scratch namespace. A $NAMESPACE-bound
        # lookup would return nothing and the catch block would be
        # diagnostically empty — exactly what the 2026-05-28 PR #125
        # composition-drift timeout exposed (issue OI-2026-05-28-1).
        # `-A` surfaces the XR regardless of where the scenario put it.
        for xr_kind in xplatformsecret xplatformcluster xdatabase; do
          kubectl get "$xr_kind" -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
            | while read -r ns name; do
                [ -z "$name" ] && continue
                kubectl describe "$xr_kind" -n "$ns" "$name" 2>&1 | head -c 1500
                # Describe every MR referenced by this XR. MRs are
                # cluster-scoped on the upbound providers, so no -n flag.
                kubectl get "$xr_kind" -n "$ns" "$name" \
                  -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                  | while read -r api kind mrname; do
                      [ -z "$kind" ] && continue
                      kubectl describe "$kind.$api" "$mrname" 2>&1 | head -c 1000
                    done
              done
        done
  - events:
      namespace: ($namespace)
