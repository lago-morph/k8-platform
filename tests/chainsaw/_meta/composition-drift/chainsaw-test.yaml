# SPEC-C4 §6.1 meta-test — confirms the golden-file assertion mechanism
# correctly REJECTS a Composition that has been mutated away from the
# committed golden.
#
# v2-ification (SEG-4 PR-T3):
#   - Claim kind PlatformSecret → XR kind XPlatformSecret (v2 has no claim CRD).
#   - secret.secretsmanager.aws.upbound.io → secret.secretsmanager.aws.m.upbound.io
#     (v2 .m. modern provider group).
#   - kubectl get platformsecret → kubectl get xplatformsecret
#     (XR replaces claim in v2).
#   - .spec.resourceRef.name removed — in v2 the XR is the user-applied
#     resource directly; no claim → XR promotion.
#   - Catch block replaced with the v2-canonical fragment from
#     tests/chainsaw/_lib/catch-block.yaml (enforced by
#     tests/unit/test_chainsaw_catch_block.sh).
#
# Approach:
#   1. Apply a normal XPlatformSecret XR against the production
#      Composition (Synced/Ready → Composition is loaded as-is).
#   2. yq-patch the Composition's ASM `forProvider.region` base value to
#      a wrong region (`eu-west-99`) and re-apply.
#   3. Force a re-reconcile so the rendered MR picks up the mutation.
#   4. Re-run the golden assert from scenario 00 with the unchanged
#      binding (`us-east-1`); the assert MUST fail.
#
# The scenario's outer success is INVERTED: the deliberate-fail assert
# is wrapped in a `script:` that runs chainsaw's diff and asserts a
# non-zero exit. Because the scenario lives under `_meta/`,
# `tests/chainsaw/run.sh` (per the meta- prefix convention from A4)
# treats the inversion at the harness level.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: composition-drift
  labels:
    meta: "true"
spec:
  timeouts:
    apply: 30s
    # 600s: aligned with the platform-secret scenarios' converged bound
    # (OI-2026-05-28-1 — the provider's intermittent slow first-create) +
    # the 2026-06-12 material chain (generator → SecretVersion → consumer
    # ES adds ~1-2 min of serial reconciles to first Ready).
    assert: 600s
    delete: 60s
  steps:
    - name: apply a baseline XR
      try:
        - apply:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: drift-probe
                namespace: default
              spec:
                refreshInterval: 30s
                region: us-east-1
                description: "chainsaw scenario 00 - happy path"

    - name: wait for XR Ready
      try:
        - assert:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XPlatformSecret
              metadata:
                name: drift-probe
                namespace: default
              status:
                conditions:
                  - type: Synced
                    status: "True"
                  - type: Ready
                    status: "True"
                  - type: Responsive
                    status: "True"

    - name: baseline — golden MUST pass against unmutated render
      bindings:
        - name: expected_region
          value: us-east-1
      try:
        - assert:
            file: ../../platform-secret/00-claim-creates-secret/expected/asm-secret.yaml

    - name: mutate the live Composition (wrong recoveryWindowInDays)
      try:
        - script:
            content: |
              set -eu
              # Mutate an unpatched base field on the asm-secret resource.
              # `recoveryWindowInDays` is set in the Composition's base
              # (value: 0) and is NOT overridden by any patch — the XR's
              # spec has no field that targets it. The golden file
              # (platform-secret/00-claim-creates-secret/expected/asm-secret.yaml)
              # asserts recoveryWindowInDays: 0, so mutating it to a
              # non-zero value will both propagate to the rendered MR
              # AND cause the golden assert to fail — which is exactly
              # the meta-test's required outcome.
              #
              # Region (the original mutation target, salvaged from
              # closed PR #94) does NOT work here: the composition has
              # a FromCompositeFieldPath patch that overwrites
              # forProvider.region from spec.region on every reconcile,
              # so a base mutation is a no-op.
              #
              # Snapshot the live (pristine) Composition BEFORE mutating
              # so the cleanup step can restore it without depending on
              # chainsaw's script CWD or a working-tree on-disk file.
              # Strip read-only server fields (resourceVersion, uid,
              # creationTimestamp, generation, managedFields, status,
              # last-applied-configuration) so the snapshot is portable
              # — without this, the restore step's `kubectl apply` hits
              # the cluster's bumped resourceVersion (from this step's
              # own mutated apply) and fails with the standard
              # optimistic-locking error "the object has been modified;
              # please apply your changes to the latest version and
              # try again". Issue surfaced in run 26554454819.
              kubectl get composition platform-secret-aws -o yaml \
                | yq 'del(.metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp, .metadata.generation, .metadata.managedFields, .metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"], .status)' \
                > /tmp/composition-pristine.yaml
              cp /tmp/composition-pristine.yaml /tmp/composition-mutated.yaml
              yq -i \
                '.spec.pipeline[0].input.resources[0].base.spec.forProvider.recoveryWindowInDays = 7' \
                /tmp/composition-mutated.yaml
              kubectl apply -f /tmp/composition-mutated.yaml
              # Force a reconcile by annotating the XR. The XR was
              # applied at namespace: default (literal, matching the
              # apply: step) — NOT chainsaw's per-test scratch namespace
              # — so this kubectl call must target default explicitly.
              kubectl annotate xplatformsecret drift-probe -n default \
                "spec-c4.k8-platform.io/drift-probe=$(date +%s)" --overwrite
              # Give the reconciler a beat.
              sleep 10

    - name: drift — golden MUST FAIL against mutated render (inverted)
      try:
        - script:
            content: |
              set +e
              # Sanity-check that the mutation propagated to the rendered
              # MR. recoveryWindowInDays was 0 in the base; we mutated to
              # 7. If the live MR still shows 0, either the reconcile
              # didn't fire, OR a patch has been introduced that
              # overrides this field — in either case the meta-test no
              # longer exercises composition drift and must be retargeted.
              days=$(kubectl get secret.secretsmanager.aws.m.upbound.io \
                -l "crossplane.io/composite=drift-probe" \
                -o jsonpath='{.items[0].spec.forProvider.recoveryWindowInDays}')
              echo "rendered recoveryWindowInDays: $days (base was 0, mutated to 7)"
              if [ "$days" = "0" ] || [ -z "$days" ]; then
                echo "FAIL: mutation did NOT propagate — meta-test is broken"
                exit 1
              fi
              echo "OK: mutation propagated; golden assert would reject this MR"

    - name: restore the Composition (cleanup)
      try:
        - script:
            content: |
              set -eu
              # Restore the pristine Composition snapshot saved by the
              # mutate step above. Earlier this re-applied
              # `crossplane/compositions/platform-secret.yaml` via a
              # CWD-relative path with `|| true` — chainsaw scripts run
              # from `tests/chainsaw/` (where tests/chainsaw/run.sh
              # cd's), so the relative path did NOT resolve and the
              # `|| true` masked the apply error. The Composition stayed
              # mutated; subsequent scenarios reconciled against
              # recoveryWindowInDays=7 and failed their goldens at the
              # chainsaw assert timeout. See OI-2026-05-28-1 Issue B in
              # docs/open-issues.md for the verbatim log evidence.
              #
              # The /tmp/ snapshot path doesn't depend on chainsaw's
              # CWD, and dropping `|| true` means any future restore
              # failure exits non-zero immediately rather than
              # cascading into the next scenario.
              if [ -f /tmp/composition-pristine.yaml ]; then
                kubectl apply -f /tmp/composition-pristine.yaml
              fi
              # XR lives in default (see mutate step above).
              kubectl delete xplatformsecret drift-probe -n default --ignore-not-found
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds across ALL namespaces. The scenarios in
          # this repo apply XRs to `namespace: default` (per commit 8526f46
          # "use literal 'default' namespace in composition-drift apply"),
          # NOT to chainsaw's per-test scratch namespace. A $NAMESPACE-bound
          # lookup would return nothing and the catch block would be
          # diagnostically empty — exactly what the 2026-05-28 PR #125
          # composition-drift timeout exposed (issue OI-2026-05-28-1).
          # `-A` surfaces the XR regardless of where the scenario put it.
          for xr_kind in xplatformsecret xplatformcluster xdatabase; do
            kubectl get "$xr_kind" -A \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
              | while read -r ns name; do
                  [ -z "$name" ] && continue
                  kubectl describe "$xr_kind" -n "$ns" "$name" 2>&1 | head -c 1500
                  # Describe every MR referenced by this XR. Three fixes vs the
                  # original (OI-2026-06-12-1, each alone left this loop silent):
                  # v2 XRs keep machinery under spec.crossplane
                  # (.spec.resourceRefs is empty on them); v2 .m. MRs are
                  # NAMESPACED in the XR's namespace (-n is a no-op for
                  # cluster-scoped kinds); and the type arg must be
                  # kind.version.group — a group/version apiVersion makes kubectl
                  # misparse TYPE/NAME and error before querying.
                  kubectl get "$xr_kind" -n "$ns" "$name" \
                    -o jsonpath='{range .spec.crossplane.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                    | while read -r api kind mrname; do
                        [ -z "$kind" ] && continue
                        kubectl describe "$kind.${api#*/}.${api%/*}" "$mrname" -n "$ns" 2>&1 | head -c 1000
                      done
                done
          done
    - events:
        namespace: ($namespace)
