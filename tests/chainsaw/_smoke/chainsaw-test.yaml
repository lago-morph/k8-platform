# Smoke scenario — proves the chainsaw harness itself works end-to-end
# (kind up, chainsaw CLI on PATH, cluster reachable) WITHOUT depending on
# any XRD / Composition. If this fails, the harness is broken, not the
# Crossplane code under test.
#
# Stays deliberately minimal: apply a ConfigMap, assert it exists, delete
# it, assert it's gone. ~5 seconds end-to-end.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: smoke-harness-works
spec:
  steps:
    - name: apply a ConfigMap
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: chainsaw-smoke
                namespace: default
              data:
                marker: "harness-is-alive"
    - name: assert the ConfigMap is present
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: chainsaw-smoke
                namespace: default
              data:
                marker: "harness-is-alive"
    - name: delete the ConfigMap
      try:
        - delete:
            ref:
              apiVersion: v1
              kind: ConfigMap
              name: chainsaw-smoke
              namespace: default
    - name: assert the ConfigMap is gone
      try:
        - error:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: chainsaw-smoke
                namespace: default
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XPlatformSecret      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds explicitly. When a new XRD is added,
          # append its XR kind here (e.g. xplatformbucket). v2 namespaced
          # XRs do NOT reliably register under `kubectl get composite`.
          for xr_kind in xplatformsecret xplatformcluster; do
            for xr in $(kubectl get "$xr_kind" -n "$NAMESPACE" -o name 2>/dev/null); do
              kubectl describe "$xr" -n "$NAMESPACE" 2>&1 | head -c 1500
              # Describe every MR referenced by this XR.
              kubectl get "$xr" -n "$NAMESPACE" -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                | while read -r api kind name; do
                    [ -z "$kind" ] && continue
                    kubectl describe "$kind.$api" "$name" 2>&1 | head -c 1000
                  done
            done
          done
        env:
          - name: NAMESPACE
            value: ($namespace)
    - events:
        namespace: ($namespace)
