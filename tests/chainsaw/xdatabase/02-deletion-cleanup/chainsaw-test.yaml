# REAL-AWS / NIGHTLY — DO NOT run in the per-PR kind-only chainsaw matrix.
# Provisions a live RDS instance then deletes it and asserts complete
# teardown. RDS create is 5-10 min so the Ready assert timeout is 900s.
# Requires provider-aws-rds + IRSA creds with rds:* + secretsmanager:*.
# Gated to the nightly real-AWS workflow, NOT the push-triggered kind run.
#
# Contract under test (deletion cleanup):
#   1. Provision an XDatabase XR; wait Ready (RDS available).
#   2. Capture the RDS DBInstanceIdentifier (= XR name, via external-name).
#   3. Delete the XR.
#   4. Assert ALL of:
#        a. the connection Secret (<xr>) is gone,
#        b. the provider-generated <xr>-master password Secret is gone
#           (OI-2026-06-06-3 — this assert is what turns the orphan
#           hypothesis into a confirmed bug if it fails),
#        c. `aws rds describe-db-instances` → DBInstanceNotFound.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: xdatabase-deletion-cleanup
spec:
  timeouts:
    apply: 30s
    assert: 900s
    delete: 120s
  steps:
    - name: apply an XDatabase XR
      try:
        - apply:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XDatabase
              metadata:
                name: scenario02-db
                namespace: default
              spec:
                engine: postgres
                size: small
                storageGB: 20
                databaseName: keycloak
                region: us-east-1

    - name: wait for the XR to be Ready (RDS available — up to 900s)
      try:
        - assert:
            resource:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XDatabase
              metadata:
                name: scenario02-db
                namespace: default
              status:
                conditions:
                  - type: Synced
                    status: "True"
                  - type: Ready
                    status: "True"
                  - type: Responsive
                    status: "True"

    - name: capture the RDS DBInstanceIdentifier for the out-of-band check
      try:
        - script:
            content: |
              set -eu
              # The Composition sets external-name = XR name, so the RDS
              # DBInstanceIdentifier == the XR name.
              id=$(kubectl get xdatabase -n default scenario02-db \
                    -o jsonpath='{.metadata.annotations.crossplane\.io/external-name}')
              [ -z "$id" ] && id=scenario02-db
              echo "$id" > /tmp/scenario02-rds-id.txt
              echo "captured RDS id: $id"

    - name: delete the XR
      try:
        - delete:
            ref:
              apiVersion: platform.k8-platform.io/v1alpha1
              kind: XDatabase
              name: scenario02-db
              namespace: default

    - name: assert the connection Secret is gone
      try:
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: scenario02-db
                namespace: default

    - name: assert the <xr>-master password Secret is gone
      # OI-2026-06-06-3: the provider-generated master-password Secret is
      # NOT owned by the XR; if Crossplane does not GC it this assert FAILS,
      # confirming the orphan bug. Do NOT hand-delete it to make this pass
      # (that would mask the gap — AGENTS §6.24).
      try:
        - error:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: scenario02-db-master
                namespace: default

    - name: assert the RDS instance is gone (out-of-band aws CLI check)
      try:
        - script:
            content: |
              set -eu
              # chainsaw runs scripts under /bin/sh; pipefail is bash-only.
              id=$(cat /tmp/scenario02-rds-id.txt)
              echo "Checking RDS instance is gone: $id"
              # describe-db-instances returns non-zero (DBInstanceNotFound)
              # once the instance is deleted — that's success.
              if aws rds describe-db-instances \
                  --db-instance-identifier "$id" \
                  --region "${AWS_REGION:-us-east-1}" \
                  >/tmp/rds-describe.log 2>&1; then
                echo "FAIL: RDS instance $id still exists after XR delete"
                exit 1
              fi
              # Confirm the failure is specifically DBInstanceNotFound, not a
              # creds/throttle error masquerading as success.
              if ! grep -q "DBInstanceNotFound" /tmp/rds-describe.log; then
                echo "FAIL: describe-db-instances failed but not with DBInstanceNotFound:"
                cat /tmp/rds-describe.log
                exit 1
              fi
              echo "OK: RDS instance $id is gone (DBInstanceNotFound)"
  # SPEC-A4 canonical catch block — keep in sync with
  # tests/chainsaw/_lib/catch-block.yaml (enforced by
  # tests/unit/test_chainsaw_catch_block.sh).
  catch:
    - describe:
        apiVersion: platform.k8-platform.io/v1alpha1
        kind: XDatabase      # overridden per-scenario when the XR kind differs
        namespace: ($namespace)
    - script:
        content: |
          set +e
          # Enumerate v2 XR kinds across ALL namespaces. The scenarios in
          # this repo apply XRs to `namespace: default` (per commit 8526f46
          # "use literal 'default' namespace in composition-drift apply"),
          # NOT to chainsaw's per-test scratch namespace. A $NAMESPACE-bound
          # lookup would return nothing and the catch block would be
          # diagnostically empty — exactly what the 2026-05-28 PR #125
          # composition-drift timeout exposed (issue OI-2026-05-28-1).
          # `-A` surfaces the XR regardless of where the scenario put it.
          for xr_kind in xplatformsecret xplatformcluster xdatabase; do
            kubectl get "$xr_kind" -A \
              -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
              | while read -r ns name; do
                  [ -z "$name" ] && continue
                  kubectl describe "$xr_kind" -n "$ns" "$name" 2>&1 | head -c 1500
                  # Describe every MR referenced by this XR. MRs are
                  # cluster-scoped on the upbound providers, so no -n flag.
                  kubectl get "$xr_kind" -n "$ns" "$name" \
                    -o jsonpath='{range .spec.resourceRefs[*]}{.apiVersion}{" "}{.kind}{" "}{.name}{"\n"}{end}' \
                    | while read -r api kind mrname; do
                        [ -z "$kind" ] && continue
                        kubectl describe "$kind.$api" "$mrname" 2>&1 | head -c 1000
                      done
                done
          done
    - events:
        namespace: ($namespace)
