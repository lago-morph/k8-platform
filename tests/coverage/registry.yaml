# Coverage registry — the ONE hand-maintained coverage artifact (FINAL-PLAN §4.5).
#
# The expected-coverage SET is generated (tests/coverage/expected-coverage.txt,
# regenerated by derive-coverage.sh). This registry is the human-owned mapping
# of WHICH TEST defends WHICH composed-MR kind, plus its lane and cost tier.
#
# Invariants enforced by tests/unit/test_coverage_deriver.sh:
#   - ENFORCE: every derived group/kind (from the Compositions) MUST appear here
#     (an un-registered kind is CI-red — you added an MR with no coverage entry).
#   - ENFORCE: every registry key MUST be a real derived kind (no stale entries).
#   - WARN (until P2/P4 behavioral tests land): a kind whose `defended_by` is a
#     `pending:*` marker prints a WARN but does not fail — the behavioral test
#     that closes it ships in the named phase. When all are real test IDs, the
#     defended_by check becomes a hard gate (DevX C2).
#
# Fields per entry:
#   lane:        aws | non-aws   (non-aws kinds have no IAM action to simulate)
#   cost:        hermetic | singleton-coupled | slow
#                 - hermetic:           cheap, instantiate-and-verify (both full+verify paths)
#                 - singleton-coupled:  cheap action but coupled to a singleton (zone/spoke);
#                                       after-the-fact on the hub, instantiate only in isolation
#                 - slow:               EKS ~20 min / RDS multi-min — AFTER-THE-FACT only
#   defended_by: a test ID, or `pending:P<n>` until that phase's behavioral test lands
#
# Cost assignments are policy knobs (FINAL-PLAN §5/§14.5); tune in the handoff.

kinds:
  acm.aws.m.upbound.io/Certificate:
    lane: aws
    cost: slow            # DNS-validated issuance is slow + singleton (one zone)
    defended_by: pending:P2
  acm.aws.m.upbound.io/CertificateValidation:
    lane: aws
    cost: slow
    defended_by: pending:P2
  ec2.aws.m.upbound.io/SecurityGroupIngressRule:
    lane: aws
    cost: singleton-coupled   # admits the shared SSM relay to the cluster API; created with the cluster (docs/decisions/0008)
    defended_by: pending:P2
  eks.aws.m.upbound.io/Cluster:
    lane: aws
    cost: slow            # ~20 min — never recreate (FINAL-PLAN §5)
    defended_by: pending:P2
  eks.aws.m.upbound.io/NodeGroup:
    lane: aws
    cost: slow
    defended_by: pending:P2
  eks.aws.m.upbound.io/AccessEntry:
    lane: aws
    cost: singleton-coupled   # coupled to the spoke cluster
    defended_by: pending:P5
  eks.aws.m.upbound.io/AccessPolicyAssociation:
    lane: aws
    cost: singleton-coupled
    defended_by: pending:P5
  iam.aws.m.upbound.io/Role:
    lane: aws
    cost: hermetic
    defended_by: pending:P4
  iam.aws.m.upbound.io/RolePolicy:
    lane: aws
    cost: hermetic
    defended_by: pending:P4
  iam.aws.m.upbound.io/RolePolicyAttachment:
    lane: aws
    cost: hermetic
    defended_by: pending:P4
  iam.aws.m.upbound.io/OpenIDConnectProvider:
    lane: aws
    cost: singleton-coupled   # one OIDC provider per spoke
    defended_by: pending:P5
  rds.aws.m.upbound.io/Instance:
    lane: aws
    cost: slow            # multi-minute — AFTER-THE-FACT only
    defended_by: pending:P2
  route53.aws.m.upbound.io/Record:
    lane: aws
    cost: singleton-coupled   # coupled to the singleton hosted zone
    defended_by: pending:P4
  secretsmanager.aws.m.upbound.io/Secret:
    lane: aws
    cost: hermetic
    defended_by: pending:P4
  external-secrets.io/ExternalSecret:
    lane: non-aws         # no IAM action to simulate (FINAL-PLAN §4.5)
    cost: hermetic
    defended_by: pending:P4

# extra: side-effect resources absent from any Composition's resources[] (a
# controller-created NLB, an out-of-band-tagged subnet — blockers #9 and the LB).
# Each needs a `reason:`. Covered by the standing after-the-fact RGT-diff (§4.5);
# a stale `extra:` entry with no matching real resource for N runs is a FAIL.
# Populated in P2 alongside the resourcegroupstaggingapi diff oracle.
extra: []
