name: Terraform Test

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Which module to act on (test = run the harness's own tests)"
        required: true
        default: base
        type: choice
        options:
          - base
          - management
          - test
      action:
        description: "What to do (test-unit/test-e2e only valid with phase=test)"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - verify
          - apply-and-verify
          - destroy
          - test-unit
          - test-e2e

# One run per branch+phase at a time; follow-up dispatches queue rather than
# cancelling the running one. See ai/specs/ext-github-design.md §4 (Concurrency)
# and §Cross-cutting policies: the agent-driven dispatcher cannot reliably
# distinguish "slow apply" from "stalled" and a cancel mid-apply leaves a held
# state lock and half-applied resources. ext-github also refuses to dispatch
# when >2 runs are already queued for the same (ref, phase).
concurrency:
  group: terraform-${{ github.ref }}-${{ inputs.phase }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  # Domain, backend, and Cognito test credentials are all auto-generated in
  # the Bootstrap / Route53 discovery steps below and written to $GITHUB_ENV.
  # None of these require repository secrets.

jobs:
  terraform:
    name: Terraform (${{ inputs.phase }} / ${{ inputs.action }})
    runs-on: ubuntu-latest

    permissions:
      contents: write      # checkout + commit comments (fallback when no PR)
      issues: write        # PR comments via the Issues API
      pull-requests: write # PR metadata access

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify AWS CLI
        run: aws --version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      # ──────────────────────────────────────────────────────────────────────
      # Compute per-step gates from (phase, action). See ai/testing-guidelines.md §6.
      # ──────────────────────────────────────────────────────────────────────

      - name: Compute gates
        id: gates
        run: |
          set -euo pipefail
          # Logic lives in a separate script so unit tests in
          # tests/unit/test_compute_gates.sh exercise the exact same code.
          .github/scripts/compute-gates.sh \
            "${{ inputs.phase }}" \
            "${{ inputs.action }}" \
            | tee -a "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────────────
      # BOOTSTRAP — runs once per job; sets up the S3/DynamoDB backend and
      # discovers the pre-existing Route53 zone in the AWS account.
      # All outputs are written to $GITHUB_ENV so subsequent steps see them.
      # ──────────────────────────────────────────────────────────────────────

      - name: Bootstrap state backend
        if: steps.gates.outputs.test_unit != 'true' && steps.gates.outputs.test_e2e != 'true'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="k8-platform-tfstate-${ACCOUNT_ID}"
          TABLE="k8-platform-tfstate-lock"
          REGION="${AWS_DEFAULT_REGION:-us-east-1}"

          # Create S3 bucket with versioning + encryption if absent.
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Creating state bucket: $BUCKET"
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          else
            echo "State bucket already exists: $BUCKET"
          fi

          # Create DynamoDB lock table (PAY_PER_REQUEST, no capacity to manage).
          if ! aws dynamodb describe-table --table-name "$TABLE" 2>/dev/null; then
            echo "Creating lock table: $TABLE"
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$TABLE"
          else
            echo "Lock table already exists: $TABLE"
          fi

          # Export for terraform init -backend-config flags.
          echo "TF_BACKEND_BUCKET=${BUCKET}"             >> "$GITHUB_ENV"
          echo "TF_BACKEND_REGION=${REGION}"             >> "$GITHUB_ENV"
          echo "TF_BACKEND_DYNAMODB_TABLE=${TABLE}"      >> "$GITHUB_ENV"
          echo "TF_VAR_tf_state_bucket=${BUCKET}"        >> "$GITHUB_ENV"

      - name: Discover Route53 zone
        if: steps.gates.outputs.test_unit != 'true' && steps.gates.outputs.test_e2e != 'true'
        run: |
          # The account provides one pre-existing public hosted zone.
          # We query the first zone in the account and use its domain.
          ZONE_JSON=$(aws route53 list-hosted-zones \
            --query 'HostedZones[?Config.PrivateZone==`false`] | [0]' \
            --output json)

          if [ "$ZONE_JSON" = "null" ] || [ -z "$ZONE_JSON" ]; then
            echo "ERROR: No public hosted zone found in this AWS account."
            echo "The workflow requires a Route53 public hosted zone to already exist."
            exit 1
          fi

          # Zone ID: strip the leading /hostedzone/ prefix.
          RAW_ID=$(echo "$ZONE_JSON" | jq -r '.Id')
          ZONE_ID="${RAW_ID#/hostedzone/}"

          # Domain: strip the trailing dot that Route53 appends.
          RAW_NAME=$(echo "$ZONE_JSON" | jq -r '.Name')
          DOMAIN="${RAW_NAME%.}"

          echo "Found zone: ${DOMAIN} (${ZONE_ID})"

          echo "TF_VAR_domain=${DOMAIN}"               >> "$GITHUB_ENV"
          echo "TF_VAR_route53_zone_id=${ZONE_ID}"     >> "$GITHUB_ENV"

      - name: Generate Cognito test credentials
        if: steps.gates.outputs.test_unit != 'true' && steps.gates.outputs.test_e2e != 'true'
        run: |
          # Generate fresh test credentials each CI run so they're never
          # committed. The Cognito pool is created by Terraform; these
          # values are passed straight through as TF_VAR_* so Terraform
          # creates the test user.
          EMAIL="ci-test@${TF_VAR_domain}"
          # Password must satisfy pool policy: 12+ chars, upper, lower, digit.
          SUFFIX=$(openssl rand -hex 4 | tr 'a-f' 'A-F')
          PASSWORD="CiTest${SUFFIX}99"
          echo "TF_VAR_cognito_test_user_email=${EMAIL}"       >> "$GITHUB_ENV"
          echo "TF_VAR_cognito_test_user_password=${PASSWORD}" >> "$GITHUB_ENV"
          echo "Cognito test user: ${EMAIL}"

      # ──────────────────────────────────────────────────────────────────────
      # Detect which Terraform modules exist in this checkout.
      # The workflow must not hard-fail before the Terraform code is merged.
      # ──────────────────────────────────────────────────────────────────────

      - name: Detect modules
        id: modules
        run: |
          echo "has_base=$(test -d terraform/base && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_management=$(test -d terraform/management && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # ──────────────────────────────────────────────────────────────────────
      # BASE MODULE
      # ──────────────────────────────────────────────────────────────────────

      - name: "[base] init"
        id: init_base
        if: steps.modules.outputs.has_base == 'true' && steps.gates.outputs.base_init == 'true'
        working-directory: terraform/base
        run: |
          set -o pipefail
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=k8-platform/base/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_DYNAMODB_TABLE}" \
            2>&1 | tee "${RUNNER_TEMP}/base-init.txt"

      - name: "[base] plan"
        id: plan_base
        if: steps.gates.outputs.base_plan == 'true' && steps.init_base.outcome == 'success'
        working-directory: terraform/base
        run: |
          set -o pipefail
          terraform plan -no-color -out=base.tfplan \
            2>&1 | tee "${RUNNER_TEMP}/base-plan.txt"

      - name: "[base] apply"
        id: apply_base
        if: steps.gates.outputs.base_apply == 'true' && steps.plan_base.outcome == 'success'
        working-directory: terraform/base
        run: |
          set -o pipefail
          terraform apply -auto-approve -no-color base.tfplan \
            2>&1 | tee "${RUNNER_TEMP}/base-apply.txt"

      # ──────────────────────────────────────────────────────────────────────
      # BASE E2E VERIFICATION
      # Confirms the base resources are actually functional, not just created.
      # Runs on action=verify (no apply) or action=apply-and-verify (post-apply).
      # ──────────────────────────────────────────────────────────────────────

      - name: "[base] e2e-verify"
        id: e2e_base
        if: >-
          steps.gates.outputs.base_verify == 'true' &&
          steps.init_base.outcome == 'success' &&
          (steps.apply_base.outcome == 'success' || steps.apply_base.outcome == 'skipped')
        working-directory: terraform/base
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/base-e2e.txt") 2>&1

          # ACM wildcard certificate must be ISSUED (Terraform waits for this,
          # but an explicit check catches any post-apply revocation or API lag).
          CERT_ARN=$(terraform output -raw acm_certificate_arn)
          STATUS=$(aws acm describe-certificate --certificate-arn "$CERT_ARN" \
            --query 'Certificate.Status' --output text)
          [ "$STATUS" = "ISSUED" ] \
            || { echo "FAIL: ACM cert status is '$STATUS' (expected ISSUED)"; exit 1; }
          echo "OK: ACM certificate ISSUED ($CERT_ARN)"

          # Cognito user pool must be accessible.
          POOL_ID=$(terraform output -raw cognito_user_pool_id)
          aws cognito-idp describe-user-pool --user-pool-id "$POOL_ID" > /dev/null
          echo "OK: Cognito user pool exists ($POOL_ID)"

          # Test user must have been created (verifies the Terraform resource and
          # the generated credentials are consistent with the pool policy).
          aws cognito-idp admin-get-user \
            --user-pool-id "$POOL_ID" \
            --username "$TF_VAR_cognito_test_user_email" > /dev/null
          echo "OK: Cognito test user exists ($TF_VAR_cognito_test_user_email)"

      # ──────────────────────────────────────────────────────────────────────
      # MANAGEMENT MODULE
      # Depends on base remote state; plan/init may fail before base is applied.
      # ──────────────────────────────────────────────────────────────────────

      - name: "[management] init"
        id: init_management
        if: steps.modules.outputs.has_management == 'true' && steps.gates.outputs.mgmt_init == 'true'
        continue-on-error: true
        working-directory: terraform/management
        run: |
          set -o pipefail
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=k8-platform/management/terraform.tfstate" \
            -backend-config="region=${TF_BACKEND_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_DYNAMODB_TABLE}" \
            2>&1 | tee "${RUNNER_TEMP}/mgmt-init.txt"

      - name: "[management] plan"
        id: plan_management
        if: steps.gates.outputs.mgmt_plan == 'true' && steps.init_management.outcome == 'success'
        continue-on-error: true
        working-directory: terraform/management
        run: |
          set -o pipefail
          terraform plan -no-color -out=mgmt.tfplan \
            2>&1 | tee "${RUNNER_TEMP}/mgmt-plan.txt"

      - name: "[management] apply"
        id: apply_management
        if: >-
          steps.gates.outputs.mgmt_apply == 'true' &&
          steps.init_management.outcome == 'success'
        working-directory: terraform/management
        run: |
          set -o pipefail
          terraform plan -no-color -out=mgmt.tfplan \
            2>&1 | tee "${RUNNER_TEMP}/mgmt-plan-pre-apply.txt"
          terraform apply -auto-approve -no-color mgmt.tfplan \
            2>&1 | tee "${RUNNER_TEMP}/mgmt-apply.txt"

      # ──────────────────────────────────────────────────────────────────────
      # MANAGEMENT E2E VERIFICATION
      # Validates REQ-MGMT-03, REQ-MGMT-05, REQ-MGMT-06, REQ-MGMT-07:
      # cluster active, all workloads running, IRSA wired up, ingress configured.
      # ──────────────────────────────────────────────────────────────────────

      - name: "[management] e2e-verify"
        id: e2e_management
        if: >-
          steps.gates.outputs.mgmt_verify == 'true' &&
          steps.init_management.outcome == 'success' &&
          (steps.apply_management.outcome == 'success' || steps.apply_management.outcome == 'skipped')
        working-directory: terraform/management
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/mgmt-e2e.txt") 2>&1

          CLUSTER=$(terraform output -raw cluster_name)
          REGION="${AWS_DEFAULT_REGION:-us-east-1}"
          KB=/tmp/e2e-kubeconfig
          aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION" --kubeconfig "$KB"
          export KUBECONFIG="$KB"

          # EKS cluster must report ACTIVE.
          STATUS=$(aws eks describe-cluster --name "$CLUSTER" \
            --query 'cluster.status' --output text)
          [ "$STATUS" = "ACTIVE" ] \
            || { echo "FAIL: EKS cluster status is '$STATUS' (expected ACTIVE)"; exit 1; }
          echo "OK: EKS cluster ACTIVE ($CLUSTER)"

          # At least one worker node must be Ready.
          READY=$(kubectl get nodes --no-headers 2>/dev/null \
            | grep -c " Ready " || true)
          [ "$READY" -ge 1 ] \
            || { echo "FAIL: no Ready nodes found"; exit 1; }
          echo "OK: $READY node(s) Ready"

          # All five Helm-installed namespaces must have at least one Running pod.
          # The Helm provider's default wait=true means pods should already be up,
          # but we allow a 3-minute window for any slow image pulls.
          # external-dns uses wait=false so it may need the full retry window.
          NAMESPACES="argocd crossplane-system external-dns external-secrets ingress-nginx"
          for i in $(seq 1 18); do
            ALL_UP=true
            for NS in $NAMESPACES; do
              COUNT=$(kubectl get pods -n "$NS" --no-headers 2>/dev/null \
                | grep -c "Running" || true)
              [ "$COUNT" -ge 1 ] || ALL_UP=false
            done
            [ "$ALL_UP" = "true" ] && break
            echo "  waiting for pods... (attempt $i/18)"
            sleep 10
          done
          for NS in $NAMESPACES; do
            RUNNING=$(kubectl get pods -n "$NS" --no-headers 2>/dev/null \
              | grep -c "Running" || true)
            [ "$RUNNING" -ge 1 ] \
              || { echo "FAIL: no Running pods in namespace $NS"; exit 1; }
            echo "OK: $NS — $RUNNING pod(s) running"
          done

          # ArgoCD server service account must carry the IRSA annotation (REQ-MGMT-05).
          IRSA=$(kubectl get serviceaccount argocd-server -n argocd \
            -o jsonpath='{.metadata.annotations.eks\.amazonaws\.com/role-arn}' \
            2>/dev/null || true)
          [ -n "$IRSA" ] \
            || { echo "FAIL: argocd-server SA is missing the IRSA role annotation"; exit 1; }
          echo "OK: ArgoCD SA IRSA role — $IRSA"

          # ArgoCD ingress object must exist with the expected hostname.
          HOST=$(kubectl get ingress -n argocd \
            -o jsonpath='{.items[0].spec.rules[0].host}' 2>/dev/null || true)
          [ -n "$HOST" ] \
            || { echo "FAIL: no ArgoCD Ingress found in namespace argocd"; exit 1; }
          echo "OK: ArgoCD ingress configured for host $HOST"

      # ArgoCD URL reachability is a best-effort check: ExternalDNS needs time to
      # create the CNAME and the NLB needs time to become healthy. Failure here is
      # surfaced in the summary comment but does NOT fail the workflow.
      - name: "[management] argocd-url"
        id: e2e_argocd_url
        if: steps.e2e_management.outcome == 'success'
        continue-on-error: true
        working-directory: terraform/management
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/mgmt-e2e-argocd.txt") 2>&1

          HOSTNAME="argocd.management.${TF_VAR_domain}"
          ARGOCD_URL=$(terraform output -raw argocd_url)
          echo "Waiting for Route53 record to be created by ExternalDNS: $HOSTNAME"

          # ExternalDNS reconciles ingress annotations into Route53. Querying the
          # zone API directly is more deterministic than waiting for recursive
          # resolver propagation, which can outlast the 5-minute window even
          # after the record exists.
          DNS_OK=false
          CLUSTER=$(terraform output -raw cluster_name)
          KB=/tmp/e2e-kubeconfig
          export KUBECONFIG="$KB"
          for i in $(seq 1 30); do
            RECORD=$(aws route53 list-resource-record-sets \
              --hosted-zone-id "$TF_VAR_route53_zone_id" \
              --query "ResourceRecordSets[?Name=='${HOSTNAME}.'] | [0]" \
              --output json 2>/dev/null || true)
            if [ -n "$RECORD" ] && [ "$RECORD" != "null" ]; then
              DNS_OK=true
              echo "Route53 record exists after approx $((i * 10))s:"
              echo "$RECORD"
              break
            fi
            echo "  no record yet (attempt $i/30)..."
            sleep 10
          done
          if [ "$DNS_OK" != "true" ]; then
            echo "FAIL: Route53 record for $HOSTNAME was not created within 5 minutes"
            echo "---- external-dns pod status ----"
            kubectl get pods -n external-dns -o wide || true
            echo "---- external-dns recent logs ----"
            kubectl logs -n external-dns -l app.kubernetes.io/name=external-dns --tail=80 || true
            echo "---- argocd ingress ----"
            kubectl get ingress -n argocd -o yaml | head -60 || true
            exit 1
          fi

          # NLB terminates TLS; ArgoCD serves HTTP behind it.  Accept any 2xx or 3xx.
          HTTP=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "$ARGOCD_URL" || true)
          if ! { [ "${HTTP}" -ge 200 ] && [ "${HTTP}" -lt 500 ]; }; then
            echo "FAIL: ArgoCD UI returned HTTP $HTTP at $ARGOCD_URL"
            echo "---- argocd ingress rules ----"
            kubectl get ingress argocd-server -n argocd -o yaml | sed -n '1,80p' || true
            echo "---- ingress-nginx service ----"
            kubectl get svc -n ingress-nginx -o wide || true
            echo "---- ingress-nginx controller logs (tail) ----"
            kubectl logs -n ingress-nginx -l app.kubernetes.io/component=controller --tail=60 || true
            echo "---- argocd-server pod logs (tail) ----"
            kubectl logs -n argocd -l app.kubernetes.io/name=argocd-server --tail=40 || true
            exit 1
          fi
          echo "OK: ArgoCD UI reachable at $ARGOCD_URL (HTTP $HTTP)"

      # ──────────────────────────────────────────────────────────────────────
      # DESTROY — runs ONLY when action=destroy. Explicit, scoped to the
      # requested phase. The environment otherwise persists between runs.
      # ──────────────────────────────────────────────────────────────────────

      - name: "[management] destroy"
        id: destroy_management
        if: steps.gates.outputs.mgmt_destroy == 'true' && steps.init_management.outcome == 'success'
        working-directory: terraform/management
        run: |
          set -o pipefail
          terraform destroy -auto-approve -no-color \
            2>&1 | tee "${RUNNER_TEMP}/mgmt-destroy.txt"

      - name: "[base] destroy"
        id: destroy_base
        if: steps.gates.outputs.base_destroy == 'true' && steps.init_base.outcome == 'success'
        working-directory: terraform/base
        run: |
          set -o pipefail
          terraform destroy -auto-approve -no-color \
            2>&1 | tee "${RUNNER_TEMP}/base-destroy.txt"

      # ──────────────────────────────────────────────────────────────────────
      # TEST PHASE — the harness's own unit and e2e tests. No Terraform.
      # See ai/testing-guidelines.md §9 ("Testing the harness").
      # ──────────────────────────────────────────────────────────────────────

      - name: "[test] unit"
        id: test_unit
        if: steps.gates.outputs.test_unit == 'true'
        run: |
          set -o pipefail
          tests/unit/run.sh 2>&1 | tee "${RUNNER_TEMP}/test-unit.txt"

      - name: "[test] e2e"
        id: test_e2e
        if: steps.gates.outputs.test_e2e == 'true'
        env:
          # Surface AWS region/creds explicitly for the e2e harness so it
          # behaves identically whether invoked here or locally with the
          # same env set.
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -o pipefail
          tests/e2e/run.sh 2>&1 | tee "${RUNNER_TEMP}/test-e2e.txt"

      # ──────────────────────────────────────────────────────────────────────
      # SUMMARY COMMENT — posted to the PR (if one exists) or the commit.
      # ──────────────────────────────────────────────────────────────────────

      - name: Post summary comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_MODE: ${{ github.event_name == 'push' && 'push-plan' || format('{0}-{1}', inputs.phase, inputs.action) }}
          INIT_BASE_OUTCOME: ${{ steps.init_base.outcome }}
          PLAN_BASE_OUTCOME: ${{ steps.plan_base.outcome }}
          APPLY_BASE_OUTCOME: ${{ steps.apply_base.outcome }}
          E2E_BASE_OUTCOME: ${{ steps.e2e_base.outcome }}
          DESTROY_BASE_OUTCOME: ${{ steps.destroy_base.outcome }}
          INIT_MGMT_OUTCOME: ${{ steps.init_management.outcome }}
          PLAN_MGMT_OUTCOME: ${{ steps.plan_management.outcome }}
          APPLY_MGMT_OUTCOME: ${{ steps.apply_management.outcome }}
          E2E_MGMT_OUTCOME: ${{ steps.e2e_management.outcome }}
          E2E_ARGOCD_URL_OUTCOME: ${{ steps.e2e_argocd_url.outcome }}
          DESTROY_MGMT_OUTCOME: ${{ steps.destroy_management.outcome }}
          TEST_UNIT_OUTCOME: ${{ steps.test_unit.outcome }}
          TEST_E2E_OUTCOME: ${{ steps.test_e2e.outcome }}
        run: python3 .github/scripts/post-comment.py
