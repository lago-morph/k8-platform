# Run the unit-test suite on every push to a non-main branch.
#
# `terraform-test.yml` is workflow_dispatch-only — the unit tests live
# under it and historically only ran when the operator explicitly
# dispatched a job. That means a broken `tests/unit/*.sh` could sit on
# main between dispatches without anyone noticing (and historically
# did — see scripts/diag-component.sh $SELECTOR bug fixed in PR #46).
#
# This workflow auto-runs on every push to a feature branch so unit-
# test regressions surface immediately on the offending PR.
#
# Per-test steps (rather than one `run.sh` step) so each failure is
# diagnosable from the GitHub Actions UI without scrolling through
# the full run, and so known-broken tests can be tolerated explicitly
# until they're fixed.
#
# A final `run.sh catch-all` step backstops the per-step list so any
# test added to `tests/unit/run.sh` is automatically gated on push,
# even if the contributor forgot to add a matching per-step entry
# here. The catch-all is the source of truth for completeness; the
# per-step list above is for Actions-UI diagnostic clarity on the
# tests that have been wired individually.
name: Unit tests

on:
  push:
    branches-ignore:
      - main
  # Also runnable manually for cases where someone wants to confirm
  # a green local run matches CI.
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install yq (Mike Farah's Go implementation) — every existing
      # unit test that touches YAML uses this.
      - name: Install yq
        run: |
          set -euo pipefail
          # Pin sourced from tests/chainsaw/versions.env (YQ_VERSION) — the
          # single source of truth shared with scripts/sandbox-setup.sh, so the
          # sandbox and CI cannot drift to a yq that mis-parses the mikefarah
          # `yq ea` syntax in composition-render.sh (OI-2026-06-06-1).
          # shellcheck disable=SC1091
          . tests/chainsaw/versions.env
          sudo curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # helm is required by test_helm_render.sh; the others are pure
      # bash/yq.
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Verify python3 (test_post_comment.sh subprocesses use it)
        run: python3 --version

      # PyYAML is required by test_kubeconform_manifests.sh (the
      # function-input extraction parses Composition YAML).
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      # kubeconform — static YAML/CRD-schema lint. Pinned to KUBECONFORM_VERSION
      # in versions.env. Consumed by test_kubeconform_manifests.sh
      # (SPEC-S6).
      - name: Install kubeconform
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . versions.env
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          sudo chmod +x /usr/local/bin/kubeconform
          kubeconform -v

      # SPEC-S9: install the crossplane CLI so the composition-render
      # dry-run tests can exercise the helper end-to-end. When the CLI
      # is unavailable the render tests skip-with-warning (see
      # tests/unit/test_composition_render_*), so this install step is
      # best-effort: a failure here will not red the suite, only
      # downgrade the render tests to skip mode.
      - name: Install crossplane CLI (SPEC-S9)
        continue-on-error: true
        run: |
          set -uo pipefail
          # Pin the CLI to the SAME Crossplane version the management cluster
          # runs (CROSSPLANE_CHART_VERSION) so `crossplane render` in
          # test_composition_render_fixtures.sh matches what composition-render.sh
          # verified locally. install.sh-from-main installed a CLI that defaulted
          # the render orchestrator image to the floating :stable tag (v1.20.9 →
          # `unexpected argument internal`); pinning removes that drift.
          # OI-2026-06-06-1. Best-effort: a failure here only downgrades the
          # render tests to skip mode.
          # shellcheck disable=SC1091
          . tests/chainsaw/versions.env
          ver="v${CROSSPLANE_CHART_VERSION}"
          tmp=$(mktemp -d)
          if curl -fsSL "https://releases.crossplane.io/stable/${ver}/bin/linux_amd64/crank" -o "$tmp/crossplane"; then
            sudo mv "$tmp/crossplane" /usr/local/bin/crossplane
            sudo chmod +x /usr/local/bin/crossplane
            /usr/local/bin/crossplane version --client || true
          else
            echo "(crossplane CLI install failed — render tests will skip)"
          fi
          rm -rf "$tmp"

      - name: test_compute_gates
        run: bash tests/unit/test_compute_gates.sh

      - name: test_irsa_helm_linkage
        run: bash tests/unit/test_irsa_helm_linkage.sh

      - name: test_iam_required_actions
        run: bash tests/unit/test_iam_required_actions.sh

      - name: test_eks_module_defaults
        run: bash tests/unit/test_eks_module_defaults.sh

      - name: test_helm_render
        run: bash tests/unit/test_helm_render.sh

      - name: test_post_comment
        run: bash tests/unit/test_post_comment.sh

      - name: test_kyverno_policy_lint
        run: bash tests/unit/test_kyverno_policy_lint.sh

      # The diag-component test was added in PR #46. Skipped gracefully
      # by `bash -c` returning 0 if the file doesn't exist on a branch
      # that predates #46.
      - name: test_diag_component
        run: |
          if [ -f tests/unit/test_diag_component.sh ]; then
            bash tests/unit/test_diag_component.sh
          else
            echo "(test_diag_component.sh not on this branch — skipped)"
          fi

      # Phase-2a unit tests — skip gracefully on branches that predate
      # them. Once the phase-2a stack merges, these become required.
      - name: test_chainsaw_kind_config
        run: |
          if [ -f tests/unit/test_chainsaw_kind_config.sh ]; then
            bash tests/unit/test_chainsaw_kind_config.sh
          else
            echo "(test_chainsaw_kind_config.sh not on this branch — skipped)"
          fi

      # SPEC-A4 enforcer: every chainsaw scenario carries the canonical
      # `catch:` block from tests/chainsaw/_lib/catch-block.yaml.
      - name: test_chainsaw_catch_block
        run: |
          if [ -f tests/unit/test_chainsaw_catch_block.sh ]; then
            bash tests/unit/test_chainsaw_catch_block.sh
          else
            echo "(test_chainsaw_catch_block.sh not on this branch — skipped)"
          fi

      - name: test_platform_secret_xrd
        run: |
          if [ -f tests/unit/test_platform_secret_xrd.sh ]; then
            bash tests/unit/test_platform_secret_xrd.sh
          else
            echo "(test_platform_secret_xrd.sh not on this branch — skipped)"
          fi

      - name: test_platform_secret_composition
        run: |
          if [ -f tests/unit/test_platform_secret_composition.sh ]; then
            bash tests/unit/test_platform_secret_composition.sh
          else
            echo "(test_platform_secret_composition.sh not on this branch — skipped)"
          fi

      - name: test_argocd_app_revision_pinned
        run: |
          if [ -f tests/unit/test_argocd_app_revision_pinned.sh ]; then
            bash tests/unit/test_argocd_app_revision_pinned.sh
          else
            echo "(test_argocd_app_revision_pinned.sh not on this branch — skipped)"
          fi

      - name: test_argocd_bootstrap
        run: |
          if [ -f tests/unit/test_argocd_bootstrap.sh ]; then
            bash tests/unit/test_argocd_bootstrap.sh
          else
            echo "(test_argocd_bootstrap.sh not on this branch — skipped)"
          fi

      # SPEC-S6 — static kubeconform lint against the committed
      # CRD schema store. Catches Bug 4 (PR #61, string-transform
      # missing inner type) and Bug 1 (PR #74, forceOverwriteReplica
      # field absent from CRD) at commit time.
      - name: test_kubeconform_manifests
        run: |
          if [ -f tests/unit/test_kubeconform_manifests.sh ]; then
            bash tests/unit/test_kubeconform_manifests.sh
          else
            echo "(test_kubeconform_manifests.sh not on this branch — skipped)"
          fi

      # SPEC-S9 composition-render tests — skip gracefully on branches
      # that predate them. The render-dependent ones internally skip
      # when the crossplane CLI is absent (best-effort install above).
      - name: test_composition_render_fixtures
        run: |
          if [ -f tests/unit/test_composition_render_fixtures.sh ]; then
            bash tests/unit/test_composition_render_fixtures.sh
          else
            echo "(test_composition_render_fixtures.sh not on this branch — skipped)"
          fi

      - name: test_composition_render_catches_bug4
        run: |
          if [ -f tests/unit/test_composition_render_catches_bug4.sh ]; then
            bash tests/unit/test_composition_render_catches_bug4.sh
          else
            echo "(test_composition_render_catches_bug4.sh not on this branch — skipped)"
          fi

      - name: test_composition_render_diff_detected
        run: |
          if [ -f tests/unit/test_composition_render_diff_detected.sh ]; then
            bash tests/unit/test_composition_render_diff_detected.sh
          else
            echo "(test_composition_render_diff_detected.sh not on this branch — skipped)"
          fi

      - name: test_composition_render_no_golden_exit0
        run: |
          if [ -f tests/unit/test_composition_render_no_golden_exit0.sh ]; then
            bash tests/unit/test_composition_render_no_golden_exit0.sh
          else
            echo "(test_composition_render_no_golden_exit0.sh not on this branch — skipped)"
          fi

      - name: test_composition_render_version_pin
        run: |
          if [ -f tests/unit/test_composition_render_version_pin.sh ]; then
            bash tests/unit/test_composition_render_version_pin.sh
          else
            echo "(test_composition_render_version_pin.sh not on this branch — skipped)"
          fi

      # run.sh catch-all — executes every test wired into
      # tests/unit/run.sh, including the ones not (yet) given a per-step
      # entry above. This is the gate that prevents drift: any new test
      # appended to run.sh is automatically required-to-pass on push,
      # even if no matching step was added here. Re-runs the per-step
      # tests above (~30s of overlap on a clean checkout) in exchange
      # for never silently dropping a test from CI. Per AGENTS.md §6.13
      # the per-step list above remains useful for Actions-UI clarity on
      # the tests that have been wired individually.
      - name: run.sh catch-all (gates every test in tests/unit/run.sh)
        run: bash tests/unit/run.sh
