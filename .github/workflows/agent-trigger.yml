name: Agent Trigger

# Lets the agent (Claude Code on the web) fire CI without workflow_dispatch
# access. When `.trigger-action.json` changes on a non-default branch, this
# workflow parses it and calls terraform-test.yml as a reusable workflow.
#
# Contract documented in ai/testing-guidelines.md §8.
#
#   .trigger-action.json
#   {
#     "phase":  "base" | "management" | "test",
#     "action": <see below>,
#     "nonce":  "<any-string>"
#   }
#
# Action choices are tuple-validated against phase:
#   phase=base or management → plan | apply | verify | apply-and-verify | destroy
#   phase=test               → test-unit | test-e2e
#
# The nonce field is informational only — its purpose is to let the agent
# re-fire the same phase+action by changing the nonce, since an identical
# JSON body would otherwise be a no-op commit. The workflow does not
# validate or act on the nonce value.
#
# Parsing and validation live in .github/scripts/parse-trigger.sh so they
# can be exercised by tests/unit/test_parse_trigger.sh outside of CI.

on:
  push:
    paths:
      - ".trigger-action.json"

# One trigger run per branch at a time; cancel in-flight on new push.
concurrency:
  group: agent-trigger-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  parse:
    name: Parse trigger
    # Never fire on the default branch — merging a PR that includes a stale
    # .trigger-action.json must not accidentally re-apply Terraform.
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.read.outputs.phase }}
      action: ${{ steps.read.outputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate .trigger-action.json
        id: read
        run: |
          set -euo pipefail
          # Parse logic is in a separate script so it is reachable from
          # tests/unit/test_parse_trigger.sh. Keep this step thin.
          .github/scripts/parse-trigger.sh .trigger-action.json >> "$GITHUB_OUTPUT"
          # Echo what we just emitted for run-log readability.
          NONCE=$(jq -r '.nonce // ""' .trigger-action.json)
          echo "Parsed trigger nonce='$NONCE'"

  run:
    name: Run terraform-test (${{ needs.parse.outputs.phase }} / ${{ needs.parse.outputs.action }})
    needs: parse
    uses: ./.github/workflows/terraform-test.yml
    secrets: inherit
    with:
      phase: ${{ needs.parse.outputs.phase }}
      action: ${{ needs.parse.outputs.action }}
