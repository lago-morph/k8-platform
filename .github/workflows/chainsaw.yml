# Chainsaw test harness for Crossplane XRDs and Compositions.
#
# Runs on:
#   - workflow_dispatch       — manual smoke-test trigger
#   - push to a feature branch when paths under crossplane/, tests/chainsaw/,
#     or this workflow itself change
#
# This is intentionally a SEPARATE workflow from terraform-test.yml so the
# Crossplane Composition feedback loop doesn't block on (or get blocked by)
# the slow terraform path, and so each side can be observed independently
# in the GitHub Actions UI.
#
# AWS credentials are passed through ONLY when the workflow is dispatched
# manually or run on a branch with the appropriate environment binding.
# A path-filter-only trigger does NOT carry AWS creds — the _smoke
# scenario runs without them; real-AWS scenarios will fail closed in
# that case (which is the desired behaviour).
name: Chainsaw

# workflow_dispatch ONLY. Per AGENTS.md §6.7 manual-verify-then-PR
# pattern: the agent dispatches this workflow against a specific commit
# SHA before opening the PR, then opens the PR knowing the run is
# already green. The push-triggered `Chainsaw verify` workflow checks
# for the green run and gates the PR check; it does NOT re-run scenarios.
#
# Rationale: the chainsaw harness is heavy (~5 min: kind boot + Crossplane
# install + function install + ESO + ClusterSecretStore + scenarios). Running
# it on every push burns runner minutes and produces noisy red checks while
# the agent iterates. The dispatch-and-verify pattern means PR CI is always
# green by construction.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA the dispatch is verifying. The verifier workflow looks for this SHA in the run's head_sha."
        required: false
        default: ""
      scenario_filter:
        description: "Optional path filter passed as CHAINSAW_SCENARIOS (default: all)"
        required: false
        default: ""

concurrency:
  # One chainsaw run per branch — multiple in parallel against the same
  # shared AWS account would collide on the k8-platform-chainsaw-* prefix.
  # CHAINSAW_RUN_ID separates concurrent runs across DIFFERENT branches.
  group: chainsaw-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chainsaw:
    name: Chainsaw (Crossplane scenarios)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Per-run isolation prefix for ASM secret naming. The chainsaw
      # cleanup trap force-deletes every secret under this prefix on
      # exit, success or failure.
      CHAINSAW_RUN_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
      # Pass-through for real-AWS scenarios. Empty values mean smoke-only.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load pinned tool versions
        id: versions
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . tests/chainsaw/versions.env
          echo "kind_version=$KIND_VERSION"          >> "$GITHUB_OUTPUT"
          echo "chainsaw_version=$CHAINSAW_VERSION"  >> "$GITHUB_OUTPUT"

      - name: Install kind
        run: |
          set -euo pipefail
          # /usr/local/bin/ on ubuntu-24.04 GH-hosted runners is root-owned;
          # both curl-to and chmod need sudo. Without it the install step
          # fails with "Operation not permitted" (see run 26343739179).
          sudo curl -fsSL \
            "https://kind.sigs.k8s.io/dl/${{ steps.versions.outputs.kind_version }}/kind-linux-amd64" \
            -o /usr/local/bin/kind
          sudo chmod +x /usr/local/bin/kind
          kind --version

      - name: Install chainsaw
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/kyverno/chainsaw/releases/download/${{ steps.versions.outputs.chainsaw_version }}/chainsaw_linux_amd64.tar.gz" \
            -o /tmp/chainsaw.tar.gz
          tar -xzf /tmp/chainsaw.tar.gz -C /tmp
          sudo install -m 0755 /tmp/chainsaw /usr/local/bin/chainsaw
          chainsaw version

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Verify pre-existing tools
        run: |
          kubectl version --client
          docker version
          aws --version || echo "(aws not present — smoke-only scenarios will run)"

      - name: Run pinning unit test
        # The unit test asserts versions.env + run.sh + kind-config.yaml
        # all agree. If it fails here, the harness itself is broken;
        # fail fast before booting kind.
        run: bash tests/unit/test_chainsaw_kind_config.sh

      - name: Run chainsaw harness
        env:
          # Optional dispatch-time scenario filter.
          CHAINSAW_SCENARIOS: ${{ github.event.inputs.scenario_filter }}
        run: bash tests/chainsaw/run.sh
