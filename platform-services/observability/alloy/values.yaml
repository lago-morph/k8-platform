# Grafana Alloy Helm values — the AGENT on the MANAGEMENT (hub) cluster
# (REQ-OBS-02). Alloy scrapes hub metrics + tails hub pod logs and ships them to
# the CENTRAL stack on the platform (spoke) cluster: metrics via Prometheus
# remote_write, logs via the Loki push API.
#
# IMPORTANT — destination cluster: this agent runs on the HUB, but its OUTPUT
# targets the SPOKE. The spoke Prometheus/Loki are reached over the spoke
# ingress (grafana/prometheus/loki hostnames under platform.<domain>) — an
# in-cluster-svc-via-spoke endpoint. Both endpoints are account-ephemeral
# (depend on <domain>) and are NEVER committed: the river config reads them
# from env vars via sys.env(), injected as alloy.extraEnv by the
# ApplicationSet template from the spoke cluster Secret's cluster-facts
# annotations (ADR-0010; CI-gated by
# tests/unit/test_spoke_values_no_ephemeral.sh).
#
# Deployed by the hub ArgoCD as argocd/apps/spoke/observability-alloy-mgmt.yaml,
# under the dedicated `hub-addons` AppProject (argocd/projects/hub-addons.yaml).
# That project resolves the former AppProject conflict (a hub-targeted
# third-party chart fits neither k8-platform — no third-party charts on the hub
# — nor platform-spoke — no hub destination) per Option A in
# decisions/2026-06-06-phase4-alloy-phase5-db.md.

# Run Alloy as a DaemonSet so it can tail every node's pod logs (the logs
# pipeline reads /var/log on each node) and scrape node-local targets.
controller:
  type: daemonset

alloy:
  # Annotation-driven scraping (REQ-OBS-04): the river config below uses
  # discovery.kubernetes + discovery.relabel to honor the standard
  # prometheus.io/scrape, prometheus.io/port, prometheus.io/path annotations,
  # then remote_writes to the spoke Prometheus. It also tails pod logs and
  # pushes them to the spoke Loki.
  #
  # SPOKE_PROMETHEUS_REMOTE_WRITE_URL and SPOKE_LOKI_PUSH_URL are env vars
  # injected by the ApplicationSet template (alloy.extraEnv) from the spoke's
  # cluster-facts annotations (ADR-0010) — e.g.
  # https://prometheus.platform.<domain>/api/v1/write and
  # https://loki.platform.<domain>/loki/api/v1/push. Env indirection because
  # helm values cannot patch inside this config string; sys.env() is the
  # Alloy stdlib lookup. Never real URLs in git.
  configMap:
    content: |-
      // ── metrics: annotation-driven scrape of hub pods ──────────────────
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "annotated_pods" {
        targets = discovery.kubernetes.pods.targets

        // keep only pods opted-in via prometheus.io/scrape: "true"
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex         = "true"
          action        = "keep"
        }
        // honor prometheus.io/path
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
          regex         = "(.+)"
          target_label  = "__metrics_path__"
          action        = "replace"
        }
        // honor prometheus.io/port (host:port)
        rule {
          source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
          regex         = "([^:]+)(?::\\d+)?;(\\d+)"
          replacement   = "$1:$2"
          target_label  = "__address__"
          action        = "replace"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      prometheus.scrape "annotated" {
        targets    = discovery.relabel.annotated_pods.output
        forward_to = [prometheus.remote_write.spoke.receiver]
      }

      // remote_write management-cluster metrics to the SPOKE Prometheus.
      prometheus.remote_write "spoke" {
        endpoint {
          url = sys.env("SPOKE_PROMETHEUS_REMOTE_WRITE_URL")
        }
        external_labels = {
          cluster = "management",
        }
      }

      // ── logs: tail hub pod logs, push to the SPOKE Loki ────────────────
      discovery.kubernetes "log_pods" {
        role = "pod"
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.log_pods.targets
        forward_to = [loki.write.spoke.receiver]
      }

      loki.write "spoke" {
        endpoint {
          url = sys.env("SPOKE_LOKI_PUSH_URL")
        }
        external_labels = {
          cluster = "management",
        }
      }

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
