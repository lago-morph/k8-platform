# ClusterSecretStore — the bridge between ESO and AWS Secrets Manager on a
# SPOKE cluster (ADR-0005 ESO-baseline; delivered by the `eso` ApplicationSet
# alongside the chart).
#
# Authenticates via IRSA: the ESO controller pod runs as the
# external-secrets/external-secrets ServiceAccount (releaseName pinned in
# argocd/apps/spoke/eso.yaml), annotated with the spoke's
# k8-platform-<cluster>-eso role (XSpokeAccess eso-role; read-only on
# arn:aws:secretsmanager:...:secret:k8-platform/*).
#
# The name `aws-secrets-manager` is load-bearing and IDENTICAL to the hub's
# (clusters/management/eso/cluster-secret-store.yaml): every committed
# ExternalSecret references it by name, so a manifest is portable across
# hub and spokes. Renaming requires updating each referencing manifest AND
# the unit test pinning the invariant.
#
# region is us-east-1 by committed convention (same as the hub CSS and the
# keycloak-db XDatabase spec) — the region is not account-ephemeral.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            # MUST match the eso ApplicationSet's pinned releaseName
            # (→ SA name) and the trust policy's :sub subject.
            name: external-secrets
            namespace: external-secrets
