# ESO ExternalSecret — materializes the Cognito federation inputs on the
# SPOKE for the Keycloak realm import (REQ-AUTH-02/08).
#
# Source: ASM k8-platform/base/cognito, WRITTEN BY terraform/base
# (terraform/base/cognito.tf) — Terraform is the source of truth for the
# Cognito app client, so Terraform writes the container. This is the same
# live-proven ASM→ExternalSecret transport as keycloak-admin, with a
# different producer: the XPlatformSecret/ADR-0012 chain GENERATES its
# material and therefore cannot carry a Cognito-generated client secret.
#
# Consumption: dataFrom.extract materializes every JSON key (client_id,
# client_secret, issuer_url, authorization_url, token_url, user_info_url,
# logout_url, jwks_url) into the keycloak-cognito-idp Secret. The keycloak
# ApplicationSet (argocd/apps/spoke/keycloak.yaml) maps each key to a
# KC_COGNITO_* container env var via NON-OPTIONAL secretKeyRef — the pod
# does not start until this Secret exists, so the realm import can never
# run with an unset ${KC_COGNITO_*} placeholder (which would fail closed
# at Keycloak's import-time URL validation, the #233 class).
#
# deletionPolicy Retain: the running StatefulSet keeps its last-known-good
# federation inputs if the source is ever briefly absent (#231 lesson).
#
# Wave -1: before the chart's wave-0 resources — a pod-referenced Secret
# in a later wave than the StatefulSet deadlocks the first sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-cognito-idp
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-cognito-idp
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: k8-platform/base/cognito
