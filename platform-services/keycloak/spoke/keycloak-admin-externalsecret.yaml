# ESO Password generator + ExternalSecret — materializes the keycloak-admin
# bootstrap Secret ON the spoke with IN-PLATFORM generation (zero manual
# steps; ADR-0005: "ESO (PushSecret+ExternalSecret, generatorRef) is the
# default for secret movement/GENERATION in every cluster").
#
# WHY NOT XPlatformSecret (the original REQ-AUTH-01 sketch): the committed
# XPlatformSecret XRs (platform-services/keycloak/secrets/keycloak-secrets.yaml)
# were never synced by any Application, and the abstraction provisions an
# EMPTY ASM container whose material is documented as "generated/stored in
# ASM out of band" — an out-of-band write is a manual step, banned by the
# SUBSTRATE definition of done, and the uid-based ASM naming cannot be
# referenced from committed spoke manifests anyway. This generator is NOT a
# retrofit of a working XPlatformSecret usage (ADR-0005's guard) — that usage
# never worked. The XRs stay committed pending the XPlatformSecret
# material-generation redesign (docs/open-issues.md OI-2026-06-07-5 notes).
#
# The chart consumes auth.existingSecret=keycloak-admin with
# passwordSecretKey=admin-password (platform-services/keycloak/values.yaml).
# refreshInterval 0 = generate ONCE; a regenerating bootstrap password would
# rotate underneath the running StatefulSet.
#
# Wave -1: before the chart's wave-0 resources (same rationale as
# keycloak-db-externalsecret.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: keycloak-admin-password
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 5
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "0"
  target:
    name: keycloak-admin
    creationPolicy: Owner
    # Orphan on delete: a re-sync must not destroy the password the running
    # Keycloak was bootstrapped with.
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        admin-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: keycloak-admin-password
