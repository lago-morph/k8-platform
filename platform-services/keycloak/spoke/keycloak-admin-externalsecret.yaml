# ESO ExternalSecret — materializes the keycloak-admin bootstrap Secret on
# the SPOKE from the XPlatformSecret-owned ASM key (REQ-AUTH-01: every
# Keycloak secret is claimed back by a PlatformSecret).
#
# The hub keycloak-admin XPlatformSecret (platform-services/keycloak/
# secrets/keycloak-secrets.yaml, synced by argocd/apps/keycloak-secrets.yaml)
# provisions ASM k8-platform/keycloak/keycloak-admin with IN-PLATFORM
# generated material (the platform-secret Composition's generator →
# generate-once ES → SecretVersion writer; ADR-12992f055b; key `value`).
# The deterministic ns/name ASM naming (2026-06-11) is what makes this
# committed cross-cluster reference possible — the prior uid naming could
# not be referenced from git.
#
# SWAPPED BACK 2026-07-05 with the OI-2026-06-12-1 material-chain re-land:
# file + producer + test move in the same PR (the quarantine contract in
# tests/unit/test_keycloak_admin_secret_source.sh). deletionPolicy stays
# Retain — clean build #3 proved Delete erases the live bootstrap Secret
# if the source ever goes missing (#231), and the running StatefulSet must
# keep its last-known-good credential.
#
# The chart consumes auth.existingSecret=keycloak-admin with
# passwordSecretKey=admin-password (platform-services/keycloak/values.yaml);
# the template remaps the platform key `value` to that name.
#
# Wave -1: before the chart's wave-0 resources (ArgoCD waits for wave
# health before advancing; a pod-mounted Secret in a later wave than the
# StatefulSet deadlocks the first sync).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-admin
    creationPolicy: Owner
    # Retain on delete/source-loss: a re-sync or a missing source must not
    # destroy the password the running Keycloak was bootstrapped with (#231).
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        admin-password: "{{ .value }}"
  data:
    - secretKey: value
      remoteRef:
        key: k8-platform/keycloak/keycloak-admin
        property: value
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
