# Keycloak `platform` realm import (REQ-AUTH-02/03/07/08).
#
# Mounted by the Keycloak chart (platform-services/keycloak/values.yaml
# extraVolumes/extraVolumeMounts → /opt/bitnami/keycloak/data/import) and applied
# with `--import-realm` at startup. Keycloak is a pure BROKER here: it federates
# to Cognito and shapes tokens; NO users or groups are created or maintained in
# Keycloak itself (REQ-AUTH-03/08).
#
# This realm currently encodes ONE contract:
#
#   The public PKCE `kubernetes` client (REQ-AUTH-07): publicClient=true, NO
#   secret, PKCE (S256) enforced, used by the oidc-login kubectl plugin
#   (REQ-AUTH-10, docs/operations.md). A `groups` protocol mapper puts the
#   user's `groups` attribute into the ID token so the EKS API server's
#   groups claim resolves to `kc:k8s-admins` / `kc:k8s-viewers` (prefix set
#   by the EKS IdP config, REQ-AUTH-07; bound to roles by
#   clusters/platform/rbac/kc-*.yaml). The `username` mapper sets
#   preferred_username (REQ-AUTH-07).
#
# DEFERRED — the Cognito broker block (REQ-AUTH-02/03/08; tracked in
# docs/operations.md "Keycloak realm — live wiring"): the `identityProviders`
# (alias `cognito`) + `identityProviderMappers` (cognito:groups → `groups`
# attribute) blocks are intentionally ABSENT, not placeholdered. Clean build
# #3 (2026-06-12) proved Keycloak VALIDATES IdP URLs at import time and
# fails closed on placeholders ('The url [authorization_url] is malformed —
# no protocol: TODO_COGNITO_AUTH_URL') → CrashLoop. Deferred wiring means
# the block is absent (pinned by tests/unit/test_keycloak_realm_json.sh: no
# TODO_ values). At live-coupling time, source the issuer/auth/token/jwks/
# userInfo URLs from terraform/base outputs (cognito_issuer_url, the
# hosted-UI domain) and the client id/secret via the keycloak-oidc-clients
# XPlatformSecret (cognito_client_id / cognito_client_secret outputs), NOT
# git; also set <domain> in the kubernetes client redirect URIs. Until that
# lands, no group claims flow — the kc:* RBAC bindings are inert, which is
# the documented deferred state.
#
# NOTE: documentation lives HERE, never as `"comment"` fields inside the
# JSON — Keycloak's strict parser rejects unknown fields on every
# representation and ABORTS the realm import (same unit test).
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-platform
  namespace: keycloak
  annotations:
    # Wave -1: delivered by the keycloak ApplicationSet's directory source
    # (platform-services/keycloak/spoke/) BEFORE the chart's wave-0
    # resources — the StatefulSet mounts this ConfigMap, and ArgoCD waits
    # for wave health before advancing, so a later wave would deadlock the
    # first sync. (Was wave 36 when this file was designed for a hub-side
    # syncer that never existed — no Application ever synced it until the
    # OI-2026-06-07-5 build.)
    argocd.argoproj.io/sync-wave: "-1"
data:
  platform-realm.json: |
    {
      "realm": "platform",
      "enabled": true,
      "clients": [
        {
          "clientId": "kubernetes",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": [
            "http://localhost:8000",
            "http://localhost:18000"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "config": {
                "user.attribute": "groups",
                "claim.name": "groups",
                "jsonType.label": "String",
                "multivalued": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ]
    }
