# ESO ExternalSecret — materializes the keycloak-db connection Secret on the
# SPOKE from ASM (OI-2026-06-07-5; the consumer half of the hub PushSecret in
# platform-services/keycloak/database/keycloak-db-pushsecret.yaml).
#
# The produced Secret serves BOTH chart paths at once (one Secret, two
# consumption modes — pinned by tests/unit/test_keycloak_db_env_precedence.sh
# + test_keycloak_db_push_pull_contract.sh):
#   - username/password: read by the chart's explicit env valueFrom
#     (externalDatabase.existingSecret keys);
#   - KEYCLOAK_DATABASE_HOST/PORT: attached via extraEnvVarsSecret (envFrom),
#     overriding the keycloak-env-vars ConfigMap placeholders by Kubernetes'
#     last-envFrom-source-wins rule.
#
# Requires the spoke ESO baseline (argocd/apps/spoke/eso.yaml: chart + the
# aws-secrets-manager ClusterSecretStore + the XSpokeAccess eso-role read
# grant on k8-platform/*).
#
# Wave -1: applies BEFORE the chart's wave-0 resources so the StatefulSet
# never gates the within-app wave progression on a Secret that would only be
# created in a later wave (ArgoCD waits for wave health before advancing).
# Until ASM holds the pushed value the ES is simply not Ready and the
# keycloak pods wait on the missing Secret (kubelet CreateContainerConfigError
# → retried) — convergence, not failure.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-db
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        KEYCLOAK_DATABASE_HOST: "{{ .host }}"
        KEYCLOAK_DATABASE_PORT: "{{ .port }}"
  data:
    - secretKey: username
      remoteRef:
        key: k8-platform/keycloak-db
        property: username
    - secretKey: password
      remoteRef:
        key: k8-platform/keycloak-db
        property: password
    - secretKey: host
      remoteRef:
        key: k8-platform/keycloak-db
        property: host
    - secretKey: port
      remoteRef:
        key: k8-platform/keycloak-db
        property: port
