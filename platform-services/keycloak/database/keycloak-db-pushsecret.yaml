# ESO PushSecret — publishes the keycloak-db RDS connection Secret from the
# HUB into AWS Secrets Manager so the SPOKE can pull it (OI-2026-06-07-5;
# ADR-0005: plain ESO for cross-cluster secret movement; ADR-0010 PR-2
# Decision 3: DB host/port travel this path, NOT the cluster-facts contract).
#
# Flow: the XDatabase XR `keycloak-db` (keycloak-db.yaml, wave 34) provisions
# RDS; the provider writes the connection Secret `keycloak-db` in THIS (hub)
# keycloak namespace. This PushSecret mirrors its keys to the deterministic
# ASM key k8-platform/keycloak-db (committed manifests CANNOT reference the
# XPlatformSecret-style uid-named keys, so the push hop assigns a stable
# name). The spoke ExternalSecret (platform-services/keycloak/spoke/
# keycloak-db-externalsecret.yaml) pulls + remaps them.
#
# SOURCE KEY NAMES are the provider's connection-detail keys (username /
# password / host / port — observed live on the auto-012 provision; the
# spoke-side remap is pinned to the same names by
# tests/unit/test_keycloak_db_push_pull_contract.sh). The hub ESO IRSA role
# carries the scoped write Sid ESOPushSecretWrite (terraform/management/
# irsa.tf) for exactly the k8-platform/* path.
#
# Wave 35: after the XR (34). ESO retries until the source Secret exists, so
# first-sync ordering is convergence, not correctness. refreshInterval 5m
# bounds the push leg of host propagation after an RDS replacement.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: aws-secrets-manager
      kind: ClusterSecretStore
  # deletionPolicy None (default): the pushed ASM copy outlives the
  # PushSecret; the account rotation reaps it (irsa.tf grants no
  # DeleteSecret on purpose).
  selector:
    secret:
      name: keycloak-db
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: k8-platform/keycloak-db
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: k8-platform/keycloak-db
          property: password
    - match:
        secretKey: host
        remoteRef:
          remoteKey: k8-platform/keycloak-db
          property: host
    - match:
        secretKey: port
        remoteRef:
          remoteKey: k8-platform/keycloak-db
          property: port
