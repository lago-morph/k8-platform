# kubeconform-skip: XPlatformSecret CRD schema not in the offline store; these
# are the same v2 XR kind validated by tests/unit/test_platform_secret_xrd.sh.
#
# Keycloak secrets, provisioned via the platform's PlatformSecret abstraction
# (REQ-AUTH design: "all Keycloak client secrets use PlatformSecret claims").
#
# Each XPlatformSecret is a namespaced Crossplane v2 XR (apiextensions.crossplane.io/v2,
# scope: Namespaced — there is NO separate claim type; see CLAUDE/AGENTS §12.1).
# Applying it provisions (1) an AWS Secrets Manager secret as the storage/rotation
# backend and (2) an ExternalSecret in the keycloak namespace that ESO syncs into
# a native Kubernetes Secret the Keycloak chart consumes by name.
#
# NO secret VALUES live here (AGENTS §8.1). The XR only declares intent; the
# actual material is generated/stored in ASM out of band. The chart references
# the materialized K8s Secrets by name:
#   - keycloak-admin   → values.yaml auth.existingSecret (admin bootstrap pw)
#   - keycloak-oidc-clients → the per-client secrets (ArgoCD, Grafana confidential
#                              clients). The `kubernetes` kubectl client is PUBLIC
#                              + PKCE (REQ-AUTH-07) so it has NO secret.
#
# Sync ordering: wave "35" — after the keycloak namespace (wave 30 below in
# clusters overlay is N/A; namespace is CreateNamespace=true on the App) and
# before the Keycloak workload (Application wave 40) so the Secrets exist when
# the pods start.
apiVersion: platform.k8-platform.io/v1alpha1
kind: XPlatformSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  refreshInterval: 1h
  region: us-east-1
  description: "Keycloak admin bootstrap credentials (REQ-AUTH-01)"
---
apiVersion: platform.k8-platform.io/v1alpha1
kind: XPlatformSecret
metadata:
  name: keycloak-oidc-clients
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  refreshInterval: 1h
  region: us-east-1
  description: "Keycloak confidential OIDC client secrets (ArgoCD/Grafana SSO, REQ-AUTH-04/05)"
