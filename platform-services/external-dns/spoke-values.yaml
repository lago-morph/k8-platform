# ExternalDNS Helm values for the platform (spoke) cluster.
#
# Scoped to the spoke's subdomain so it CANNOT touch the hub's records in the
# shared account hosted zone (auto-008 §6 / S3 — dual-instance TXT-registry
# safety). The two instances are kept strictly disjoint:
#
#   | instance | domainFilters         | txtOwnerId            | txtPrefix          |
#   |----------|-----------------------|-----------------------|--------------------|
#   | hub      | management.<domain>   | k8-platform-mgmt      | (none)             |
#   | spoke    | platform.<domain>     | k8-platform-platform  | _edns-platform-.   |
#
# tests/unit/test_external_dns_disjoint_filters.sh asserts the filters are
# disjoint and the txtOwnerIds differ — it GATES this file against the hub's
# terraform/management/helm.tf config (auto-008 S3).
#
# Renamed values.yaml → spoke-values.yaml (ADR-0010): the external-dns
# ApplicationSet selects the per-cluster file by the short-name label
# (<short-name>-values.yaml), so the platform spoke's file carries its
# short-name prefix like workload1's does.
#
# DYNAMIC values (never committed): the `<domain>` root, the IRSA role ARN
# (eks.amazonaws.com/role-arn) and the region are account-ephemeral. The
# ApplicationSet (argocd/apps/spoke/external-dns.yaml) templates them into
# valuesObject from the spoke cluster Secret's cluster-facts annotations
# (ADR-0010) — domainFilters[0] := <subdomain>.<domain>, the SA role-arn from
# XSpokeAccess status, env AWS_REGION from the region fact. The placeholders
# below are render placeholders overridden at sync time.
provider:
  name: aws
policy: upsert-only
# Spoke-only subdomain. domainFilters[0] is templated to platform.<domain> by
# the ApplicationSet at sync time; this literal is a render placeholder, never
# a real domain in git.
domainFilters:
  - "platform.PLACEHOLDER_DOMAIN"
# Distinct owner id + prefix so the spoke's TXT registry never collides with the
# hub's (k8-platform-mgmt). Non-negotiable (auto-008 S3).
txtOwnerId: "k8-platform-platform"
txtPrefix: "_edns-platform-."
sources:
  - ingress
# The domainFilter (platform.<domain>) is a SUBDOMAIN of the account's only
# hosted zone (the base <domain> zone — there is no delegated platform.<domain>
# zone), so external-dns must be told to manage subdomain records inside the
# PARENT zone. Without this it matches zero zones and publishes nothing — same
# root cause as the hub instance (run 27071670054). Filters stay disjoint from
# the hub, so test_external_dns_disjoint_filters.sh is unaffected.
extraArgs:
  - "--aws-zone-match-parent"
serviceAccount:
  # Pin the SA NAME to `external-dns` (auto-012). The XSpokeAccess Composition's
  # IRSA trust policy hardcodes the subject
  # system:serviceaccount:external-dns:external-dns; without this the chart names
  # the SA after the release (`spoke-external-dns`), the sub claim mismatches, and
  # AssumeRoleWithWebIdentity is denied so external-dns publishes NO records.
  name: external-dns
  annotations:
    # Templated by the ApplicationSet (spoke external-dns IRSA role, ADR-0010):
    eks.amazonaws.com/role-arn: "PLACEHOLDER_OVERRIDDEN_BY_APPLICATION"
env:
  - name: AWS_REGION
    value: "PLACEHOLDER_REGION"
