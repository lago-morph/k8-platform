# ExternalDNS Helm values for the workload1 (spoke) cluster.
#
# Phase 6 (REQ-WL-03). A SEPARATE values file from the platform spoke's
# values.yaml because the txtOwnerId / domainFilters / txtPrefix MUST be disjoint
# from BOTH the hub AND the platform spoke — all three external-dns instances
# share the one account Route53 zone, so any overlap corrupts the TXT-ownership
# registry (auto-008 §6 / S3). The three instances are kept strictly disjoint:
#
#   | instance  | domainFilters         | txtOwnerId             | txtPrefix          |
#   |-----------|-----------------------|------------------------|--------------------|
#   | hub       | management.<domain>   | k8-platform-mgmt       | (none)             |
#   | platform  | platform.<domain>     | k8-platform-platform   | _edns-platform-.   |
#   | workload1 | workload1.<domain>    | k8-platform-workload1  | _edns-workload1-.  |
#
# tests/unit/test_workload1_apps.sh asserts this file's filter/owner/prefix are
# disjoint from both the hub (terraform/management/helm.tf) and the platform
# spoke (platform-services/external-dns/spoke-values.yaml).
#
# DYNAMIC values (never committed): the `<domain>` root, the IRSA role ARN
# (eks.amazonaws.com/role-arn) and the region are account-ephemeral. The
# shared external-dns ApplicationSet (argocd/apps/spoke/external-dns.yaml)
# selects this file by the workload1 Secret's short-name label and templates
# the ephemeral values into valuesObject from that Secret's cluster-facts
# annotations (ADR-0010). The placeholders below are render placeholders
# overridden at sync time.
provider:
  name: aws
policy: upsert-only
# Spoke-only subdomain. domainFilters[0] is overlaid with workload1.<domain> at
# sync time; this literal is a render placeholder, never a real domain in git.
domainFilters:
  - "workload1.PLACEHOLDER_DOMAIN"
# Distinct owner id + prefix so the workload1 TXT registry never collides with
# the hub (k8-platform-mgmt) or the platform spoke (k8-platform-platform).
# Non-negotiable (auto-008 S3).
txtOwnerId: "k8-platform-workload1"
txtPrefix: "_edns-workload1-."
sources:
  - ingress
# The domainFilter (workload1.<domain>) is a SUBDOMAIN of the account's only
# hosted zone, so external-dns must manage subdomain records inside the PARENT
# zone — same root cause as the hub instance (run 27071670054) and the same
# fix the platform spoke carries. This was MISSING here (latent drift caught
# by the ADR-0010 conversion review): without it workload1's external-dns
# matches zero zones and publishes nothing.
extraArgs:
  - "--aws-zone-match-parent"
serviceAccount:
  # Pin the SA NAME to `external-dns` (auto-012). The XSpokeAccess IRSA trust
  # policy hardcodes system:serviceaccount:external-dns:external-dns; without
  # the pin the chart names the SA after the release, the sub claim
  # mismatches, and AssumeRoleWithWebIdentity is denied. This was MISSING here
  # (same latent drift as above).
  name: external-dns
  annotations:
    # Templated by the ApplicationSet (workload1 external-dns IRSA role, ADR-0010):
    eks.amazonaws.com/role-arn: "PLACEHOLDER_OVERRIDDEN_BY_APPLICATION"
env:
  - name: AWS_REGION
    value: "PLACEHOLDER_REGION"
