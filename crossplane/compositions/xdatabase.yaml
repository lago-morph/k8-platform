# XDatabase → AWS RDS Composition (phase 5).
#
# The first (and currently only) backend implementation of the XDatabase
# abstraction (decisions/2026-06-06-phase4-alloy-phase5-db.md): provision
# a managed Postgres on AWS RDS via the Upbound provider-aws-rds, and
# surface a single Kubernetes connection Secret the consuming workload
# (Keycloak) reads via `externalDatabase.existingSecret`.
#
# Crossplane v2 Pipeline mode (function-patch-and-transform), matching the
# platform-secret / platform-cluster Composition shape:
#   - apiVersion: *.aws.m.upbound.io/v1beta1 (modern namespaced v2 CRDs)
#   - managementPolicies: [Observe, Create, Update, Delete] (full lifecycle)
#   - providerConfigRef.kind: ClusterProviderConfig (one shared IRSA config)
#
# Renders FOUR managed resources:
#   0a. rds SubnetGroup — base-VPC private subnets (from the cluster-network
#       EnvironmentConfig). Without it AWS places the instance in the
#       account DEFAULT VPC, unreachable from the platform clusters
#       (observed live 2026-06-11; the fix for OI-2026-06-07-5's
#       "RDS networking" note).
#   0b. ec2 SecurityGroup — dedicated <xr>-rds group in the base VPC.
#   0c. ec2 SecurityGroupRule — ingress 5432 from the VPC CIDR (classic
#       rule kind; v2.5.0 cannot observe SecurityGroupIngressRule).
#   1. rds.aws.m.upbound.io Instance — the Postgres instance, placed in the
#      subnet group + SG above. The instance
#      class is mapped from the abstract `size` (small → db.t4g.micro,
#      medium → db.t4g.small) per the AWS-account constraints in
#      ai/testing-guidelines §1 (micro/small only, single-AZ, ≤100GB). The
#      master password is auto-generated by the provider into the
#      passwordSecretRef Secret (no plaintext password in git, AGENTS §8.1).
#
# Connection wiring (how Keycloak consumes the database):
#   - The Instance writes its connection details — `username`, `password`,
#     `endpoint`, `port`, `attribute.*` — to the Secret named by
#     spec.writeConnectionSecretToRef. In v2 that Secret lands in the
#     Instance MR's namespace, which equals the XR's namespace (the XR is
#     namespaced). The XR carries spec.writeConnectionSecretToRef so the
#     aggregated connection Secret is published in the consumer namespace.
#   - status.secretRef.{name,namespace} echoes that Secret so the
#     consuming chart (or the registration overlay) can point
#     externalDatabase.existingSecret at it. The Keycloak chart's
#     existingSecretUserKey/PasswordKey are set to `username`/`password`
#     (the provider's connection-detail key names) — see the dependency
#     note returned to the lead agent.
#   - status.endpoint / status.port feed externalDatabase.host /
#     externalDatabase.port.
#
# No IRSA-specific role is created here — the shared ClusterProviderConfig
# `default` (the platform's single provider IRSA identity) reconciles the
# RDS Instance, exactly as it does the ASM Secret and EKS resources. RDS
# actions (rds:CreateDBInstance, rds:DeleteDBInstance, rds:Describe*,
# rds:AddTagsToResource, rds:ModifyDBInstance, secretsmanager:* for the
# managed master password path) must be present on that IRSA policy — see
# the dependency note (covered by the AdministratorAccess scope the CI
# account uses, ai/testing-guidelines §1).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xdatabase-rds
  labels:
    platform.k8-platform.io/abstraction: XDatabase
    platform.k8-platform.io/backend: aws
  annotations:
    # wave 0 lands AFTER the v2 XRD (wave -1) so the compositeTypeRef
    # binds against the established XRD.
    argocd.argoproj.io/sync-wave: "0"
spec:
  compositeTypeRef:
    apiVersion: platform.k8-platform.io/v1alpha1
    kind: XDatabase
  mode: Pipeline
  pipeline:
    # ---------- step 0: load account-ephemeral network values --------------
    # The cluster-network EnvironmentConfig (terraform/management/
    # crossplane-phase3.tf) supplies privateSubnetIds + vpcId + vpcCidr so
    # the database lands IN the base VPC. Without this the Instance sets no
    # subnet group and AWS places it in the account DEFAULT VPC (172.31/16),
    # unreachable from the platform clusters (10.0/16) — observed live on
    # the 2026-06-11 fresh-account build; the consuming workload could
    # never connect.
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: cluster-network
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:

          # ---------- 0a. DB subnet group (base-VPC private subnets) --
          - name: db-subnet-group
            base:
              apiVersion: rds.aws.m.upbound.io/v1beta1
              kind: SubnetGroup
              metadata:
                labels:
                  platform.k8-platform.io/role: rds-subnet-group
              spec:
                forProvider:
                  description: "k8-platform XDatabase subnet group (base-VPC private subnets)"
                  region: us-east-1
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: XDatabase
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              # Deterministic AWS name <xr>-rds; the Instance references it
              # by the same Format (no cross-ref needed — the Role/RolePolicy
              # linkage idiom).
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-rds"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              # Required: never create the group with an empty subnet list
              # (an unapplied/stale EnvironmentConfig holds this back loudly).
              - type: FromEnvironmentFieldPath
                fromFieldPath: privateSubnetIds
                toFieldPath: spec.forProvider.subnetIds
                policy:
                  fromFieldPath: Required
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 0b. dedicated RDS security group ----------------
          - name: db-security-group
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: SecurityGroup
              metadata:
                labels:
                  platform.k8-platform.io/role: rds-security-group
              spec:
                forProvider:
                  description: "k8-platform XDatabase: postgres from the base VPC"
                  region: us-east-1
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: XDatabase
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-rds"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              # Required: the SG must live in the base VPC, never the default
              # one (which is exactly the bug this resource fixes).
              - type: FromEnvironmentFieldPath
                fromFieldPath: vpcId
                toFieldPath: spec.forProvider.vpcId
                policy:
                  fromFieldPath: Required
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.securityGroupId
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.id

          # ---------- 0c. ingress 5432 from the base VPC --------------
          # Classic SecurityGroupRule — provider-aws-ec2 v2.5.0 cannot
          # observe SecurityGroupIngressRule (tf-aws#45303; same constraint
          # the kube-relay-ingress + hub-eks-api-ingress rules document).
          # CIDR-scoped to the VPC: every in-VPC consumer (spoke pods via
          # node ENIs, hub) reaches postgres; nothing outside the VPC does.
          - name: db-ingress-5432
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: SecurityGroupRule
              metadata:
                labels:
                  platform.k8-platform.io/role: rds-ingress-5432
              spec:
                forProvider:
                  type: ingress
                  fromPort: 5432
                  toPort: 5432
                  protocol: tcp
                  region: us-east-1
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              # Both Required: the rule waits for the SG id to travel the
              # composite and for the VPC CIDR to be in the environment.
              - type: FromCompositeFieldPath
                fromFieldPath: status.securityGroupId
                toFieldPath: spec.forProvider.securityGroupId
                policy:
                  fromFieldPath: Required
              - type: FromEnvironmentFieldPath
                fromFieldPath: vpcCidr
                toFieldPath: spec.forProvider.cidrBlocks[0]
                policy:
                  fromFieldPath: Required
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 1. RDS Postgres Instance -----------------------
          - name: rds-instance
            base:
              apiVersion: rds.aws.m.upbound.io/v1beta1
              kind: Instance
              metadata:
                labels:
                  platform.k8-platform.io/role: rds-instance
              spec:
                forProvider:
                  engine: postgres
                  # instanceClass is patched from spec.size via the
                  # map transform below; the base value is the `small`
                  # default so a size-less render still produces a valid
                  # micro instance.
                  instanceClass: db.t4g.micro
                  allocatedStorage: 20
                  # username is fixed; the password is auto-generated by
                  # the provider into the passwordSecretRef Secret.
                  username: keycloak
                  autoGeneratePassword: true
                  passwordSecretRef:
                    # name patched per-XR below. The ref resolves in the
                    # Instance MR's own namespace (= the XR namespace), so
                    # there is no namespace field (the v2 CRD's
                    # passwordSecretRef is {name, key} only). key is the
                    # field the generated password is written under.
                    name: ""
                    key: password
                  # Single-AZ, minimal footprint per the account
                  # constraints (ai/testing-guidelines §1). Not publicly
                  # accessible — reached in-VPC by the consuming workload.
                  publiclyAccessible: false
                  skipFinalSnapshot: true
                  # apply changes immediately so chainsaw/integration
                  # iterations don't wait for the maintenance window.
                  applyImmediately: true
                  region: us-east-1
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: XDatabase
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                # The provider writes the connection details (username,
                # password, endpoint, port, attribute.*) to this Secret in
                # the MR's namespace (= the XR namespace). Name patched to
                # the XR name below so the consuming chart can reference a
                # deterministic Secret.
                writeConnectionSecretToRef:
                  name: ""
            patches:
              # External name = XR name so the RDS DBInstanceIdentifier is
              # deterministic and stable across reconciles.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]

              # engine version passthrough (optional — only patched when set).
              - type: FromCompositeFieldPath
                fromFieldPath: spec.version
                toFieldPath: spec.forProvider.engineVersion
                policy:
                  fromFieldPath: Optional

              # size → instanceClass mapping (abstract → RDS units).
              - type: FromCompositeFieldPath
                fromFieldPath: spec.size
                toFieldPath: spec.forProvider.instanceClass
                transforms:
                  - type: map
                    map:
                      small: db.t4g.micro
                      medium: db.t4g.small

              # storageGB → allocatedStorage.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.storageGB
                toFieldPath: spec.forProvider.allocatedStorage

              # databaseName → dbName (the initial DB created in the instance).
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.dbName

              # region passthrough.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region

              # In-VPC placement (the default-VPC bug fix): subnet group by
              # its deterministic name (db-subnet-group's external-name
              # Format) + the dedicated SG via the composite. Both Required —
              # the Instance must never be created in the default VPC, so
              # creation waits for the SG id to land on the composite.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.dbSubnetGroupName
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-rds"
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: status.securityGroupId
                toFieldPath: spec.forProvider.vpcSecurityGroupIds[0]
                policy:
                  fromFieldPath: Required

              # Generated-password Secret name = <XR name>-master, resolved
              # in the XR namespace (the ref carries no namespace field —
              # it is local to the Instance MR's namespace). This Secret
              # holds the provider-generated master password; it is distinct
              # from the connection Secret.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.passwordSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-master"

              # Connection Secret name = XR name. The provider writes
              # username/password/endpoint/port here; this is the Secret the
              # consuming chart points externalDatabase.existingSecret at.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.writeConnectionSecretToRef.name

              # Surface endpoint/port to XR status.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.address
                toFieldPath: status.endpoint
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.port
                toFieldPath: status.port

              # Publish the connection Secret reference to XR status so
              # consumers can discover it. These are ToCompositeFieldPath
              # (write to the XR, not the composed Instance): the Secret
              # name equals the MR's writeConnectionSecretToRef.name (= XR
              # name) and the namespace equals the MR's metadata.namespace
              # (= XR namespace). A FromCompositeFieldPath would instead
              # write to the composed Instance's status, never reaching the
              # XR — verified via `crossplane render`.
              - type: ToCompositeFieldPath
                fromFieldPath: spec.writeConnectionSecretToRef.name
                toFieldPath: status.secretRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: status.secretRef.namespace

            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"
