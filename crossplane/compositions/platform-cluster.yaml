# PlatformCluster → EKS cluster Composition.
#
# Crossplane v2 Pipeline mode (function-patch-and-transform), matching
# the PlatformSecret Composition shape.
#
# Renders per claim:
#   1. IAM role for the EKS control plane (with AssumeRolePolicy
#      trusting eks.amazonaws.com).
#   2. Attachment of AmazonEKSClusterPolicy to (1).
#   3. IAM role for the managed node group (with AssumeRolePolicy
#      trusting ec2.amazonaws.com).
#   4-6. Attachments of AmazonEKSWorkerNodePolicy, AmazonEKS_CNI_Policy,
#        AmazonEC2ContainerRegistryReadOnly to (3).
#   7. The EKS Cluster.
#   8. The EKS managed Node Group.
#
# IAM role names are suffixed with the cluster's claim-derived
# spec.name to avoid collisions between two PlatformClusters in the
# same account.
#
# The cluster + node group reference the IAM roles by ARN. Crossplane's
# patches resolve the cross-resource refs via FromCompositeFieldPath
# from a shared XR field — we don't use ToCompositeFieldPath→
# FromCompositeFieldPath round-tripping (which is slower) because the
# role name is derived deterministically from spec.name.
#
# Why these specific policies:
#   - AmazonEKSClusterPolicy: required by EKS for the control plane
#     to manage AWS resources on the user's behalf.
#   - AmazonEKSWorkerNodePolicy: lets the kubelet describe instances
#     and register with the cluster.
#   - AmazonEKS_CNI_Policy: lets the AWS VPC CNI plugin manage ENIs.
#   - AmazonEC2ContainerRegistryReadOnly: pulls from ECR without
#     per-image IRSA wiring.
#
# These are the four minimum policies AWS documents for an EKS node
# group. Anything beyond (e.g. autoscaler, EBS CSI) is workload-specific
# and gets added via IRSA in Iteration 3+, not bolted onto the node
# IAM role.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: platform-cluster-aws
  labels:
    platform.k8-platform.io/abstraction: PlatformCluster
    platform.k8-platform.io/backend: aws
spec:
  compositeTypeRef:
    apiVersion: platform.k8-platform.io/v1alpha1
    kind: XPlatformCluster
  writeConnectionSecretsToNamespace: crossplane-system
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:

          # ---------- 1. Control-plane IAM role ---------------------
          - name: cluster-role
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: Role
              metadata:
                labels:
                  platform.k8-platform.io/role: cluster-role
              spec:
                forProvider:
                  assumeRolePolicy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [{
                        "Effect": "Allow",
                        "Principal": {"Service": "eks.amazonaws.com"},
                        "Action": "sts:AssumeRole"
                      }]
                    }
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                deletionPolicy: Delete
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-cluster-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.tags.ClusterName
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 2. Cluster policy attachment -------------------
          - name: cluster-role-policy
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
                deletionPolicy: Delete
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-cluster-%s"

          # ---------- 3. Node-group IAM role -------------------------
          - name: node-role
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: Role
              metadata:
                labels:
                  platform.k8-platform.io/role: node-role
              spec:
                forProvider:
                  assumeRolePolicy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [{
                        "Effect": "Allow",
                        "Principal": {"Service": "ec2.amazonaws.com"},
                        "Action": "sts:AssumeRole"
                      }]
                    }
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                deletionPolicy: Delete
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-nodegroup-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.tags.ClusterName
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 4. Worker policy attachment --------------------
          - name: node-worker-policy
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
                deletionPolicy: Delete
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-nodegroup-%s"

          # ---------- 5. CNI policy attachment -----------------------
          - name: node-cni-policy
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
                deletionPolicy: Delete
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-nodegroup-%s"

          # ---------- 6. ECR read-only attachment --------------------
          - name: node-ecr-policy
            base:
              apiVersion: iam.aws.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
                deletionPolicy: Delete
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-nodegroup-%s"

          # ---------- 7. EKS Cluster ---------------------------------
          - name: eks-cluster
            base:
              apiVersion: eks.aws.upbound.io/v1beta1
              kind: Cluster
              metadata:
                labels:
                  platform.k8-platform.io/role: eks-cluster
              spec:
                forProvider:
                  region: us-east-1
                  version: "1.32"
                  # roleArnSelector resolves the control-plane role by
                  # matching the labels we set via patches below.
                  roleArnSelector:
                    matchControllerRef: true
                    matchLabels:
                      platform.k8-platform.io/role: cluster-role
                  vpcConfig:
                    - endpointPrivateAccess: true
                      endpointPublicAccess: true
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                deletionPolicy: Delete
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.version
                toFieldPath: spec.forProvider.version
              - type: FromCompositeFieldPath
                fromFieldPath: spec.vpc.subnetIds
                toFieldPath: spec.forProvider.vpcConfig[0].subnetIds
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.tags.ClusterName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.clusterArn
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.endpoint
                toFieldPath: status.endpoint
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.identity[0].oidc[0].issuer
                toFieldPath: status.oidcIssuer
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 8. EKS Managed Node Group ----------------------
          - name: eks-nodegroup
            base:
              apiVersion: eks.aws.upbound.io/v1beta1
              kind: NodeGroup
              spec:
                forProvider:
                  region: us-east-1
                  clusterNameSelector:
                    matchControllerRef: true
                    matchLabels:
                      platform.k8-platform.io/role: eks-cluster
                  nodeRoleArnSelector:
                    matchControllerRef: true
                    matchLabels:
                      platform.k8-platform.io/role: node-role
                  scalingConfig:
                    - desiredSize: 2
                      minSize: 1
                      maxSize: 3
                  instanceTypes:
                    - t3.medium
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                deletionPolicy: Delete
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-default"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.vpc.subnetIds
                toFieldPath: spec.forProvider.subnetIds
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodeGroup.instanceTypes
                toFieldPath: spec.forProvider.instanceTypes
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodeGroup.desiredSize
                toFieldPath: spec.forProvider.scalingConfig[0].desiredSize
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodeGroup.minSize
                toFieldPath: spec.forProvider.scalingConfig[0].minSize
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodeGroup.maxSize
                toFieldPath: spec.forProvider.scalingConfig[0].maxSize
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.tags.ClusterName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.nodeGroupArn
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"
