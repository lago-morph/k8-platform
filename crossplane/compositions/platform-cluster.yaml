# PlatformCluster → EKS cluster Composition.
#
# Crossplane v2 Pipeline mode (function-patch-and-transform), matching
# the PlatformSecret Composition shape.
#
# Renders per claim:
#   1. IAM role for the EKS control plane (with AssumeRolePolicy
#      trusting eks.amazonaws.com).
#   2. Attachment of AmazonEKSClusterPolicy to (1).
#   3. IAM role for the managed node group (with AssumeRolePolicy
#      trusting ec2.amazonaws.com).
#   4-6. Attachments of AmazonEKSWorkerNodePolicy, AmazonEKS_CNI_Policy,
#        AmazonEC2ContainerRegistryReadOnly to (3).
#   7. The EKS Cluster.
#   8. The EKS managed Node Group.
#
# IAM role names are suffixed with the cluster's claim-derived
# spec.name to avoid collisions between two PlatformClusters in the
# same account.
#
# The cluster + node group reference the IAM roles by ARN. Crossplane's
# patches resolve the cross-resource refs via FromCompositeFieldPath
# from a shared XR field — we don't use ToCompositeFieldPath→
# FromCompositeFieldPath round-tripping (which is slower) because the
# role name is derived deterministically from spec.name.
#
# Why these specific policies:
#   - AmazonEKSClusterPolicy: required by EKS for the control plane
#     to manage AWS resources on the user's behalf.
#   - AmazonEKSWorkerNodePolicy: lets the kubelet describe instances
#     and register with the cluster.
#   - AmazonEKS_CNI_Policy: lets the AWS VPC CNI plugin manage ENIs.
#   - AmazonEC2ContainerRegistryReadOnly: pulls from ECR without
#     per-image IRSA wiring.
#
# These are the four minimum policies AWS documents for an EKS node
# group. Anything beyond (e.g. autoscaler, EBS CSI) is workload-specific
# and gets added via IRSA in Iteration 3+, not bolted onto the node
# IAM role.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: platform-cluster-aws
  labels:
    platform.k8-platform.io/abstraction: PlatformCluster
    platform.k8-platform.io/backend: aws
  annotations:
    # v2 migration (SEG-1 step 1c) — wave 0 lands AFTER the v2 XRDs
    # (wave -1) so the compositeTypeRef binds against the v2 XRD.
    argocd.argoproj.io/sync-wave: "0"
spec:
  compositeTypeRef:
    apiVersion: platform.k8-platform.io/v1alpha1
    kind: XPlatformCluster
  # v2 migration (SEG-1 step 1c) — `writeConnectionSecretsToNamespace`
  # is removed in v2. End-to-end routing for the EKS kubeconfig:
  #   1. eks-cluster MR (below) emits `kubeconfig` in its provider
  #      connection-secret.
  #   2. This Composition's `connectionDetails` block (preserved
  #      unchanged at the bottom of each step's resources) re-exports
  #      those keys to the XR's own connection-detail set.
  #   3. The XPlatformCluster XR (clusters/platform/platform-cluster-
  #      claim.yaml) carries `spec.writeConnectionSecretToRef.name:
  #      platform-cluster-kubeconfig`, which writes the merged secret
  #      to the XR's namespace (`platform`) — NOT crossplane-system.
  #   4. Phase 3 consumers must read platform/platform-cluster-
  #      kubeconfig (was crossplane-system/...); see plan §3 Open Q #7.
  mode: Pipeline
  pipeline:
    # ---------- step 0: load account-ephemeral network/DNS values --------
    # function-environment-configs merges the `cluster-network`
    # EnvironmentConfig's data into the pipeline environment. That config
    # is materialized by terraform/management from the base Terraform
    # output (private_subnet_ids, route53_zone_id, domain) — see
    # ADR-e557a40123 / docs/decisions/0003. The patch-and-transform step
    # below reads those values via FromEnvironmentFieldPath, so the XR in
    # git carries no account-ephemeral identifiers (AGENTS §8.1).
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: cluster-network
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        # Top-level environment patches run BEFORE resource patches, so the
        # per-cluster subdomain (XR spec) lands in the pipeline environment
        # — which already carries `domain` from the cluster-network
        # EnvironmentConfig — in time for the ACM Certificate resource's
        # CombineFromEnvironment [subdomain, domain] → wildcard domainName.
        # (Per-resource ToEnvironment writes are NOT visible to a combine in
        # the same pass; top-level environment patches are.)
        environment:
          patches:
            - type: FromCompositeFieldPath
              fromFieldPath: spec.dns.subdomain
              toFieldPath: subdomain
        resources:

          # ---------- 1. Control-plane IAM role ---------------------
          # v2 migration (SEG-1 step 1c) applied uniformly to every MR
          # base in this Composition (8 total):
          #   - apiVersion: *.aws.upbound.io/v1beta1
          #       → *.aws.m.upbound.io/v1beta1 (Upbound v2.x "modern" CRDs)
          #   - deletionPolicy: Delete → removed; replaced by
          #     managementPolicies: [Observe, Create, Update, Delete]
          #     which preserves prior full-lifecycle semantics.
          #   - providerConfigRef now carries `kind: ClusterProviderConfig`
          #     (cluster-scoped variant; single shared IRSA config).
          - name: cluster-role
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                labels:
                  platform.k8-platform.io/role: cluster-role
              spec:
                forProvider:
                  assumeRolePolicy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [{
                        "Effect": "Allow",
                        "Principal": {"Service": "eks.amazonaws.com"},
                        "Action": "sts:AssumeRole"
                      }]
                    }
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-cluster-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.tags.ClusterName
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 2. Cluster policy attachment -------------------
          - name: cluster-role-policy
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-cluster-%s"

          # ---------- 3. Node-group IAM role -------------------------
          - name: node-role
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                labels:
                  platform.k8-platform.io/role: node-role
              spec:
                forProvider:
                  assumeRolePolicy: |
                    {
                      "Version": "2012-10-17",
                      "Statement": [{
                        "Effect": "Allow",
                        "Principal": {"Service": "ec2.amazonaws.com"},
                        "Action": "sts:AssumeRole"
                      }]
                    }
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-nodegroup-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.tags.ClusterName
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 4. Worker policy attachment --------------------
          - name: node-worker-policy
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-nodegroup-%s"

          # ---------- 5. CNI policy attachment -----------------------
          - name: node-cni-policy
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-nodegroup-%s"

          # ---------- 6. ECR read-only attachment --------------------
          - name: node-ecr-policy
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicyAttachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-nodegroup-%s"

          # ---------- 7. EKS Cluster ---------------------------------
          # v2 migration (SEG-1 step 1c) plan deviation noted in
          # commit-message: the v2 .m.upbound.io Cluster CRD changed
          # `spec.forProvider.vpcConfig` from an array (Crossplane v1
          # Upbound provider style) to a single object (v2 modern style).
          # Patches that targeted `vpcConfig[0].subnetIds` are rewritten
          # to `vpcConfig.subnetIds` to match the v2 schema. Verified
          # against kubeconform-schemas/eks.aws.m.upbound.io/cluster_
          # v1beta1.json.
          - name: eks-cluster
            base:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: Cluster
              metadata:
                labels:
                  platform.k8-platform.io/role: eks-cluster
              spec:
                forProvider:
                  region: us-east-1
                  version: "1.32"
                  # EKS access entries are the spoke-registration trust
                  # mechanism (XSpokeAccess AccessEntry/AccessPolicyAssociation
                  # + the ArgoCD cluster Secret's exec-auth argocd role). The
                  # EKS API rejects AccessEntry create/list unless the cluster's
                  # authenticationMode is API or API_AND_CONFIG_MAP — the EKS
                  # default is CONFIG_MAP, which silently blocks the entire
                  # hub->spoke GitOps path (auto-012). Set API_AND_CONFIG_MAP
                  # (a non-destructive superset of the default; the upgrade from
                  # CONFIG_MAP is a one-way but in-place EKS operation).
                  accessConfig:
                    authenticationMode: API_AND_CONFIG_MAP
                  # roleArnSelector resolves the control-plane role by
                  # matching the labels we set via patches below.
                  roleArnSelector:
                    matchControllerRef: true
                    matchLabels:
                      platform.k8-platform.io/role: cluster-role
                  vpcConfig:
                    endpointPrivateAccess: true
                    endpointPublicAccess: true
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.version
                toFieldPath: spec.forProvider.version
              # v2 deviation: vpcConfig is now an object (not array);
              # subnetIds lives directly under vpcConfig.
              # Subnets come from the `cluster-network` EnvironmentConfig
              # (base Terraform output), not the XR — see ADR-e557a40123.
              - type: FromEnvironmentFieldPath
                fromFieldPath: privateSubnetIds
                toFieldPath: spec.forProvider.vpcConfig.subnetIds
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.tags.ClusterName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.clusterArn
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.endpoint
                toFieldPath: status.endpoint
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.identity[0].oidc[0].issuer
                toFieldPath: status.oidcIssuer
              # Route the EKS-managed cluster security group id through the XR
              # so the kube-relay Instance (resource 15) can join it for private
              # API reach — see docs/decisions/0006.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.vpcConfig.clusterSecurityGroupId
                toFieldPath: status.clusterSecurityGroupId
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 8. EKS Managed Node Group ----------------------
          # v2 migration (SEG-1 step 1c) plan deviation noted in
          # commit-message: the v2 .m.upbound.io NodeGroup CRD changed
          # `spec.forProvider.scalingConfig` from an array to a single
          # object. Patches that targeted `scalingConfig[0].*` are
          # rewritten to `scalingConfig.*` to match the v2 schema.
          # Verified against kubeconform-schemas/eks.aws.m.upbound.io/
          # nodegroup_v1beta1.json.
          - name: eks-nodegroup
            base:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: NodeGroup
              spec:
                forProvider:
                  region: us-east-1
                  clusterNameSelector:
                    matchControllerRef: true
                    matchLabels:
                      platform.k8-platform.io/role: eks-cluster
                  nodeRoleArnSelector:
                    matchControllerRef: true
                    matchLabels:
                      platform.k8-platform.io/role: node-role
                  scalingConfig:
                    desiredSize: 2
                    minSize: 1
                    maxSize: 3
                  instanceTypes:
                    - t3.medium
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-default"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromEnvironmentFieldPath
                fromFieldPath: privateSubnetIds
                toFieldPath: spec.forProvider.subnetIds
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodeGroup.instanceTypes
                toFieldPath: spec.forProvider.instanceTypes
              # v2 deviation: scalingConfig is an object (not array).
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodeGroup.desiredSize
                toFieldPath: spec.forProvider.scalingConfig.desiredSize
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodeGroup.minSize
                toFieldPath: spec.forProvider.scalingConfig.minSize
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodeGroup.maxSize
                toFieldPath: spec.forProvider.scalingConfig.maxSize
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.tags.ClusterName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.nodeGroupArn
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 9. Wildcard ACM certificate --------------------
          # Every cluster gets its own `*.<subdomain>.<domain>` cert,
          # DNS-validated via Route53. The issued ARN is published on the
          # XR status and bound to the cluster's ingress-nginx NLB — no
          # cert-manager / ACME (docs/decisions/0003). domainName is built
          # by CombineFromEnvironment from `subdomain` (copied into the
          # environment by the cluster-role resource above) and `domain`
          # (from the cluster-network EnvironmentConfig).
          - name: cluster-certificate
            base:
              apiVersion: acm.aws.m.upbound.io/v1beta1
              kind: Certificate
              metadata:
                labels:
                  platform.k8-platform.io/role: cluster-certificate
              spec:
                forProvider:
                  region: us-east-1
                  validationMethod: DNS
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              # Build the wildcard domain `*.<subdomain>.<domain>` from the
              # environment. `subdomain` is placed in the environment by the
              # top-level environment.patches (above, runs first); `domain`
              # comes from the cluster-network EnvironmentConfig. Both are
              # now env-native, so CombineFromEnvironment resolves them.
              - type: CombineFromEnvironment
                combine:
                  variables:
                    - fromFieldPath: subdomain
                    - fromFieldPath: domain
                  strategy: string
                  string:
                    fmt: "*.%s.%s"
                toFieldPath: spec.forProvider.domainName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.tags.ClusterName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.certificateArn
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.domainName
                toFieldPath: status.certificateDomain
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.domainValidationOptions[0].resourceRecordName
                toFieldPath: status.certValidationRecordName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.domainValidationOptions[0].resourceRecordValue
                toFieldPath: status.certValidationRecordValue
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.domainValidationOptions[0].resourceRecordType
                toFieldPath: status.certValidationRecordType
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 10. Route53 DNS-validation record --------------
          # route53 Record is a GLOBAL resource — its CRD has no `region`
          # field, so none is set here. zoneId comes from the
          # cluster-network EnvironmentConfig (base route53_zone_id); the
          # name/type/value are the CNAME the ACM cert emitted above,
          # routed through the XR status (P&T cross-resource refs travel
          # via the composite).
          - name: cluster-cert-validation-record
            base:
              apiVersion: route53.aws.m.upbound.io/v1beta1
              kind: Record
              metadata:
                labels:
                  platform.k8-platform.io/role: cluster-cert-validation-record
              spec:
                forProvider:
                  ttl: 300
                  allowOverwrite: true
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromEnvironmentFieldPath
                fromFieldPath: route53ZoneId
                toFieldPath: spec.forProvider.zoneId
              - type: FromCompositeFieldPath
                fromFieldPath: status.certValidationRecordName
                toFieldPath: spec.forProvider.name
              - type: FromCompositeFieldPath
                fromFieldPath: status.certValidationRecordType
                toFieldPath: spec.forProvider.type
              - type: FromCompositeFieldPath
                fromFieldPath: status.certValidationRecordValue
                toFieldPath: spec.forProvider.records[0]
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.fqdn
                toFieldPath: status.certValidationRecordFqdn
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.fqdn

          # ---------- 11. ACM certificate validation -----------------
          # Gates on the cert reaching ISSUED. certificateArnSelector
          # resolves to the Certificate MR (9) by controller-ref + label;
          # validationRecordFqdns is the FQDN of the record (10). When this
          # MR is Ready the cert is confirmed issued — this is the
          # "confirm the cert" step, done as part of provisioning.
          - name: cluster-cert-validation
            base:
              apiVersion: acm.aws.m.upbound.io/v1beta1
              kind: CertificateValidation
              metadata:
                labels:
                  platform.k8-platform.io/role: cluster-cert-validation
              spec:
                forProvider:
                  region: us-east-1
                  certificateArnSelector:
                    matchControllerRef: true
                    matchLabels:
                      platform.k8-platform.io/role: cluster-certificate
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: status.certValidationRecordFqdn
                toFieldPath: spec.forProvider.validationRecordFqdns[0]
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ============================================================
          # SANDBOX KUBECTL ACCESS (docs/decisions/0006).
          # Lets `kubectl` work directly from the Anthropic sandbox via an SSM
          # port-forward tunnel (the gateway accepts the public ssmmessages cert;
          # kubectl verifies the REAL cluster CA end-to-end). NO public listener
          # is added.
          #
          # The account is capped at 9 EC2 instances, so there is NO per-cluster
          # relay. ONE shared relay (terraform/management/kube-access.tf) lives in
          # the base VPC that every cluster shares; this Composition only:
          #   12. admits that relay's SG to THIS cluster's private API on 443, and
          #   13/14. grants the sandbox identity a read-only EKS access entry.
          # ============================================================

          # ---------- 12. admit the shared relay to the API ---------
          # Ingress 443 on this cluster's EKS-managed SG (routed via the XR
          # status from the eks-cluster MR) from the shared relay SG (from the
          # cluster-network EnvironmentConfig relaySecurityGroupId). This is what
          # lets the one relay tunnel kubectl to THIS cluster's private endpoint.
          - name: kube-relay-ingress
            base:
              apiVersion: ec2.aws.m.upbound.io/v1beta1
              kind: SecurityGroupIngressRule
              metadata:
                labels:
                  platform.k8-platform.io/role: kube-relay-ingress
              spec:
                forProvider:
                  region: us-east-1
                  ipProtocol: tcp
                  fromPort: 443
                  toPort: 443
                  description: "SSM kube-API relay -> cluster API server"
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: status.clusterSecurityGroupId
                toFieldPath: spec.forProvider.securityGroupId
              - type: FromEnvironmentFieldPath
                fromFieldPath: relaySecurityGroupId
                toFieldPath: spec.forProvider.referencedSecurityGroupId
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.id

          # ---------- 13. sandbox EKS access entry ------------------
          # Read-only access entry for the sandbox IAM identity (cloud_user).
          # principalArn is built from the EnvironmentConfig accountId — no
          # account-ephemeral literal in git (AGENTS §8.1).
          - name: sandbox-access-entry
            base:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: AccessEntry
              metadata:
                labels:
                  platform.k8-platform.io/role: sandbox-access-entry
              spec:
                forProvider:
                  region: us-east-1
                  type: STANDARD
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformCluster
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.clusterName
              - type: CombineFromEnvironment
                combine:
                  variables:
                    - fromFieldPath: accountId
                  strategy: string
                  string:
                    fmt: "arn:aws:iam::%s:user/cloud_user"
                toFieldPath: spec.forProvider.principalArn
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.accessEntryArn
                toFieldPath: status.sandboxAccessEntryArn
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 14. sandbox access policy association ---------
          # AmazonEKSAdminViewPolicy = read-only on ALL resources (incl. CRDs:
          # Crossplane XRs, ArgoCD Applications) — useful for diagnostics,
          # never mutating. accessScope.type: cluster.
          - name: sandbox-access-policy
            base:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: AccessPolicyAssociation
              metadata:
                labels:
                  platform.k8-platform.io/role: sandbox-access-policy
              spec:
                forProvider:
                  region: us-east-1
                  policyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSAdminViewPolicy
                  accessScope:
                    type: cluster
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.clusterName
              - type: CombineFromEnvironment
                combine:
                  variables:
                    - fromFieldPath: accountId
                  strategy: string
                  string:
                    fmt: "arn:aws:iam::%s:user/cloud_user"
                toFieldPath: spec.forProvider.principalArn
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"
