# PlatformSecret → (ASM secret + ExternalSecret) Composition.
#
# Crossplane v2 Pipeline mode (function-patch-and-transform).
#
# Renders two resources per claim:
#
#   1. An Upbound provider-family-aws `Secret` — the ASM secret itself.
#      Named `k8-platform/<XR-uid>` so two claims with the same name in
#      different namespaces don't collide on the ASM key. The UID is
#      stable across the XR's lifetime.
#
#      recoveryWindowInDays=0 is intentional — chainsaw and integration
#      tests routinely create/delete the same name; the 7-day recovery
#      window would block re-creates.
#
#   2. An ESO ExternalSecret in the claim's namespace, pulling every
#      key out of that ASM secret via the shared ClusterSecretStore.
#
# Crossplane v2 removed `spec.resources` from the v1 Composition schema
# (strict decoding rejects unknown fields, observed in chainsaw run
# 26344055485). The v2 path is `spec.mode: Pipeline` + a `pipeline` step
# using `function-patch-and-transform`, which accepts the legacy
# resources/patches input shape unchanged. The function package is
# installed alongside provider-family-aws (see
# terraform/management/helm.tf and tests/chainsaw/run.sh).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: platform-secret-aws
  labels:
    platform.k8-platform.io/abstraction: PlatformSecret
    platform.k8-platform.io/backend: aws
  annotations:
    # v2 migration (SEG-1 step 1c) — wave 0 lands AFTER the v2 XRDs
    # (wave -1) so the compositeTypeRef binds against the v2 XRD.
    argocd.argoproj.io/sync-wave: "0"
spec:
  compositeTypeRef:
    apiVersion: platform.k8-platform.io/v1alpha1
    kind: XPlatformSecret
  # v2 migration (SEG-1 step 1c) — `writeConnectionSecretsToNamespace`
  # is removed in v2; connection secrets are now written to the XR's
  # own namespace via the XR's spec.writeConnectionSecretToRef. For
  # PlatformSecret there is no XR-level connection secret to publish
  # (the ExternalSecret materializes the K8s Secret directly in the
  # claim/XR namespace), so no replacement field is needed here.
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:

          # ---------- 1. ASM secret (Upbound provider-family-aws) -----
          # v2 migration (SEG-1 step 1c):
          #   - apiVersion: secretsmanager.aws.upbound.io/v1beta1
          #       → secretsmanager.aws.m.upbound.io/v1beta1 (.m. infix
          #     marks the v2 "modern" CRD group shipped by Upbound v2.x)
          #   - deletionPolicy: Delete removed; replaced by
          #     managementPolicies: [Observe, Create, Update, Delete]
          #     which preserves the same full-lifecycle semantics under
          #     the v2 management-policies model.
          #   - providerConfigRef gains `kind: ClusterProviderConfig`
          #     (cluster-scoped variant; pre-committed by lead agent —
          #     one shared IRSA config for the platform).
          - name: asm-secret
            base:
              apiVersion: secretsmanager.aws.m.upbound.io/v1beta1
              kind: Secret
              spec:
                forProvider:
                  # name overwritten per claim from XR UID (see patches below)
                  recoveryWindowInDays: 0
                  region: us-east-1
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformSecret
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              # ASM secret name = k8-platform/<XR-uid>. UID over name
              # avoids cross-namespace collisions when two claims share
              # metadata.name.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform/%s"

              # Region passthrough.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region

              # Description → AWS tag.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.description
                toFieldPath: spec.forProvider.tags.Description
                policy:
                  fromFieldPath: Optional

              # Publish the resulting ARN back to XR status.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.asmSecretArn

            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 2. ExternalSecret in claim's namespace ----------
          - name: external-secret
            base:
              apiVersion: external-secrets.io/v1beta1
              kind: ExternalSecret
              spec:
                refreshInterval: 1h
                secretStoreRef:
                  kind: ClusterSecretStore
                  # MUST match clusters/management/eso/cluster-secret-
                  # store.yaml metadata.name. Cross-file invariant enforced
                  # by tests/unit/test_platform_secret_composition.sh.
                  name: aws-secrets-manager
                target:
                  creationPolicy: Owner
                  deletionPolicy: Delete
                dataFrom:
                  - extract:
                      # ASM secret name (patched per claim from XR UID)
                      key: ""
            patches:
              # v2 migration (SEG-1 step 1c) — spec.claimRef.{name,namespace}
              # patches rewritten to metadata.{name,namespace}. In v1 the
              # XR was cluster-scoped so it had no namespace of its own,
              # and the consumer's namespace came in via claimRef. In v2
              # the XR IS namespaced — its metadata.namespace is the
              # consumer's namespace by construction. claimRef no longer
              # exists.
              #
              # ExternalSecret name = XR name (was claim name).
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name

              # ExternalSecret namespace = XR namespace. In v2 the XR
              # lives in the user's namespace directly, so this lands
              # the ExternalSecret alongside the XR.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace

              # Target K8s Secret name = XR name (1:1).
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.target.name

              # dataFrom.extract.key = the same ASM key the asm-secret
              # resource provisions.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.dataFrom[0].extract.key
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform/%s"

              # refreshInterval passthrough from XR spec.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.refreshInterval
                toFieldPath: spec.refreshInterval

              # Publish ExternalSecret reference back to XR status.
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.externalSecretRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: status.externalSecretRef.namespace

            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"
