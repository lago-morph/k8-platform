# PlatformSecret → (ASM secret + ExternalSecret) Composition.
#
# Renders two resources per claim:
#
#   1. An Upbound provider-family-aws `Secret` — the ASM secret itself.
#      Named `k8-platform/<XR-uid>` so two claims with the same name in
#      different namespaces don't collide on the ASM key. The UID is
#      stable across the XR's lifetime.
#
#      recoveryWindowInDays=0 is intentional — chainsaw and integration
#      tests routinely create/delete the same name; the 7-day recovery
#      window would block re-creates. Production secrets that need
#      recovery can be created out-of-band; this Composition optimises
#      for the abstraction's primary user (CI/dev/learning) rather than
#      irreversible-delete safety.
#
#   2. An ESO ExternalSecret in the claim's namespace, pulling every
#      key out of that ASM secret via the shared ClusterSecretStore.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: platform-secret-aws
  labels:
    platform.k8-platform.io/abstraction: PlatformSecret
    platform.k8-platform.io/backend: aws
spec:
  compositeTypeRef:
    apiVersion: platform.k8-platform.io/v1alpha1
    kind: XPlatformSecret
  writeConnectionSecretsToNamespace: crossplane-system
  # Opt into legacy resources mode under Crossplane v2. Without this,
  # v2's strict decoder rejects `spec.resources` with "unknown field"
  # (observed in chainsaw run 26343960114). Pipeline mode is the v2
  # default; we'll migrate to it as a separate follow-up so this PR
  # stays scoped to the install bug.
  mode: Resources
  resources:

    # ---------- 1. ASM secret (Upbound provider-family-aws) -----------
    - name: asm-secret
      base:
        apiVersion: secretsmanager.aws.upbound.io/v1beta1
        kind: Secret
        spec:
          forProvider:
            # name overwritten per claim from XR UID (see patches below)
            recoveryWindowInDays: 0
            forceOverwriteReplica: true
            region: us-east-1
            tags:
              ManagedBy: crossplane
              PlatformAbstraction: PlatformSecret
          deletionPolicy: Delete
          providerConfigRef:
            name: default
      patches:
        # ASM secret name = k8-platform/<XR-uid>. UID over name avoids
        # cross-namespace collisions when two claims share metadata.name.
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.uid
          toFieldPath: spec.forProvider.name
          transforms:
            - type: string
              string:
                fmt: "k8-platform/%s"

        # Region passthrough.
        - type: FromCompositeFieldPath
          fromFieldPath: spec.region
          toFieldPath: spec.forProvider.region

        # Description → AWS tag.
        - type: FromCompositeFieldPath
          fromFieldPath: spec.description
          toFieldPath: spec.forProvider.tags.Description
          policy:
            fromFieldPath: Optional

        # Publish the resulting ARN back to XR status.
        - type: ToCompositeFieldPath
          fromFieldPath: status.atProvider.arn
          toFieldPath: status.asmSecretArn

      readinessChecks:
        - type: NonEmpty
          fieldPath: status.atProvider.arn

    # ---------- 2. ExternalSecret in claim's namespace ----------------
    - name: external-secret
      base:
        apiVersion: external-secrets.io/v1beta1
        kind: ExternalSecret
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            # MUST match clusters/management/eso/cluster-secret-store.yaml
            # metadata.name. Cross-file invariant enforced by
            # tests/unit/test_platform_secret_composition.sh.
            name: aws-secrets-manager
          target:
            creationPolicy: Owner
            deletionPolicy: Delete
          dataFrom:
            - extract:
                # ASM secret name (patched per claim from XR UID)
                key: ""
      patches:
        # ExternalSecret name = claim name. Claim name is conveyed
        # through claimRef on the XR.
        - type: FromCompositeFieldPath
          fromFieldPath: spec.claimRef.name
          toFieldPath: metadata.name

        # ExternalSecret namespace = claim's namespace, NOT the
        # composite's (composites are cluster-scoped — using composite
        # ns would land it in crossplane-system, defeating the
        # workload-in-its-own-namespace pattern).
        - type: FromCompositeFieldPath
          fromFieldPath: spec.claimRef.namespace
          toFieldPath: metadata.namespace

        # Target K8s Secret name = claim name (1:1 with the XR).
        - type: FromCompositeFieldPath
          fromFieldPath: spec.claimRef.name
          toFieldPath: spec.target.name

        # dataFrom.extract.key = the same ASM key the asm-secret
        # resource provisions.
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.uid
          toFieldPath: spec.dataFrom[0].extract.key
          transforms:
            - type: string
              string:
                fmt: "k8-platform/%s"

        # refreshInterval passthrough from XR spec.
        - type: FromCompositeFieldPath
          fromFieldPath: spec.refreshInterval
          toFieldPath: spec.refreshInterval

        # Publish ExternalSecret reference back to XR status.
        - type: ToCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: status.externalSecretRef.name
        - type: ToCompositeFieldPath
          fromFieldPath: metadata.namespace
          toFieldPath: status.externalSecretRef.namespace

      readinessChecks:
        - type: MatchCondition
          matchCondition:
            type: Ready
            status: "True"
