# PlatformSecret → (ASM secret + generated material + ExternalSecret)
# Composition.
#
# Crossplane v2 Pipeline mode (function-patch-and-transform).
#
# Renders five resources per claim (the material chain, 2026-06-11 —
# before it, the abstraction provisioned an EMPTY ASM container whose
# value was documented as written "out of band": a manual step the
# SUBSTRATE definition of done bans, which kept the secretsmanager
# Secret live-check SKIPped forever — no AWSCURRENT version):
#
#   1. An Upbound provider-family-aws `Secret` — the ASM container.
#      Named `k8-platform/<namespace>/<name>` — DETERMINISTIC (committed
#      manifests on other clusters can reference it, e.g. the spoke
#      keycloak-admin ExternalSecret) and collision-free across
#      namespaces exactly like the uid form it replaces (2026-06-11;
#      uid naming made cross-cluster consumption impossible).
#
#      recoveryWindowInDays=0 is intentional — chainsaw and integration
#      tests routinely create/delete the same name; the 7-day recovery
#      window would block re-creates.
#
#   2. An ESO `Password` generator (generators.external-secrets.io) —
#      the in-platform material source (ADR-0005: generatorRef is the
#      platform default for secret GENERATION).
#
#   3. A source ExternalSecret `<name>-material` with
#      refreshInterval "0" (generate ONCE — regenerating would rotate
#      the secret under its consumers) materializing {value: <generated>}.
#
#   4. A SecretVersion MR writing that value into the ASM container
#      (a JSON document {"value": <generated>} so the consumer's
#      dataFrom extract sees a map). Crossplane-native on purpose: an
#      ESO PushSecret refuses to write into a container it does not
#      own (managed-by tag check), and gating a push on the container
#      ARN added composite round-trips that blew the chainsaw Ready
#      bounds (runs 27385091105 / 27387201992). The SecretVersion MR
#      simply retries PutSecretValue until the container and the
#      source Secret both exist — parallel convergence, no gate, no
#      ownership semantics.
#
#   5. The consumer-facing ExternalSecret in the claim's namespace,
#      pulling every key out of that ASM secret via the shared
#      ClusterSecretStore.
#
# Crossplane v2 removed `spec.resources` from the v1 Composition schema
# (strict decoding rejects unknown fields, observed in chainsaw run
# 26344055485). The v2 path is `spec.mode: Pipeline` + a `pipeline` step
# using `function-patch-and-transform`, which accepts the legacy
# resources/patches input shape unchanged. The function package is
# installed alongside provider-family-aws (see
# terraform/management/helm.tf and tests/chainsaw/run.sh).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: platform-secret-aws
  labels:
    platform.k8-platform.io/abstraction: PlatformSecret
    platform.k8-platform.io/backend: aws
  annotations:
    # v2 migration (SEG-1 step 1c) — wave 0 lands AFTER the v2 XRDs
    # (wave -1) so the compositeTypeRef binds against the v2 XRD.
    argocd.argoproj.io/sync-wave: "0"
spec:
  compositeTypeRef:
    apiVersion: platform.k8-platform.io/v1alpha1
    kind: XPlatformSecret
  # v2 migration (SEG-1 step 1c) — `writeConnectionSecretsToNamespace`
  # is removed in v2; connection secrets are now written to the XR's
  # own namespace via the XR's spec.writeConnectionSecretToRef. For
  # PlatformSecret there is no XR-level connection secret to publish
  # (the ExternalSecret materializes the K8s Secret directly in the
  # claim/XR namespace), so no replacement field is needed here.
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:

          # ---------- 1. ASM secret (Upbound provider-family-aws) -----
          # v2 migration (SEG-1 step 1c):
          #   - apiVersion: secretsmanager.aws.upbound.io/v1beta1
          #       → secretsmanager.aws.m.upbound.io/v1beta1 (.m. infix
          #     marks the v2 "modern" CRD group shipped by Upbound v2.x)
          #   - deletionPolicy: Delete removed; replaced by
          #     managementPolicies: [Observe, Create, Update, Delete]
          #     which preserves the same full-lifecycle semantics under
          #     the v2 management-policies model.
          #   - providerConfigRef gains `kind: ClusterProviderConfig`
          #     (cluster-scoped variant; pre-committed by lead agent —
          #     one shared IRSA config for the platform).
          - name: asm-secret
            base:
              apiVersion: secretsmanager.aws.m.upbound.io/v1beta1
              kind: Secret
              spec:
                forProvider:
                  # name overwritten per claim (deterministic ns/name combine below)
                  recoveryWindowInDays: 0
                  region: us-east-1
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: PlatformSecret
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              # ASM secret name = k8-platform/<namespace>/<name> —
              # deterministic for committed cross-cluster consumers,
              # collision-free across namespaces (replaces the uid form,
              # which nothing committed could ever reference).
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.namespace
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: "k8-platform/%s/%s"
                toFieldPath: spec.forProvider.name

              # Region passthrough.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region

              # Description → AWS tag.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.description
                toFieldPath: spec.forProvider.tags.Description
                policy:
                  fromFieldPath: Optional

              # Publish the resulting ARN back to XR status.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.asmSecretArn

            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 2. Password generator (material source) ---------
          # ADR-0005: ESO generatorRef is the platform default for secret
          # generation. 32 chars, no symbols (symbol-safe across JSON/env
          # consumers; entropy ~190 bits).
          - name: password-generator
            base:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: Password
              spec:
                length: 32
                digits: 5
                symbols: 0
                symbolCharacters: ""
                noUpper: false
                allowRepeat: true
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-gen"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace
            # A generator CR carries no status conditions — the default
            # MatchCondition(Ready) readiness would hold the XR Unready
            # forever. Existence is its readiness.
            readinessChecks:
              - type: None

          # ---------- 3. source ExternalSecret (generate once) --------
          # refreshInterval "0": material is generated exactly once; a
          # refresh would regenerate and rotate the value underneath the
          # pushed copy and every consumer. deletionPolicy Retain keeps
          # the generated value if the ES is reconciled away.
          - name: material-secret
            base:
              apiVersion: external-secrets.io/v1beta1
              kind: ExternalSecret
              spec:
                refreshInterval: "0"
                target:
                  creationPolicy: Owner
                  deletionPolicy: Retain
                  template:
                    engineVersion: v2
                    data:
                      # The whole ASM payload as ONE JSON document — the
                      # SecretVersion MR puts this string verbatim; the
                      # consumer's dataFrom extract then sees {value: …}.
                      json: '{"value":"{{ .password }}"}'
                dataFrom:
                  - sourceRef:
                      generatorRef:
                        apiVersion: generators.external-secrets.io/v1alpha1
                        kind: Password
                        name: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-material"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-material"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.dataFrom[0].sourceRef.generatorRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-gen"
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 4. SecretVersion (value into the MR-owned shell) -
          # Crossplane-native value write: PutSecretValue retries until
          # the container (resource 1) and the source Secret (resource 3)
          # both exist — no ordering gate, no ESO ownership semantics
          # (see header). secretId = the same deterministic name the
          # container provisions; the source ref resolves in this MR's
          # own namespace (= the XR namespace).
          - name: material-version
            base:
              apiVersion: secretsmanager.aws.m.upbound.io/v1beta1
              kind: SecretVersion
              spec:
                forProvider:
                  region: us-east-1
                  secretStringSecretRef:
                    name: ""
                    key: json
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.namespace
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: "k8-platform/%s/%s"
                toFieldPath: spec.forProvider.secretId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.secretStringSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-material"
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 5. ExternalSecret in claim's namespace ----------
          - name: external-secret
            base:
              apiVersion: external-secrets.io/v1beta1
              kind: ExternalSecret
              spec:
                refreshInterval: 1h
                secretStoreRef:
                  kind: ClusterSecretStore
                  # MUST match clusters/management/eso/cluster-secret-
                  # store.yaml metadata.name. Cross-file invariant enforced
                  # by tests/unit/test_platform_secret_composition.sh.
                  name: aws-secrets-manager
                target:
                  creationPolicy: Owner
                  deletionPolicy: Delete
                dataFrom:
                  - extract:
                      # ASM secret name (patched per claim from XR UID)
                      key: ""
            patches:
              # v2 migration (SEG-1 step 1c) — spec.claimRef.{name,namespace}
              # patches rewritten to metadata.{name,namespace}. In v1 the
              # XR was cluster-scoped so it had no namespace of its own,
              # and the consumer's namespace came in via claimRef. In v2
              # the XR IS namespaced — its metadata.namespace is the
              # consumer's namespace by construction. claimRef no longer
              # exists.
              #
              # ExternalSecret name = XR name (was claim name).
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name

              # ExternalSecret namespace = XR namespace. In v2 the XR
              # lives in the user's namespace directly, so this lands
              # the ExternalSecret alongside the XR.
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: metadata.namespace

              # Target K8s Secret name = XR name (1:1).
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.target.name

              # dataFrom.extract.key = the same ASM key the asm-secret
              # resource provisions (deterministic ns/name form).
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.namespace
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: "k8-platform/%s/%s"
                toFieldPath: spec.dataFrom[0].extract.key

              # refreshInterval passthrough from XR spec.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.refreshInterval
                toFieldPath: spec.refreshInterval

              # Publish ExternalSecret reference back to XR status.
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.externalSecretRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: status.externalSecretRef.namespace

            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"
