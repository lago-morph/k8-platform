# Probe XPlatformCluster used by `crossplane render` for SPEC-S9 dry-run.
#
# v2 migration (SEG-1 step 1g): rewritten as a v2 namespaced XR.
# Phase 3: subnets/zone/domain are NO LONGER on the XR — they are
# account-ephemeral (AGENTS §8.1) and injected from the cluster-network
# EnvironmentConfig (see required-resources.yaml in this dir), which
# terraform/management materializes from the base Terraform output. The
# XR carries only stable values; spec.dns.subdomain is the per-cluster
# DNS label.
#
# Renders 14 managed resources: 2 IAM roles + 4 RolePolicyAttachments +
# EKS Cluster + NodeGroup + ACM Certificate + route53 Record +
# ACM CertificateValidation + SecurityGroupRule + AccessEntry +
# AccessPolicyAssociation, all under *.aws.m.upbound.io API groups.
#
# metadata.uid is pinned for deterministic render output (see SPEC-S9
# §5 "Diff strategy"). The render is fully offline; no real AWS resources
# are queried.
apiVersion: platform.k8-platform.io/v1alpha1
kind: XPlatformCluster
metadata:
  name: render-probe-cluster
  namespace: default
  uid: "00000000-0000-0000-0000-000000000002"
spec:
  name: render-probe
  region: us-east-1
  version: "1.32"
  dns:
    subdomain: platform
  nodeGroup:
    instanceTypes:
      - t3.medium
    desiredSize: 2
    minSize: 1
    maxSize: 3
