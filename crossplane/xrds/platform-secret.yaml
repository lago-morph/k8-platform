# PlatformSecret — the platform's secret abstraction (REQ-XP-01, REQ-XP-04).
#
# A claim against this XRD provisions:
#   1. An AWS Secrets Manager secret (storage + rotation backend)
#   2. An ExternalSecret in the claim's namespace (sync into a native
#      Kubernetes Secret that workloads consume)
#
# The claim author never names ASM or ESO — they say "I need a secret"
# and the platform handles the rest. This is the abstraction line per
# DESIGN.md §2.3.
#
# Schema is intentionally strict (x-kubernetes-preserve-unknown-fields:
# false implied by not setting it true). New fields require an XRD edit
# and a Composition update — silent passthrough is not desired.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xplatformsecrets.platform.k8-platform.io
  annotations:
    # v2 migration (SEG-1 step 1b) — XRDs land before Compositions
    # (wave 0). The cluster MUST be empty of v1 claims before this wave
    # applies; v1 claim CRDs disappear when the new XRD is admitted.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  group: platform.k8-platform.io
  # v2 migration (SEG-1 step 1b) — apiextensions.crossplane.io/v2 +
  # spec.scope: Namespaced replaces the v1 + claimNames model. XR is now
  # namespaced; users apply XPlatformSecret directly in their own
  # namespace — no separate claim type. See plan §1 / §2.
  scope: Namespaced
  names:
    kind: XPlatformSecret
    plural: xplatformsecrets
    listKind: XPlatformSecretList
    singular: xplatformsecret
  defaultCompositionRef:
    name: platform-secret-aws
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                refreshInterval:
                  type: string
                  description: >-
                    How often ESO refreshes the K8s Secret from ASM.
                    Go duration string (e.g. "1h", "30m"). Defaults to
                    "1h" if omitted — set lower in dev claims, higher
                    in steady-state to reduce ASM API spend.
                  pattern: "^[0-9]+(s|m|h)$"
                  default: "1h"
                description:
                  type: string
                  description: >-
                    Free-form description attached to the ASM secret as
                    a tag (Description=<value>). Surfaces in the AWS
                    console for operators looking at the secret.
                  maxLength: 256
                region:
                  type: string
                  description: >-
                    AWS region for the ASM secret. Defaults to
                    us-east-1; override when the consuming workload
                    lives elsewhere to avoid cross-region GetSecretValue.
                  pattern: "^[a-z]{2}-[a-z]+-[0-9]$"
                  default: "us-east-1"
              required: []
            status:
              type: object
              properties:
                asmSecretArn:
                  type: string
                  description: ARN of the underlying ASM secret once created.
                externalSecretRef:
                  type: object
                  description: Reference to the created ExternalSecret.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
