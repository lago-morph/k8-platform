# Example v2 XR — apply in your namespace; no separate claim needed.
#
# kubeconform-skip — `subnet-REPLACE-ME-AZ*` placeholders are
# documentation; this example is a copy/paste starting point that the
# user edits with real subnet IDs before applying. The XRD's
# `^subnet-[a-z0-9]+$` regex remains the load-bearing admission gate.
# SPEC-S6 §5.4 allowlist.
#
# Example XPlatformCluster — copy/paste starting point.
#
# v2 migration (SEG-1 step 1d): under Crossplane v2 there is no
# separate `PlatformCluster` claim type — XPlatformCluster is the
# user-facing namespaced XR (apiextensions.crossplane.io/v2 + scope:
# Namespaced). The XR's spec.writeConnectionSecretToRef.name controls
# where the kubeconfig secret lands (in the XR's namespace; v1's
# `writeConnectionSecretsToNamespace: crossplane-system` removed).
#
# WARNING: applying this `kubectl apply -f` will create a REAL EKS
# cluster + managed node group in AWS. Provisioning takes ~15 minutes.
# Teardown is ~10 minutes more.
#
# Substitute spec.vpc.subnetIds with the actual private subnet IDs
# from your base module's output (terraform output -json | jq).
#
# After apply:
#   - kubectl get xplatformcluster -A
#   - kubectl get cluster.eks.aws.m.upbound.io
#   - kubectl get nodegroup.eks.aws.m.upbound.io
#   - aws eks describe-cluster --name workload1 --region us-east-1
apiVersion: platform.k8-platform.io/v1alpha1
kind: XPlatformCluster
metadata:
  name: workload1
  namespace: default
spec:
  name: k8-platform-workload1
  region: us-east-1
  version: "1.32"
  vpc:
    subnetIds:
      - subnet-REPLACE-ME-AZ1
      - subnet-REPLACE-ME-AZ2
  nodeGroup:
    instanceTypes: ["t3.medium"]
    desiredSize: 2
    minSize: 1
    maxSize: 3
  # v2 NOTE: XR-level connection secrets aren't supported by
  # apiextensions.crossplane.io/v2 — `writeConnectionSecretToRef`
  # on the XR is rejected by the v2 admission webhook. Phase 3
  # consumers should read kubeconfig from the EKS Cluster MR's
  # own connection-secret instead.
