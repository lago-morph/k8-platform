# Example XPlatformCluster — copy/paste starting point.
#
# v2 migration (SEG-1 step 1d): under Crossplane v2 there is no separate
# `PlatformCluster` claim type — XPlatformCluster is the user-facing
# namespaced XR (apiextensions.crossplane.io/v2 + scope: Namespaced).
#
# Phase 3: the cluster's networking and DNS root (private subnet IDs,
# Route53 zone id, root domain) are account-ephemeral and are NOT set on
# the XR. They are injected from the base Terraform output via the
# `cluster-network` Crossplane EnvironmentConfig that terraform/management
# materializes (ADR-e557a40123 / docs/decisions/0003). The XR carries only
# stable values, so this example needs no per-account edits — no
# placeholders, no kubeconform-skip.
#
# WARNING: applying this with `kubectl apply -f` will provision a REAL EKS
# cluster + managed node group + a DNS-validated wildcard ACM certificate
# (`*.<subdomain>.<domain>`) in AWS. Provisioning takes ~15-20 minutes.
#
# After apply:
#   - kubectl get xplatformcluster -A
#   - kubectl get cluster.eks.aws.m.upbound.io
#   - kubectl get nodegroup.eks.aws.m.upbound.io
#   - kubectl get certificate.acm.aws.m.upbound.io
#   - kubectl get certificatevalidation.acm.aws.m.upbound.io
apiVersion: platform.k8-platform.io/v1alpha1
kind: XPlatformCluster
metadata:
  name: workload1
  namespace: default
spec:
  name: k8-platform-workload1
  region: us-east-1
  version: "1.32"
  dns:
    # DNS label for this cluster: services land at
    # <service>.workload1.<domain>; the wildcard ACM cert covers
    # *.workload1.<domain>.
    subdomain: workload1
  nodeGroup:
    instanceTypes: ["t3.medium"]
    desiredSize: 2
    minSize: 1
    maxSize: 3
