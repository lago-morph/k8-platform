# Example v2 XR — apply in your namespace; no separate claim needed.
#
# Example XPlatformSecret — copy/paste starting point. NOT applied
# automatically by any Application; if you `kubectl apply -f` this, it
# WILL create real AWS Secrets Manager resources.
#
# v2 migration (SEG-1 step 1d): under Crossplane v2 there is no
# separate `PlatformSecret` claim type — the XPlatformSecret XR is
# itself namespaced (apiextensions.crossplane.io/v2 + scope:
# Namespaced) and is applied directly by the consumer in their own
# namespace. The XRD CRD is the single user-facing kind.
#
# After apply:
#   - kubectl get xplatformsecret -A
#   - kubectl get externalsecret -n default sample-app-credentials
#   - kubectl get secret -n default sample-app-credentials
#     (the K8s Secret materializes after ESO's first sync, ~ refreshInterval)
apiVersion: platform.k8-platform.io/v1alpha1
kind: XPlatformSecret
metadata:
  name: sample-app-credentials
  namespace: default
spec:
  refreshInterval: 1h
  region: us-east-1
  description: "Example XR — sample app DB credentials"
