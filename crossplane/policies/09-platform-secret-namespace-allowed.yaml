# Audit policy: PlatformSecret claims may only be created in allowlisted
# namespaces.
#
# Why: an unrestricted PlatformSecret would let any namespace tenant
# create an ASM secret under the k8-platform/ prefix, paying real money
# and consuming account quota. Audit mode (not Enforce) — surface
# violations in policy reports without blocking admission; promote to
# Enforce after a soak period.
#
# Allowlist starts with the namespaces the platform itself uses
# (platform, apps) plus `default` for development/example claims. Add
# new tenants by appending to spec.rules[0].validate.deny.conditions.
#
# Lives in crossplane/policies/ — NOT policies/audit/ — because Kyverno
# validates the referenced kinds (PlatformSecret) at policy admission
# time. The XRD CRD only exists after ArgoCD syncs crossplane/xrds/.
# policies/audit/ is applied by Terraform during management bring-up,
# before any XRD lands, which produced "unable to convert GVK to GVR
# for kinds PlatformSecret" in run 26346063415. ArgoCD syncs this
# directory with sync-wave: 1 (XRDs are wave 0) so the kind always
# exists when the policy admits.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: platform-secret-namespace-allowed
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Suppress Kyverno autogen — without this, Kyverno injects synthetic
    # rules for Pod controllers (Deployment/StatefulSet/etc.) into the
    # live ClusterPolicy, which ArgoCD then sees as drift on every sync.
    # PlatformSecret is not a Pod kind so autogen produces nothing
    # useful here anyway. Bug-of-record: phase-2-diagnose 26351930369.
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: PlatformSecret claims restricted to allowlisted namespaces
    policies.kyverno.io/category: PlatformAbstraction
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      A PlatformSecret claim provisions a real ASM secret (real money,
      real account quota). Constrain claim creation to namespaces the
      platform operator has explicitly opted in.
spec:
  validationFailureAction: Audit
  # background + admission are both true by default — but Kyverno
  # injects them into the live object when absent, which ArgoCD then
  # reports as drift. Set explicitly so the source already matches the
  # state Kyverno would default to. Same bug-of-record as above.
  background: true
  admission: true
  rules:
    - name: claim-namespace-allowlist
      match:
        any:
          - resources:
              kinds:
                - PlatformSecret
      validate:
        message: >-
          PlatformSecret claim {{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}
          is in a non-allowlisted namespace. Allowed: platform, apps, default.
          To allow a new namespace, edit
          policies/audit/09-platform-secret-namespace-allowed.yaml.
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.namespace }}"
                operator: NotIn
                value:
                  - platform
                  - apps
                  - default
