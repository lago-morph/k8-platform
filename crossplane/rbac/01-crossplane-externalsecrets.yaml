# Crossplane 2.3's composite reconciler uses Server-Side Apply and
# enforces RBAC strictly when applying composed resources. The
# PlatformSecret Composition renders TWO resources per claim:
#
#   1. secretsmanager.aws.upbound.io/v1beta1 Secret — managed by the
#      Upbound AWS provider package. Crossplane's package manager
#      auto-grants the core Crossplane SA RBAC for any kind installed
#      by a provider package, so this works out of the box.
#
#   2. external-secrets.io/v1beta1 ExternalSecret — NOT a Crossplane
#      provider; ESO installs the CRD itself. Crossplane has no
#      knowledge of it and therefore no auto-RBAC. Without explicit
#      RBAC, the composite reconciler logs:
#        cannot compose resources: cannot get existing composed
#        resources: cannot get composed resource: Timeout: failed
#        waiting for *unstructured.Unstructured Informer to sync
#      with a paired RoleBasedAccessControl warning event:
#        crossplane-system:crossplane is not allowed to [get list
#        watch create update patch delete] externalsecrets/status
#        .external-secrets.io/v1beta1
#      The composite never reaches Ready; the claim never reaches Ready.
#
# Bug-of-record: chainsaw run 26385825898 on Crossplane 2.3.0. The
# same Composition was passing on 2.0.1 because v2.0's composite
# reconciler did not enforce RBAC at this point in the pipeline.
#
# This grant is scoped to exactly the verbs the composite reconciler
# uses (matches Crossplane's standard ClusterRole verb set for MR
# kinds). External-Secrets resources covered: ExternalSecret (with its
# status subresource) and the Password generator (the platform-secret
# material source). We do NOT grant the broader groups
# (ClusterSecretStore, SecretStore, PushSecret, other generators)
# because Compositions render only these kinds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-composite-externalsecrets
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "externalsecrets/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["generators.external-secrets.io"]
    resources: ["passwords"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-composite-externalsecrets
subjects:
  - kind: ServiceAccount
    name: crossplane
    namespace: crossplane-system
roleRef:
  kind: ClusterRole
  name: crossplane-composite-externalsecrets
  apiGroup: rbac.authorization.k8s.io
